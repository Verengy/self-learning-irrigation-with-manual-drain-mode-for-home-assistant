                name: Nur Maintenance-Startwerte setzen
              - entity: script.plantinator_bewasserung_crop_steering_standardwerte_setzen
                name: Crop-Standardwerte setzen
          - type: markdown
            title: Wirkung der Werte
            content: >
              **Start** und **Stop** begrenzen das Bewässerungsfenster relativ
              zur Lichtzeit. Nach dem Start wartet jede Pflanze auf
              `Peak − Dryback`. Im **Ramp-up** wird der gesamte Wasserverlust
              mit kleineren Shots als vollständige Sequenz ausgeglichen.
              Hauptsequenz, Feedback und ein eventuell nötiger Nachguss gehören
              dabei zu demselben Ramp-up. Der gemessene Peak muss im
              einstellbaren Fenster `Referenz ± Peak-Toleranz` liegen. Unterhalb
              folgt genau ein begrenzter Nachguss. Ist weniger Wasser erlaubt
              als berechnet, wird nur die noch erlaubte Menge abgegeben. Ein
              danach zu niedriger Peak erzeugt eine Warnung, verriegelt die
              Anlage aber nicht. Ein zu hoher Peak stoppt und verriegelt das
              System. Nach erfolgreichem Feedback folgt **Maintenance** mit
              normalen Shots und dem Maintenance-Dryback der aktiven Rezeptur.
              Beide Drybacks sind absolute Differenzen in den Prozentwerten
              des Feuchtesensors. Shot-Min/Max,
              maximale Shot-Anzahl, Sicherheitsminimum, Tageslimit und alle
              EXEC-Sperren bleiben harte Grenzen.
