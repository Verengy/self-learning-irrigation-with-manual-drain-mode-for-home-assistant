title: Universelle selbstlernende Bewässerungssteuerung für Home Assistant
views:
  - title: Übersicht
    path: plantinator-bewasserung
    icon: mdi:water-pump
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Systemfreigaben
            heading_style: title
            icon: mdi:shield-check
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Hauptschalter
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automatik
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: Sperre
            color: red
          - type: tile
            entity: input_boolean.plantinator_bewasserung_exec_laeuft
            name: EXEC läuft
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_laeuft
            name: Shot EXEC läuft
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_reserviert
            name: Shot EXEC reserviert
            color: yellow
          - type: tile
            entity: input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft
            name: Umwälzung läuft
            color: blue
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Alarm quittieren
            color: green
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state: bereit
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Alarm quittieren
            color: red
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state:
                  - verriegelt
                  - fehler_nicht_quittierbar
          - type: tile
            entity: script.plantinator_bewasserung_sicher_stop
            name: NOTAUS
            color: red
            tap_action:
              action: call-service
              service: script.plantinator_bewasserung_sicher_stop
          - type: entities
            title: Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_mapping_status
                name: Mapping Status
              - entity: sensor.plantinator_bewasserung_aktor_sicherheitsstatus
                name: Aktor Sicherheitsstatus
              - entity: sensor.plantinator_bewasserung_profil_status
                name: Profil Status
              - entity: sensor.plantinator_bewasserung_exec_freigabe
                name: EXEC Freigabe
              - entity: sensor.plantinator_bewasserung_shot_exec_freigabe
                name: Shot EXEC Freigabe
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Auto Grundfreigabe
              - entity: sensor.plantinator_bewasserung_tank_umwalzung_freigabe
                name: Umwälzung Freigabe
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Gesamt Gussbedarf
              - entity: sensor.plantinator_bewasserung_mess_drain_status
                name: Mess-Drain Status
              - entity: sensor.plantinator_bewasserung_alarm_status
                name: Alarm Status
              - entity: sensor.plantinator_bewasserung_kritischer_systemstatus
                name: Kritischer Systemstatus
              - entity: sensor.plantinator_bewasserung_sensoralter_status
                name: Sensoralter Status
      - type: grid
        cards:
          - type: heading
            heading: Auto-Kurzstatus
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: timer.plantinator_bewasserung_shot_exec_wartezeit
            name: Shot-EXEC Wartezeit
            color: orange
          - type: markdown
            title: Systemstatus im Klartext
            content: |
              {% set auto = states('sensor.plantinator_bewasserung_auto_status') %}
              {% set grund = states('sensor.plantinator_bewasserung_auto_grundfreigabe') %}
              {% set crop = states('sensor.plantinator_bewasserung_auto_crop_freigabe') %}
              {% set nextp = states('sensor.plantinator_bewasserung_auto_naechste_pflanze') %}
              {% set exec = states('sensor.plantinator_bewasserung_exec_status') %}
              {% set shot = states('sensor.plantinator_bewasserung_shot_exec_status') %}
              {% set umwaelzung = states('input_text.plantinator_bewasserung_tank_umwalzung_status') %}
              {% set letzter = states('input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status') %}
              {% set auto_map = {
                'bereit': 'Bereit',
                'kein_guss_faellig': 'Keine Bewässerung erforderlich',
                'warte_shot_exec_laeuft': 'Wartet auf laufende Shot-Sequenz',
                'sicher_stop': 'Sicher gestoppt',
                'sicher_stop_durch_freigabe': 'Durch fehlende Freigabe sicher gestoppt'
              } %}
              {% set grund_map = {
                'frei': 'Freigegeben',
                'auto_controller_aus': 'Auto-Controller ist ausgeschaltet',
                'hauptschalter_aus': 'Hauptschalter ist ausgeschaltet',
                'automatik_aus': 'Automatik ist ausgeschaltet',
                'sperre_aktiv': 'System ist gesperrt',
                'shot_exec_nicht_frei': 'Shot-Sequenz ist noch beschäftigt',
                'alarm_verriegelt': 'Alarm ist verriegelt'
              } %}
              {% set crop_map = {
                'normal_erlaubt': 'Normalguss erlaubt',
                'nur_notguss': 'Nur Notguss erlaubt',
                'nur_notguss_erlaubt': 'Nur Notguss erlaubt',
                'sicherheitsmodus': 'Sicherheitsmodus – kein Normalguss',
                'crop_blockiert': 'Durch Crop-Steering blockiert'
              } %}
              {% set auto_text = ('Startet Bewässerung für Pflanze ' ~ auto.split('_p')[1].split('_')[0])
                if auto.startswith('starte_p') else
                ('Blockiert: ' ~ auto.replace('blockiert_', '').replace('_', ' '))
                if auto.startswith('blockiert_') else
                auto_map.get(auto, auto.replace('_', ' ') | capitalize) %}
              {% set exec_text = 'Bereit' if exec == 'bereit' else
                ('Bewässerung für Pflanze ' ~ exec.split('_p')[1].split('_')[0] ~ ' abgeschlossen')
                if exec.startswith('normalguss_fertig_p') else
                ('Shot für Pflanze ' ~ exec.split('_p')[1].split('_')[0] ~ ' abgeschlossen')
                if exec.startswith('shot_plan_fertig_p') else
                ('Bewässerung für Pflanze ' ~ exec.split('_p')[1].split('_')[0] ~ ' wird vorbereitet')
                if exec.startswith('normalguss_angefordert_p') else
                ('Shot für Pflanze ' ~ exec.split('_p')[1].split('_')[0] ~ ' wird vorbereitet')
                if exec.startswith('shot_plan_angefordert_p') else
                'Sicher gestoppt' if exec in ['sicher_stop', 'startup_sicher_stop'] else
                ('Hardwarefehler: ' ~ exec.replace('hardwarefehler_', '').replace('_', ' '))
                if exec.startswith('hardwarefehler_') else
                ('Vorgang blockiert: ' ~ exec.replace('blockiert_', '').replace('_', ' '))
                if exec.startswith('blockiert_') else exec.replace('_', ' ') | capitalize %}
              {% set shot_text = 'Bereit' if shot == 'bereit' else
                ('Shot-Sequenz abgeschlossen')
                if shot.startswith('fertig_p') else
                ('Wartet auf Feuchteauswertung')
                if 'warte_feedback' in shot else
                ('Shot-Sequenz läuft')
                if shot.startswith('p') else shot.replace('_', ' ') | capitalize %}
              {% set umwaelzung_text = 'Bereit' if umwaelzung == 'bereit' else
                'Vor dem Guss nicht erforderlich' if umwaelzung == 'pre_guss_nicht_noetig' else
                'Zyklische Umwälzung abgeschlossen' if umwaelzung.startswith('zyklisch_fertig') else
                umwaelzung.replace('_', ' ') | capitalize %}

              | Bereich | Bedeutung |
              |---|---|
              | Automatik | **{{ auto_text }}**<br><small>`{{ auto }}`</small> |
              | Grundfreigabe | **{{ grund_map.get(grund, grund.replace('_', ' ') | capitalize) }}**<br><small>`{{ grund }}`</small> |
              | Crop-Steering | **{{ crop_map.get(crop, crop.replace('_', ' ') | capitalize) }}**<br><small>`{{ crop }}`</small> |
              | Nächste Pflanze | **{{ 'Keine' if nextp == 'keine' else 'Pflanze ' ~ nextp }}** |
              | Bewässerung | **{{ exec_text }}**<br><small>`{{ exec }}`</small> |
              | Shot-Sequenz | **{{ shot_text }}**<br><small>`{{ shot }}`</small> |
              | Tank-Umwälzung | **{{ umwaelzung_text }}**<br><small>`{{ umwaelzung }}`</small> |
              | Tageszähler | **{{ 'Noch kein Guss verbucht' if letzter in ['keiner', 'unknown', 'unavailable'] else 'Letzter Guss wurde verbucht' }}**<br><small>`{{ letzter }}`</small> |
          - type: grid
            title: Pflanzenübersicht
            columns: 2
            square: false
            cards:
              - type: markdown
                content: |
                  {% set p = 1 %}
                  {% set name = states('input_text.plantinator_bewasserung_p1_name') %}
                  {% set feuchte = states('sensor.plantinator_bewasserung_p1_bodenfeuchte_wert') %}
                  {% set zustand = states('sensor.plantinator_bewasserung_p1_feuchtezustand') %}
                  {% set bedarf = states('sensor.plantinator_bewasserung_p1_gussbedarf') %}
                  {% set auto = states('sensor.plantinator_bewasserung_auto_p1_freigabe') %}
                  {% set zustand_map = {'trocken': 'Trocken', 'unter_ziel': 'Unter Ziel', 'zielbereich': 'Im Zielbereich', 'zu_feucht': 'Zu feucht', 'sensorfehler': 'Sensorfehler'} %}
                  {% set auto_map = {'frei': 'Freigegeben', 'kein_bedarf': 'Kein Bedarf', 'pause': 'Mindestpause', 'feedback_ausstehend': 'Wartet auf Auswertung', 'crop_blockiert': 'Crop-Steering blockiert', 'nur_notguss_erlaubt': 'Nur Notguss', 'tageslimit': 'Tageslimit erreicht', 'inaktiv': 'Inaktiv', 'sensor_nicht_aktuell': 'Sensorwert zu alt'} %}
                  {% set symbol = '🔴' if zustand in ['trocken', 'sensorfehler'] else '🟠' if zustand == 'unter_ziel' else '🟢' if zustand == 'zielbereich' else '🔵' if zustand == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set gesamt = state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P1 · {{ 'Pflanze 1' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (feuchte | float(0) | round(1)) if is_number(feuchte) else '–' }} %** · {{ zustand_map.get(zustand, zustand.replace('_', ' ') | capitalize) }}

                  💧 **Bedarf:** {{ 'Ja' if bedarf == 'ja' else 'Nein' if bedarf == 'nein' else bedarf }}<br>
                  🤖 **Auto:** {{ auto_map.get(auto, auto.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Empfohlen:** {{ states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Heute:** {{ states('input_number.plantinator_bewasserung_p1_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ gesamt }} ml
              - type: markdown
                content: |
                  {% set p = 2 %}
                  {% set name = states('input_text.plantinator_bewasserung_p2_name') %}
                  {% set feuchte = states('sensor.plantinator_bewasserung_p2_bodenfeuchte_wert') %}
                  {% set zustand = states('sensor.plantinator_bewasserung_p2_feuchtezustand') %}
                  {% set bedarf = states('sensor.plantinator_bewasserung_p2_gussbedarf') %}
                  {% set auto = states('sensor.plantinator_bewasserung_auto_p2_freigabe') %}
                  {% set zustand_map = {'trocken': 'Trocken', 'unter_ziel': 'Unter Ziel', 'zielbereich': 'Im Zielbereich', 'zu_feucht': 'Zu feucht', 'sensorfehler': 'Sensorfehler'} %}
                  {% set auto_map = {'frei': 'Freigegeben', 'kein_bedarf': 'Kein Bedarf', 'pause': 'Mindestpause', 'feedback_ausstehend': 'Wartet auf Auswertung', 'crop_blockiert': 'Crop-Steering blockiert', 'nur_notguss_erlaubt': 'Nur Notguss', 'tageslimit': 'Tageslimit erreicht', 'inaktiv': 'Inaktiv', 'sensor_nicht_aktuell': 'Sensorwert zu alt'} %}
                  {% set symbol = '🔴' if zustand in ['trocken', 'sensorfehler'] else '🟠' if zustand == 'unter_ziel' else '🟢' if zustand == 'zielbereich' else '🔵' if zustand == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set gesamt = state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P2 · {{ 'Pflanze 2' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (feuchte | float(0) | round(1)) if is_number(feuchte) else '–' }} %** · {{ zustand_map.get(zustand, zustand.replace('_', ' ') | capitalize) }}

                  💧 **Bedarf:** {{ 'Ja' if bedarf == 'ja' else 'Nein' if bedarf == 'nein' else bedarf }}<br>
                  🤖 **Auto:** {{ auto_map.get(auto, auto.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Empfohlen:** {{ states('sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Heute:** {{ states('input_number.plantinator_bewasserung_p2_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ gesamt }} ml
              - type: markdown
                content: |
                  {% set p = 3 %}
                  {% set name = states('input_text.plantinator_bewasserung_p3_name') %}
                  {% set feuchte = states('sensor.plantinator_bewasserung_p3_bodenfeuchte_wert') %}
                  {% set zustand = states('sensor.plantinator_bewasserung_p3_feuchtezustand') %}
                  {% set bedarf = states('sensor.plantinator_bewasserung_p3_gussbedarf') %}
                  {% set auto = states('sensor.plantinator_bewasserung_auto_p3_freigabe') %}
                  {% set zustand_map = {'trocken': 'Trocken', 'unter_ziel': 'Unter Ziel', 'zielbereich': 'Im Zielbereich', 'zu_feucht': 'Zu feucht', 'sensorfehler': 'Sensorfehler'} %}
                  {% set auto_map = {'frei': 'Freigegeben', 'kein_bedarf': 'Kein Bedarf', 'pause': 'Mindestpause', 'feedback_ausstehend': 'Wartet auf Auswertung', 'crop_blockiert': 'Crop-Steering blockiert', 'nur_notguss_erlaubt': 'Nur Notguss', 'tageslimit': 'Tageslimit erreicht', 'inaktiv': 'Inaktiv', 'sensor_nicht_aktuell': 'Sensorwert zu alt'} %}
                  {% set symbol = '🔴' if zustand in ['trocken', 'sensorfehler'] else '🟠' if zustand == 'unter_ziel' else '🟢' if zustand == 'zielbereich' else '🔵' if zustand == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set gesamt = state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P3 · {{ 'Pflanze 3' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (feuchte | float(0) | round(1)) if is_number(feuchte) else '–' }} %** · {{ zustand_map.get(zustand, zustand.replace('_', ' ') | capitalize) }}

                  💧 **Bedarf:** {{ 'Ja' if bedarf == 'ja' else 'Nein' if bedarf == 'nein' else bedarf }}<br>
                  🤖 **Auto:** {{ auto_map.get(auto, auto.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Empfohlen:** {{ states('sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Heute:** {{ states('input_number.plantinator_bewasserung_p3_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ gesamt }} ml
              - type: markdown
                content: |
                  {% set p = 4 %}
                  {% set name = states('input_text.plantinator_bewasserung_p4_name') %}
                  {% set feuchte = states('sensor.plantinator_bewasserung_p4_bodenfeuchte_wert') %}
                  {% set zustand = states('sensor.plantinator_bewasserung_p4_feuchtezustand') %}
                  {% set bedarf = states('sensor.plantinator_bewasserung_p4_gussbedarf') %}
                  {% set auto = states('sensor.plantinator_bewasserung_auto_p4_freigabe') %}
                  {% set zustand_map = {'trocken': 'Trocken', 'unter_ziel': 'Unter Ziel', 'zielbereich': 'Im Zielbereich', 'zu_feucht': 'Zu feucht', 'sensorfehler': 'Sensorfehler'} %}
                  {% set auto_map = {'frei': 'Freigegeben', 'kein_bedarf': 'Kein Bedarf', 'pause': 'Mindestpause', 'feedback_ausstehend': 'Wartet auf Auswertung', 'crop_blockiert': 'Crop-Steering blockiert', 'nur_notguss_erlaubt': 'Nur Notguss', 'tageslimit': 'Tageslimit erreicht', 'inaktiv': 'Inaktiv', 'sensor_nicht_aktuell': 'Sensorwert zu alt'} %}
                  {% set symbol = '🔴' if zustand in ['trocken', 'sensorfehler'] else '🟠' if zustand == 'unter_ziel' else '🟢' if zustand == 'zielbereich' else '🔵' if zustand == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set gesamt = state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P4 · {{ 'Pflanze 4' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (feuchte | float(0) | round(1)) if is_number(feuchte) else '–' }} %** · {{ zustand_map.get(zustand, zustand.replace('_', ' ') | capitalize) }}

                  💧 **Bedarf:** {{ 'Ja' if bedarf == 'ja' else 'Nein' if bedarf == 'nein' else bedarf }}<br>
                  🤖 **Auto:** {{ auto_map.get(auto, auto.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Empfohlen:** {{ states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Heute:** {{ states('input_number.plantinator_bewasserung_p4_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ gesamt }} ml
      - type: grid
        cards:
          - type: heading
            heading: Verläufe
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Bodenfeuchte Verlauf
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_p1_bodenfeuchte_wert
                name: P1
              - entity: sensor.plantinator_bewasserung_p2_bodenfeuchte_wert
                name: P2
              - entity: sensor.plantinator_bewasserung_p3_bodenfeuchte_wert
                name: P3
              - entity: sensor.plantinator_bewasserung_p4_bodenfeuchte_wert
                name: P4
          - type: history-graph
            title: Gussbedarf / Auto
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Gesamt Bedarf
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Nächste Pflanze
              - entity: sensor.plantinator_bewasserung_shot_exec_status
                name: Shot EXEC
  - title: Automatik
    path: plantinator-bewasserung-automatik
    icon: mdi:robot
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Automatik Freigaben
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automatik
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Hauptschalter
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: Sperre
            color: red
          - type: entities
            title: Auto Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_status
                name: Auto Status
              - entity: input_text.plantinator_bewasserung_auto_status
                name: Auto Status Input
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Grundfreigabe
              - entity: sensor.plantinator_bewasserung_auto_crop_freigabe
                name: Crop Freigabe
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Nächste Pflanze
              - entity: input_text.plantinator_bewasserung_auto_letzte_pflanze
                name: Letzte Pflanze
              - entity: >-
                  input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status
                name: Letzter gezählter Status
              - entity: input_datetime.plantinator_bewasserung_auto_letzter_check
                name: Letzter Auto-Check
              - entity: script.plantinator_bewasserung_auto_check
                name: Auto Check jetzt
              - entity: script.plantinator_bewasserung_auto_standardwerte_setzen
                name: Auto Standardwerte setzen
      - type: grid
        cards:
          - type: heading
            heading: Pflanzenfreigaben
            heading_style: title
            icon: mdi:sprout
          - type: entities
            title: P1 / P2
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p1_freigabe
                name: P1 Auto Freigabe
              - entity: sensor.plantinator_bewasserung_p1_gussbedarf
                name: P1 Gussbedarf
              - entity: sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml
                name: P1 Empfehlung ml
              - entity: input_datetime.plantinator_bewasserung_auto_p1_letzter_start
                name: P1 letzter Auto Start
              - entity: sensor.plantinator_bewasserung_auto_p2_freigabe
                name: P2 Auto Freigabe
              - entity: sensor.plantinator_bewasserung_p2_gussbedarf
                name: P2 Gussbedarf
              - entity: sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml
                name: P2 Empfehlung ml
              - entity: input_datetime.plantinator_bewasserung_auto_p2_letzter_start
                name: P2 letzter Auto Start
          - type: entities
            title: P3 / P4
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p3_freigabe
                name: P3 Auto Freigabe
              - entity: sensor.plantinator_bewasserung_p3_gussbedarf
                name: P3 Gussbedarf
              - entity: sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml
                name: P3 Empfehlung ml
              - entity: input_datetime.plantinator_bewasserung_auto_p3_letzter_start
                name: P3 letzter Auto Start
              - entity: sensor.plantinator_bewasserung_auto_p4_freigabe
                name: P4 Auto Freigabe
              - entity: sensor.plantinator_bewasserung_p4_gussbedarf
                name: P4 Gussbedarf
