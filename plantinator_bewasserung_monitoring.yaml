            {{ [fa, ta] | max | round(1) }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          bodenfeuchte_alter_minuten: >
            {% set ent = states('input_text.plantinator_bewasserung_p4_bodenfeuchte_entity') | trim %}
            {% if ent.startswith('sensor.') and has_value(ent) and is_number(states(ent)) %}
              {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
              {{ [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max | round(1) }}
            {% else %}
              unknown
            {% endif %}
          bodentemperatur_alter_minuten: >
            {% set ent = states('input_text.plantinator_bewasserung_p4_bodentemperatur_entity') | trim %}
            {% if ent.startswith('sensor.') and has_value(ent) and is_number(states(ent)) %}
              {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
              {{ [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max | round(1) }}
            {% else %}
              unknown
            {% endif %}

      - name: Plantinator Bewasserung Sensoralter Status
        unique_id: plantinator_bewasserung_sensoralter_status
        icon: mdi:timer-alert-outline
        state: >
          {% set grenze = states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') | float(15) %}
          {% set anzahl = states('input_number.plantinator_bewasserung_anzahl_pflanzen') | int(4) %}
          {% set ns = namespace(status='ok') %}
          {% for i in range(1, anzahl + 1) %}
            {% if ns.status == 'ok' and is_state('input_boolean.plantinator_bewasserung_p' ~ i ~ '_aktiv', 'on') %}
              {% set f = states('input_text.plantinator_bewasserung_p' ~ i ~ '_bodenfeuchte_entity') | trim %}
              {% set t = states('input_text.plantinator_bewasserung_p' ~ i ~ '_bodentemperatur_entity') | trim %}
              {% if not f.startswith('sensor.') or not has_value(f) or not is_number(states(f)) %}
                {% set ns.status = 'p' ~ i ~ '_bodenfeuchte_ungueltig' %}
              {% elif not t.startswith('sensor.') or not has_value(t) or not is_number(states(t)) %}
                {% set ns.status = 'p' ~ i ~ '_bodentemperatur_ungueltig' %}
              {% else %}
                {% set fzeit = states[f].last_reported if states[f].last_reported is defined else states[f].last_updated %}
                {% set tzeit = states[t].last_reported if states[t].last_reported is defined else states[t].last_updated %}
                {% set fa = [0, (as_timestamp(now()) - as_timestamp(fzeit)) / 60] | max %}
                {% set ta = [0, (as_timestamp(now()) - as_timestamp(tzeit)) / 60] | max %}
                {% if fa > grenze %}
                  {% set ns.status = 'p' ~ i ~ '_bodenfeuchte_veraltet' %}
                {% elif ta > grenze %}
                  {% set ns.status = 'p' ~ i ~ '_bodentemperatur_veraltet' %}
                {% endif %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {{ ns.status }}
        attributes:
          max_alter_minuten: "{{ states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') }}"
          p1_alter_minuten: "{{ states('sensor.plantinator_bewasserung_p1_sensoralter') }}"
          p2_alter_minuten: "{{ states('sensor.plantinator_bewasserung_p2_sensoralter') }}"
          p3_alter_minuten: "{{ states('sensor.plantinator_bewasserung_p3_sensoralter') }}"
          p4_alter_minuten: "{{ states('sensor.plantinator_bewasserung_p4_sensoralter') }}"

      - name: Plantinator Bewasserung VPD
        unique_id: plantinator_bewasserung_vpd
        icon: mdi:cloud-percent
        unit_of_measurement: "kPa"
        state_class: measurement
        state: >
          {% set traw = states('sensor.plantinator_bewasserung_lufttemperatur') %}
          {% set hraw = states('sensor.plantinator_bewasserung_luftfeuchtigkeit') %}
          {% if is_number(traw) and is_number(hraw) %}
            {% set t = traw | float %}
            {% set rh = hraw | float %}
            {% if -20 <= t <= 60 and 0 <= rh <= 100 %}
              {% set svp = 0.61078 * (e ** ((17.2694 * t) / (t + 237.3))) %}
              {{ (svp * (1 - rh / 100)) | round(2) }}
            {% else %}
              unknown
            {% endif %}
          {% else %}
            unknown
          {% endif %}
        attributes:
          lufttemperatur: "{{ states('sensor.plantinator_bewasserung_lufttemperatur') }}"
          luftfeuchtigkeit: "{{ states('sensor.plantinator_bewasserung_luftfeuchtigkeit') }}"
          verwendung: protokollierung_und_optional_umweltfaktor

      - name: Plantinator Bewasserung DLI
        unique_id: plantinator_bewasserung_dli
        icon: mdi:weather-sunny
        unit_of_measurement: "mol/m²/d"
        state_class: measurement
        state: >
          {% set integral = states('sensor.plantinator_bewasserung_ppfd_stundenintegral') %}
          {% set start = states('input_number.plantinator_bewasserung_ppfd_integral_lichtstart') %}
          {% if is_number(integral) and is_number(start) %}
            {% set differenz = [0, (integral | float) - (start | float)] | max %}
            {{ (differenz * 0.0036) | round(2) }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          ppfd_aktuell: "{{ states('sensor.plantinator_bewasserung_ppfd') }}"
          ppfd_stundenintegral: "{{ states('sensor.plantinator_bewasserung_ppfd_stundenintegral') }}"
          ppfd_integral_lichtstart: "{{ states('input_number.plantinator_bewasserung_ppfd_integral_lichtstart') }}"
          letzte_abgeschlossene_dli: "{{ states('input_number.plantinator_bewasserung_letzte_dli') }}"
          umrechnung: Differenz_PPFD_Stunden_seit_Lichtstart_x_0.0036
          verwendung: protokollierung_und_optional_umweltfaktor

      - name: Plantinator Bewasserung Klima Faktor Roh
        unique_id: plantinator_bewasserung_klima_faktor_roh
        icon: mdi:cloud-percent
        state_class: measurement
        state: >
          {% set vpd = states('sensor.plantinator_bewasserung_vpd') %}
          {% set ref = states('input_number.plantinator_bewasserung_vpd_referenz') | float(0) %}
          {% if is_state('sensor.plantinator_bewasserung_klima_sensorstatus', 'ok')
                and is_number(vpd) and ref > 0 %}
            {{ [[(vpd | float) / ref, 0.70] | max, 1.30] | min | round(3) }}
          {% else %}
            1
          {% endif %}
        attributes:
          vpd: "{{ states('sensor.plantinator_bewasserung_vpd') }}"
          referenz: "{{ states('input_number.plantinator_bewasserung_vpd_referenz') }}"
          rohbereich: "0.70 bis 1.30"

      - name: Plantinator Bewasserung Licht Faktor Roh
        unique_id: plantinator_bewasserung_licht_faktor_roh
        icon: mdi:white-balance-sunny
        state_class: measurement
        state: >
          {% set ppfd = states('sensor.plantinator_bewasserung_ppfd') %}
          {% set ppfd_ref = states('input_number.plantinator_bewasserung_ppfd_referenz') | float(0) %}
          {% set dli = states('sensor.plantinator_bewasserung_dli') %}
          {% set dli_ref = states('input_number.plantinator_bewasserung_dli_referenz') | float(0) %}
          {% set seit = states('sensor.plantinator_bewasserung_minuten_seit_licht_an') | int(-1) %}
          {% set on_raw = states('sensor.plantinator_bewasserung_licht_an_roh') %}
          {% set off_raw = states('sensor.plantinator_bewasserung_licht_aus_roh') %}
          {% set ns = namespace(ppfd_f=-1, dli_f=-1) %}
          {% if is_state('sensor.plantinator_bewasserung_licht_sensorstatus', 'ok')
                and is_number(ppfd) and ppfd_ref > 0 %}
            {% set ns.ppfd_f = [[(ppfd | float) / ppfd_ref, 0.70] | max, 1.30] | min %}
          {% endif %}
          {% if is_state('sensor.plantinator_bewasserung_licht_sensorstatus', 'ok')
                and is_number(dli) and dli_ref > 0 and seit >= 60
                and on_raw not in ['unknown', 'unavailable', 'none', '']
                and off_raw not in ['unknown', 'unavailable', 'none', ''] %}
            {% set onp = on_raw.split(':') %}
            {% set offp = off_raw.split(':') %}
            {% set onm = (onp[0] | int(0)) * 60 + (onp[1] | int(0)) %}
            {% set offm = (offp[0] | int(0)) * 60 + (offp[1] | int(0)) %}
            {% set dauer = offm - onm if offm > onm else offm + 1440 - onm %}
            {% if dauer > 0 %}
              {% set verstrichen = [seit, dauer] | min %}
              {% set projektion = (dli | float) * dauer / verstrichen %}
              {% set ns.dli_f = [[projektion / dli_ref, 0.70] | max, 1.30] | min %}
            {% endif %}
          {% endif %}
          {% if ns.ppfd_f > 0 and ns.dli_f > 0 %}
            {{ ((ns.ppfd_f + ns.dli_f) / 2) | round(3) }}
          {% elif ns.ppfd_f > 0 %}
            {{ ns.ppfd_f | round(3) }}
          {% elif ns.dli_f > 0 %}
            {{ ns.dli_f | round(3) }}
          {% else %}
            1
          {% endif %}
        attributes:
          ppfd: "{{ states('sensor.plantinator_bewasserung_ppfd') }}"
          ppfd_referenz: "{{ states('input_number.plantinator_bewasserung_ppfd_referenz') }}"
          dli_aktuell: "{{ states('sensor.plantinator_bewasserung_dli') }}"
          dli_referenz: "{{ states('input_number.plantinator_bewasserung_dli_referenz') }}"
          hinweis: DLI wird nach mindestens 60 Minuten Licht auf den Lichttag hochgerechnet.
          rohbereich: "0.70 bis 1.30"

      - name: Plantinator Bewasserung Zulauf Faktor Roh
        unique_id: plantinator_bewasserung_zulauf_faktor_roh
        icon: mdi:water-thermometer
        state_class: measurement
        state: >
          {% set ec = states('sensor.plantinator_bewasserung_zulauf_ec') %}
          {% set ph = states('sensor.plantinator_bewasserung_zulauf_ph') %}
          {% set temp = states('sensor.plantinator_bewasserung_zulauf_temperatur') %}
          {% set ec_ref = states('input_number.plantinator_bewasserung_zulauf_ec_referenz') | float(0) %}
          {% set ph_ref = states('input_number.plantinator_bewasserung_zulauf_ph_referenz') | float(0) %}
          {% set temp_ref = states('input_number.plantinator_bewasserung_zulauf_temperatur_referenz') | float(0) %}
          {% if is_state('sensor.plantinator_bewasserung_zulauf_sensorstatus', 'ok')
                and is_number(ec) and is_number(ph) and is_number(temp)
                and ec_ref > 0 and ph_ref > 0 and temp_ref > 0 %}
            {% set ec_korr = [[(((ec | float) - ec_ref) / ec_ref) * 0.20, -0.10] | max, 0.10] | min %}
            {% set ph_diff = ((ph | float) - ph_ref) | abs %}
            {% set temp_diff = ((temp | float) - temp_ref) | abs %}
            {% set ph_abzug = [[ph_diff * 0.03, 0] | max, 0.08] | min %}
            {% set temp_abzug = [[(temp_diff / 10) * 0.03, 0] | max, 0.06] | min %}
            {{ [[1 + ec_korr - ph_abzug - temp_abzug, 0.85] | max, 1.10] | min | round(3) }}
          {% else %}
            1
          {% endif %}
        attributes:
          ec: "{{ states('sensor.plantinator_bewasserung_zulauf_ec') }}"
          ec_referenz: "{{ states('input_number.plantinator_bewasserung_zulauf_ec_referenz') }}"
          ph: "{{ states('sensor.plantinator_bewasserung_zulauf_ph') }}"
          ph_referenz: "{{ states('input_number.plantinator_bewasserung_zulauf_ph_referenz') }}"
          temperatur: "{{ states('sensor.plantinator_bewasserung_zulauf_temperatur') }}"
          temperatur_referenz: "{{ states('input_number.plantinator_bewasserung_zulauf_temperatur_referenz') }}"
          hinweis: >
            Höhere EC erhöht den Rohfaktor nur leicht; pH- und
            Temperaturabweichungen senken ihn konservativ.
          rohbereich: "0.85 bis 1.10"

      - name: Plantinator Bewasserung Umwelt Faktor
        unique_id: plantinator_bewasserung_umwelt_faktor
        icon: mdi:function-variant
        state_class: measurement
        state: >
          {% set k = states('sensor.plantinator_bewasserung_klima_faktor_roh') | float(1) %}
          {% set l = states('sensor.plantinator_bewasserung_licht_faktor_roh') | float(1) %}
          {% set z = states('sensor.plantinator_bewasserung_zulauf_faktor_roh') | float(1) %}
          {% set kw = (states('input_number.plantinator_bewasserung_klima_einfluss_prozent') | float(0)) / 100 %}
          {% set lw = (states('input_number.plantinator_bewasserung_licht_einfluss_prozent') | float(0)) / 100 %}
          {% set zw = (states('input_number.plantinator_bewasserung_zulauf_einfluss_prozent') | float(0)) / 100 %}
          {% set maxk = (states('input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent') | float(0)) / 100 %}
          {% set klima_eff = 1 + (k - 1) * kw %}
          {% set licht_eff = 1 + (l - 1) * lw %}
          {% set zulauf_eff = 1 + (z - 1) * zw %}
          {% set roh = klima_eff * licht_eff * zulauf_eff %}
          {{ [[roh, 1 - maxk] | max, 1 + maxk] | min | round(3) }}
        attributes:
          formel: >
            Produkt aus 1 + (Rohfaktor - 1) * Einfluss,
            danach harte Begrenzung durch maximale Umweltkorrektur.
          klima_roh: "{{ states('sensor.plantinator_bewasserung_klima_faktor_roh') }}"
          klima_einfluss_prozent: "{{ states('input_number.plantinator_bewasserung_klima_einfluss_prozent') }}"
          licht_roh: "{{ states('sensor.plantinator_bewasserung_licht_faktor_roh') }}"
          licht_einfluss_prozent: "{{ states('input_number.plantinator_bewasserung_licht_einfluss_prozent') }}"
          zulauf_roh: "{{ states('sensor.plantinator_bewasserung_zulauf_faktor_roh') }}"
          zulauf_einfluss_prozent: "{{ states('input_number.plantinator_bewasserung_zulauf_einfluss_prozent') }}"
          max_korrektur_prozent: "{{ states('input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent') }}"
          minimum: >
            {{ (1 - (states('input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent') | float(0) / 100)) | round(2) }}
          maximum: >
            {{ (1 + (states('input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent') | float(0) / 100)) | round(2) }}

      - name: Plantinator Bewasserung Umwelt Faktor Status
        unique_id: plantinator_bewasserung_umwelt_faktor_status
        icon: mdi:list-status
        state: >
          {% set kw = states('input_number.plantinator_bewasserung_klima_einfluss_prozent') | float(0) %}
          {% set lw = states('input_number.plantinator_bewasserung_licht_einfluss_prozent') | float(0) %}
          {% set zw = states('input_number.plantinator_bewasserung_zulauf_einfluss_prozent') | float(0) %}
          {% set maxk = states('input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent') | float(0) %}
          {% if maxk <= 0 or (kw <= 0 and lw <= 0 and zw <= 0) %}
            neutral_protokollierung
          {% elif kw > 0 and not is_state('sensor.plantinator_bewasserung_klima_sensorstatus', 'ok') %}
            teilweise_neutral_klima_{{ states('sensor.plantinator_bewasserung_klima_sensorstatus') }}
          {% elif lw > 0 and not is_state('sensor.plantinator_bewasserung_licht_sensorstatus', 'ok') %}
            teilweise_neutral_licht_{{ states('sensor.plantinator_bewasserung_licht_sensorstatus') }}
          {% elif zw > 0 and not is_state('sensor.plantinator_bewasserung_zulauf_sensorstatus', 'ok') %}
            teilweise_neutral_zulauf_{{ states('sensor.plantinator_bewasserung_zulauf_sensorstatus') }}
          {% else %}
            aktiv_begrenzt
          {% endif %}
        attributes:
          faktor: "{{ states('sensor.plantinator_bewasserung_umwelt_faktor') }}"
          steuerwirkung: >
            Der Faktor wird in der Normalguss-Empfehlung nach Lernwert
            und Crop-Faktor angewendet. Max-Guss und Tageslimit bleiben hart.

