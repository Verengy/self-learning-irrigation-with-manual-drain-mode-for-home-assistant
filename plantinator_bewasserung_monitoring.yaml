              {{ [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max | round(1) }}
            {% else %}
              unknown
            {% endif %}

      - name: Plantinator Bewasserung P3 Sensoralter
        unique_id: plantinator_bewasserung_p3_sensoralter
        icon: mdi:timer-sand
        unit_of_measurement: "min"
        state_class: measurement
