sensor:
  # PPFD [µmol/m²/s] wird zunächst in PPFD-Stunden integriert.
  # Das Tagesdelta wird unten mit 0,0036 in mol/m²/Tag umgerechnet.
  - platform: integration
    source: sensor.plantinator_bewasserung_ppfd_fuer_integration
    name: Plantinator Bewasserung PPFD Stundenintegral
    unique_id: plantinator_bewasserung_ppfd_stundenintegral
    unit_time: h
    method: left
    round: 4
    max_sub_interval:
      minutes: 5

  - platform: statistics
    name: Plantinator Bewasserung P1 Feuchte Aenderung 1h
    unique_id: plantinator_bewasserung_p1_feuchte_aenderung_1h
    entity_id: sensor.plantinator_bewasserung_p1_bodenfeuchte_wert
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 500
    precision: 2

  - platform: statistics
    name: Plantinator Bewasserung P2 Feuchte Aenderung 1h
    unique_id: plantinator_bewasserung_p2_feuchte_aenderung_1h
    entity_id: sensor.plantinator_bewasserung_p2_bodenfeuchte_wert
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 500
    precision: 2

  - platform: statistics
    name: Plantinator Bewasserung P3 Feuchte Aenderung 1h
    unique_id: plantinator_bewasserung_p3_feuchte_aenderung_1h
    entity_id: sensor.plantinator_bewasserung_p3_bodenfeuchte_wert
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 500
    precision: 2

  - platform: statistics
    name: Plantinator Bewasserung P4 Feuchte Aenderung 1h
    unique_id: plantinator_bewasserung_p4_feuchte_aenderung_1h
    entity_id: sensor.plantinator_bewasserung_p4_bodenfeuchte_wert
    state_characteristic: change
    max_age:
      hours: 1
    sampling_size: 500
    precision: 2

template:
  - sensor:
      - name: Plantinator Bewasserung Klima Sensorstatus
        unique_id: plantinator_bewasserung_klima_sensorstatus
        icon: mdi:cloud-alert
        state: >
          {% set t = states('input_text.plantinator_bewasserung_lufttemperatur_entity') | trim %}
          {% set h = states('input_text.plantinator_bewasserung_luftfeuchtigkeit_entity') | trim %}
          {% set grenze = states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') | float(15) %}
          {% if t == '' or h == '' %}
            nicht_konfiguriert
          {% elif not t.startswith('sensor.') or not h.startswith('sensor.')
                or not has_value(t) or not has_value(h)
                or not is_number(states(t)) or not is_number(states(h)) %}
            ungueltig
          {% else %}
            {% set tzeit = states[t].last_reported if states[t].last_reported is defined else states[t].last_updated %}
            {% set hzeit = states[h].last_reported if states[h].last_reported is defined else states[h].last_updated %}
            {% set talter = [0, (as_timestamp(now()) - as_timestamp(tzeit)) / 60] | max %}
            {% set halter = [0, (as_timestamp(now()) - as_timestamp(hzeit)) / 60] | max %}
            {{ 'veraltet' if talter > grenze or halter > grenze else 'ok' }}
          {% endif %}
        attributes:
          max_alter_minuten: "{{ states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') }}"
          lufttemperatur_entity: "{{ states('input_text.plantinator_bewasserung_lufttemperatur_entity') | trim }}"
          luftfeuchtigkeit_entity: "{{ states('input_text.plantinator_bewasserung_luftfeuchtigkeit_entity') | trim }}"

      - name: Plantinator Bewasserung Licht Sensorstatus
        unique_id: plantinator_bewasserung_licht_sensorstatus
        icon: mdi:white-balance-sunny
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_ppfd_entity') | trim %}
          {% set grenze = states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') | float(15) %}
          {% if ent == '' %}
            nicht_konfiguriert
          {% elif not ent.startswith('sensor.') or not has_value(ent) or not is_number(states(ent)) %}
            ungueltig
          {% else %}
            {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
            {% set alter = [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max %}
            {{ 'veraltet' if alter > grenze else 'ok' }}
          {% endif %}
        attributes:
          max_alter_minuten: "{{ states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') }}"
          ppfd_entity: "{{ states('input_text.plantinator_bewasserung_ppfd_entity') | trim }}"

      - name: Plantinator Bewasserung Zulauf Sensorstatus
        unique_id: plantinator_bewasserung_zulauf_sensorstatus
        icon: mdi:water-alert
        state: >
          {% set grenze = states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') | float(15) %}
          {% set ents = [
            states('input_text.plantinator_bewasserung_zulauf_ec_entity') | trim,
            states('input_text.plantinator_bewasserung_zulauf_ph_entity') | trim,
            states('input_text.plantinator_bewasserung_zulauf_temperatur_entity') | trim
          ] %}
          {% set ns = namespace(status='ok') %}
          {% if '' in ents %}
            nicht_konfiguriert
          {% else %}
            {% for ent in ents %}
              {% if ns.status == 'ok' %}
                {% if not ent.startswith('sensor.') or not has_value(ent) or not is_number(states(ent)) %}
                  {% set ns.status = 'ungueltig' %}
                {% else %}
                  {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
                  {% set alter = [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max %}
                  {% if alter > grenze %}
                    {% set ns.status = 'veraltet' %}
                  {% endif %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {{ ns.status }}
          {% endif %}
        attributes:
          max_alter_minuten: "{{ states('input_number.plantinator_bewasserung_sensor_max_alter_minuten') }}"
          ec_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ec_entity') | trim }}"
          ph_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ph_entity') | trim }}"
          temperatur_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_temperatur_entity') | trim }}"

      - name: Plantinator Bewasserung PPFD fuer Integration
        unique_id: plantinator_bewasserung_ppfd_fuer_integration
        icon: mdi:white-balance-sunny
        unit_of_measurement: "µmol/m²/s"
        state_class: measurement
        state: >
          {% if is_state('sensor.plantinator_bewasserung_lichtstatus', 'tag')
                and is_state('sensor.plantinator_bewasserung_licht_sensorstatus', 'ok')
                and is_number(states('sensor.plantinator_bewasserung_ppfd')) %}
            {{ states('sensor.plantinator_bewasserung_ppfd') | float(0) }}
          {% else %}
            0
          {% endif %}
        attributes:
          quelle: sensor.plantinator_bewasserung_ppfd
          sicherheitsverhalten: Nur am Lichttag; bei fehlendem oder veraltetem PPFD wird 0 integriert.

      - name: Plantinator Bewasserung P1 Sensoralter
        unique_id: plantinator_bewasserung_p1_sensoralter
        icon: mdi:timer-sand
        unit_of_measurement: "min"
        state_class: measurement
        state: >
          {% set f = states('input_text.plantinator_bewasserung_p1_bodenfeuchte_entity') | trim %}
          {% set t = states('input_text.plantinator_bewasserung_p1_bodentemperatur_entity') | trim %}
          {% if f.startswith('sensor.') and t.startswith('sensor.') and has_value(f) and has_value(t)
                and is_number(states(f)) and is_number(states(t)) %}
            {% set fzeit = states[f].last_reported if states[f].last_reported is defined else states[f].last_updated %}
            {% set tzeit = states[t].last_reported if states[t].last_reported is defined else states[t].last_updated %}
            {% set fa = [0, (as_timestamp(now()) - as_timestamp(fzeit)) / 60] | max %}
            {% set ta = [0, (as_timestamp(now()) - as_timestamp(tzeit)) / 60] | max %}
            {{ [fa, ta] | max | round(1) }}
          {% else %}
            unknown
          {% endif %}
        attributes:
          bodenfeuchte_alter_minuten: >
            {% set ent = states('input_text.plantinator_bewasserung_p1_bodenfeuchte_entity') | trim %}
            {% if ent.startswith('sensor.') and has_value(ent) and is_number(states(ent)) %}
              {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
              {{ [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max | round(1) }}
            {% else %}
              unknown
            {% endif %}
          bodentemperatur_alter_minuten: >
            {% set ent = states('input_text.plantinator_bewasserung_p1_bodentemperatur_entity') | trim %}
            {% if ent.startswith('sensor.') and has_value(ent) and is_number(states(ent)) %}
              {% set zeit = states[ent].last_reported if states[ent].last_reported is defined else states[ent].last_updated %}
              {{ [0, (as_timestamp(now()) - as_timestamp(zeit)) / 60] | max | round(1) }}
            {% else %}
              unknown
            {% endif %}

      - name: Plantinator Bewasserung P2 Sensoralter
        unique_id: plantinator_bewasserung_p2_sensoralter
        icon: mdi:timer-sand
        unit_of_measurement: "min"
        state_class: measurement
        state: >
          {% set f = states('input_text.plantinator_bewasserung_p2_bodenfeuchte_entity') | trim %}
          {% set t = states('input_text.plantinator_bewasserung_p2_bodentemperatur_entity') | trim %}
          {% if f.startswith('sensor.') and t.startswith('sensor.') and has_value(f) and has_value(t)
