          {% set hauptventil = states('input_text.plantinator_bewasserung_hauptventil_entity') | trim %}
          {% set umwaelzung = states('input_text.plantinator_bewasserung_tank_umwalzung_entity') | trim %}
          {% set anzahl = states('input_number.plantinator_bewasserung_anzahl_pflanzen') | int(4) %}
          {% set exec_aktiv = is_state('input_boolean.plantinator_bewasserung_exec_laeuft', 'on') %}
          {% set pumpe_soll = is_state('input_boolean.plantinator_bewasserung_pumpe_soll_laufen', 'on') %}
          {% set aktive_pflanze = states('input_number.plantinator_bewasserung_exec_aktive_pflanze') | int(0) %}
          {% set aktives_ventil = states('input_text.plantinator_bewasserung_p' ~ aktive_pflanze ~ '_ventil_entity') | trim
             if aktive_pflanze in [1, 2, 3, 4] else '' %}
          {% set ns = namespace(offen=0) %}
          {% for p in range(1, 5) %}
            {% set ventil = states('input_text.plantinator_bewasserung_p' ~ p ~ '_ventil_entity') | trim %}
            {% if ventil.startswith('switch.') and is_state(ventil, 'on') %}
              {% set ns.offen = ns.offen + 1 %}
            {% endif %}
          {% endfor %}
          {% if pumpe_soll and (not pumpe.startswith('switch.') or not has_value(pumpe)) %}
            pumpe_unverfuegbar_im_lauf
          {% elif pumpe_soll and hauptventil.startswith('switch.') and not has_value(hauptventil) %}
            hauptventil_unverfuegbar_im_lauf
          {% elif pumpe_soll and (aktive_pflanze not in [1, 2, 3, 4]
                or not aktives_ventil.startswith('switch.') or not has_value(aktives_ventil)) %}
            aktives_ventil_unverfuegbar_im_lauf
          {% elif pumpe_soll and not is_state(aktives_ventil, 'on') %}
            aktives_ventil_nicht_offen
          {% elif is_state('input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft', 'on')
                and (not umwaelzung.startswith('switch.') or not has_value(umwaelzung)) %}
            umwaelzung_unverfuegbar_im_lauf
          {% elif ns.offen > 1 %}
            mehrere_pflanzenventile_offen
          {% elif is_state(pumpe, 'on') and not exec_aktiv %}
            pumpe_unerwartet_an
          {% elif is_state(pumpe, 'on') and ns.offen == 0 %}
            pumpe_ohne_pflanzenventil
          {% elif ns.offen > 0 and not exec_aktiv %}
            pflanzenventil_unerwartet_offen
          {% elif hauptventil.startswith('switch.')
                and is_state(hauptventil, 'on') and not exec_aktiv %}
            hauptventil_unerwartet_offen
          {% elif umwaelzung.startswith('switch.')
                and is_state(umwaelzung, 'on')
                and is_state('input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft', 'off') %}
            umwaelzung_unerwartet_an
          {% else %}
            ok
          {% endif %}
        attributes:
          pumpe: "{{ states('sensor.plantinator_bewasserung_pumpe_status_gemappt') }}"
          hauptventil: "{{ states('sensor.plantinator_bewasserung_hauptventil_status_gemappt') }}"
          ventil_p1: "{{ states('sensor.plantinator_bewasserung_p1_ventil_status_gemappt') }}"
          ventil_p2: "{{ states('sensor.plantinator_bewasserung_p2_ventil_status_gemappt') }}"
          ventil_p3: "{{ states('sensor.plantinator_bewasserung_p3_ventil_status_gemappt') }}"
          ventil_p4: "{{ states('sensor.plantinator_bewasserung_p4_ventil_status_gemappt') }}"
          umwaelzung: "{{ states('sensor.plantinator_bewasserung_tank_umwalzung_status_gemappt') }}"
          exec_laeuft: "{{ states('input_boolean.plantinator_bewasserung_exec_laeuft') }}"
          pumpe_soll_laufen: "{{ states('input_boolean.plantinator_bewasserung_pumpe_soll_laufen') }}"
          aktive_pflanze: "{{ states('input_number.plantinator_bewasserung_exec_aktive_pflanze') }}"
          aktives_ventil: >
            {% set p = states('input_number.plantinator_bewasserung_exec_aktive_pflanze') | int(0) %}
            {{ states('input_text.plantinator_bewasserung_p' ~ p ~ '_ventil_entity') | trim
               if p in [1, 2, 3, 4] else 'keines' }}
          umwaelzung_laeuft: "{{ states('input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft') }}"

      - name: Plantinator Bewasserung Kritischer Systemstatus
        unique_id: plantinator_bewasserung_kritischer_systemstatus
        icon: mdi:shield-alert
        state: >
          {# Mapping-, Profil-, Sensoralter- und Wasserstandsfehler sperren
             Starts. Global verriegelt wird nur bei unmittelbar unsicherer
             Hardware; ein unsicherer Wasserstand IM Lauf wird separat
             sofort verriegelt. #}
          {% if states('sensor.plantinator_bewasserung_aktor_sicherheitsstatus') != 'ok' %}
            aktor_{{ states('sensor.plantinator_bewasserung_aktor_sicherheitsstatus') }}
          {% else %}
            ok
          {% endif %}
        attributes:
          mapping_status: "{{ states('sensor.plantinator_bewasserung_mapping_status') }}"
          profil_status: "{{ states('sensor.plantinator_bewasserung_profil_status') }}"
          sensoralter_status: "{{ states('sensor.plantinator_bewasserung_sensoralter_status') }}"
          aktor_sicherheitsstatus: "{{ states('sensor.plantinator_bewasserung_aktor_sicherheitsstatus') }}"
          wasserstand_status: "{{ states('sensor.plantinator_bewasserung_wasserstand_status_gemappt') }}"

      - name: Plantinator Bewasserung Alarm Status
        unique_id: plantinator_bewasserung_alarm_status
        icon: mdi:alarm-light
        state: >
          {% if is_state('input_boolean.plantinator_bewasserung_alarm_verriegelt', 'on') %}
            verriegelt
          {% elif states('sensor.plantinator_bewasserung_kritischer_systemstatus') != 'ok' %}
            fehler_nicht_quittierbar
          {% else %}
            bereit
          {% endif %}
        attributes:
          verriegelt: "{{ states('input_boolean.plantinator_bewasserung_alarm_verriegelt') }}"
          alarm_grund: "{{ states('input_text.plantinator_bewasserung_alarm_grund') }}"
          alarm_zeit: "{{ states('input_datetime.plantinator_bewasserung_alarm_zeit') }}"
          aktueller_systemstatus: "{{ states('sensor.plantinator_bewasserung_kritischer_systemstatus') }}"
          kritischer_push_dienst: >
            {{ states('input_text.plantinator_bewasserung_kritischer_push_dienst') }}
          quittierbar: >
            {{ is_state('input_boolean.plantinator_bewasserung_alarm_verriegelt', 'on')
               and is_state('input_boolean.plantinator_bewasserung_hardware_sicher_aus', 'on')
               and is_state('sensor.plantinator_bewasserung_kritischer_systemstatus', 'ok') }}

script:
  plantinator_bewasserung_monitoring_standardwerte_setzen:
    alias: Plantinator Bewasserung Monitoring Standardwerte setzen
    icon: mdi:tune-variant
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_sensor_max_alter_minuten
        data:
          value: 30

      # Einfluss beginnt bewusst bei 0 %. Erst nach Beobachtung erhöhen.
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.plantinator_bewasserung_klima_einfluss_prozent
            - input_number.plantinator_bewasserung_licht_einfluss_prozent
            - input_number.plantinator_bewasserung_zulauf_einfluss_prozent
        data:
          value: 0

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_umwelt_max_korrektur_prozent
        data:
          value: 10

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_vpd_referenz
        data:
          value: 1.2
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_ppfd_referenz
        data:
          value: 600
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_dli_referenz
        data:
          value: 35
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_zulauf_ec_referenz
        data:
          value: 2
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_zulauf_ph_referenz
        data:
          value: 5.8
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_zulauf_temperatur_referenz
        data:
          value: 20

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ is_number(states('sensor.plantinator_bewasserung_ppfd_stundenintegral')) }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_ppfd_integral_lichtstart
                data:
                  value: "{{ states('sensor.plantinator_bewasserung_ppfd_stundenintegral') | float(0) }}"

  plantinator_bewasserung_sicherheitsereignis_melden:
    alias: Plantinator Bewässerung Sicherheitsereignis melden
    icon: mdi:shield-alert-outline
    mode: queued
    max: 20
    fields:
      stufe:
        name: Sicherheitsstufe
        required: true
        selector:
          select:
            options:
              - info
              - warnung
              - kritisch
      code:
        name: Ereigniscode
        required: true
        selector:
          text:
      details:
        name: Details
        required: false
        selector:
          text:
    sequence:
      - variables:
          ereignisstufe: "{{ stufe | default('warnung') | lower | string }}"
          ereigniscode: "{{ code | default('unbekannt') | string }}"
          ereignisdetails: "{{ details | default('') | string }}"
          push_dienst: "{{ states('input_text.plantinator_bewasserung_kritischer_push_dienst') | trim }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_letztes_sicherheitsereignis
        data:
          value: "{{ (ereigniscode ~ (' – ' ~ ereignisdetails if ereignisdetails else ''))[:255] }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_sicherheitsstufe
        data:
          value: "{{ ereignisstufe[:40] }}"

      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.plantinator_bewasserung_sicherheitsereignis_zeit
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      # Das Logbuch ist die dauerhafte, zeitlich sortierte Fehlerhistorie.
      - service: logbook.log
        data:
          name: Bewässerung Sicherheit
          entity_id: sensor.plantinator_bewasserung_alarm_status
          message: >
            [{{ ereignisstufe | upper }}] {{ ereigniscode }}{% if ereignisdetails %}: {{ ereignisdetails }}{% endif %}

      - service: persistent_notification.create
        data:
          notification_id: plantinator_bewasserung_sicherheit
          title: >
            {{ 'KRITISCH' if ereignisstufe == 'kritisch' else
               ('Warnung' if ereignisstufe == 'warnung' else 'Information') }}:
            Bewässerung
          message: >
            **{{ ereigniscode }}**{% if ereignisdetails %}

            {{ ereignisdetails }}{% endif %}

      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ push_dienst.startswith('notify.mobile_app_')
                     and ereignisstufe == 'kritisch' }}
            sequence:
              - service: "{{ push_dienst }}"
                continue_on_error: true
                data:
                  title: "KRITISCH: Bewässerung verriegelt"
                  message: >
                    {{ ereigniscode }}{% if ereignisdetails %}: {{ ereignisdetails }}{% endif %}
                  data:
                    push:
                      interruption-level: critical
                      sound:
                        name: default
                        critical: 1
                        volume: 1.0

          - conditions:
              - condition: template
                value_template: >
                  {{ push_dienst.startswith('notify.mobile_app_')
                     and ereignisstufe == 'warnung' }}
            sequence:
              - service: "{{ push_dienst }}"
                continue_on_error: true
                data:
                  title: "Warnung: Bewässerung eingeschränkt"
                  message: >
                    {{ ereigniscode }}{% if ereignisdetails %}: {{ ereignisdetails }}{% endif %}
                  data:
                    push:
                      interruption-level: time-sensitive

  plantinator_bewasserung_alarm_ausloesen:
    alias: Plantinator Bewasserung Alarm auslösen
    icon: mdi:alarm-light
    mode: single
    fields:
      grund:
        name: Alarmgrund
        required: true
        selector:
          text:
    sequence:
      - variables:
          alarmgrund: "{{ grund | default(states('sensor.plantinator_bewasserung_kritischer_systemstatus')) | string }}"

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_alarm_grund
        data:
          value: "{{ alarmgrund[:255] }}"

      - service: input_datetime.set_datetime
        target:
          entity_id: input_datetime.plantinator_bewasserung_alarm_zeit
        data:
          datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - service: script.plantinator_bewasserung_sicherheitsereignis_melden
        data:
          stufe: kritisch
          code: "{{ alarmgrund }}"
          details: >
            Sicherer Stopp wurde angefordert. Ursache beheben, den bestätigten
            AUS-Zustand prüfen und den Alarm anschließend im Dashboard quittieren.

      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt

  plantinator_bewasserung_alarm_quittieren:
    alias: Plantinator Bewasserung Alarm quittieren
    icon: mdi:check-decagram
    mode: single
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.plantinator_bewasserung_hardware_sicher_aus
                state: "off"
            sequence:
              - service: script.plantinator_bewasserung_sicher_stop
              - delay:
                  seconds: 1

      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ states('sensor.plantinator_bewasserung_kritischer_systemstatus') == 'ok'
                     and is_state('input_boolean.plantinator_bewasserung_hardware_sicher_aus', 'on') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt

              - service: persistent_notification.dismiss
                data:
                  notification_id: plantinator_bewasserung_alarm
              - service: persistent_notification.dismiss
                data:
                  notification_id: plantinator_bewasserung_sicherheit
              - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                data:
                  stufe: info
                  code: alarm_quittiert
                  details: Hardware ist bestätigt AUS; globale Verriegelung wurde aufgehoben.
        default:
          - service: persistent_notification.create
            data:
              notification_id: plantinator_bewasserung_alarm
              title: Plantinator Alarm bleibt verriegelt
              message: >
                Quittierung abgelehnt. Aktueller Fehler:
                {{ states('sensor.plantinator_bewasserung_kritischer_systemstatus') }}.
                Hardware sicher AUS:
                {{ states('input_boolean.plantinator_bewasserung_hardware_sicher_aus') }}.

automation:
  - id: plantinator_bewasserung_dli_lichtstart_nullpunkt
    alias: Plantinator Bewasserung - DLI Nullpunkt bei Lichtstart
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_lichtstatus
        to: "tag"
    condition:
      - condition: template
        value_template: "{{ is_number(states('sensor.plantinator_bewasserung_ppfd_stundenintegral')) }}"
    action:
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_ppfd_integral_lichtstart
        data:
          value: "{{ states('sensor.plantinator_bewasserung_ppfd_stundenintegral') | float(0) }}"

  - id: plantinator_bewasserung_dli_lichttag_abschliessen
    alias: Plantinator Bewasserung - DLI Lichttag abschließen
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_lichtstatus
        to: "nacht"
    action:
      - delay:
          seconds: 10
      - condition: template
        value_template: "{{ is_number(states('sensor.plantinator_bewasserung_dli')) }}"
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_letzte_dli
        data:
          value: "{{ [[states('sensor.plantinator_bewasserung_dli') | float(0), 0] | max, 150] | min | round(2) }}"

  - id: plantinator_bewasserung_dli_erster_start_nullpunkt
    alias: Plantinator Bewasserung - DLI erster Start Nullpunkt
    mode: single
    trigger:
      - platform: homeassistant
        event: start
    action:
      - delay:
          seconds: 45
      - condition: template
        value_template: >
          {{ (states('input_number.plantinator_bewasserung_ppfd_integral_lichtstart') | float(0)) <= 0
             and is_number(states('sensor.plantinator_bewasserung_ppfd_stundenintegral')) }}
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_ppfd_integral_lichtstart
        data:
          value: "{{ states('sensor.plantinator_bewasserung_ppfd_stundenintegral') | float(0) }}"

  - id: plantinator_bewasserung_kritischer_fehler_verriegeln
    alias: Plantinator Bewasserung - kritischen Fehler verriegeln
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_kritischer_systemstatus
        for: "00:02:00"
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: template
        value_template: >
          {% set status = states('sensor.plantinator_bewasserung_kritischer_systemstatus') %}
          {% set alter = as_timestamp(now()) -
              as_timestamp(states.sensor.plantinator_bewasserung_kritischer_systemstatus.last_changed) %}
          {{ status not in ['ok', 'unknown', 'unavailable', 'none', '']
             and alter >= 120 }}
      - condition: state
        entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt
        state: "off"
    action:
      - service: script.plantinator_bewasserung_alarm_ausloesen
        data:
          grund: "{{ states('sensor.plantinator_bewasserung_kritischer_systemstatus') }}"

  - id: plantinator_bewasserung_pflanzenaktor_nicht_erreichbar_sperren
    alias: Plantinator Bewässerung - nicht erreichbare Pflanzenaktoren einzeln sperren
    mode: queued
    max: 10
    trigger:
      - platform: time_pattern
        minutes: "/5"
    action:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                p: "{{ repeat.item | int }}"
                ventil: "{{ states('input_text.plantinator_bewasserung_p' ~ repeat.item ~ '_ventil_entity') | trim }}"
                sperre: "input_boolean.plantinator_bewasserung_p{{ repeat.item }}_aktor_sperre"
                fehlertext: "input_text.plantinator_bewasserung_p{{ repeat.item }}_aktor_fehler"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_aktiv', 'on')
                           and ventil.startswith('switch.') and not has_value(ventil)
                           and is_state(sperre, 'off') }}
                  sequence:
                    - service: input_boolean.turn_on
                      target:
                        entity_id: "{{ sperre }}"
                    - service: input_text.set_value
                      target:
                        entity_id: "{{ fehlertext }}"
                      data:
                        value: ventil_nicht_erreichbar
                    - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                      data:
                        stufe: warnung
                        code: "aktor_nicht_erreichbar_p{{ p }}"
                        details: >
                          Pflanze {{ p }} wurde einzeln gesperrt. Die übrigen
                          Pflanzen bleiben verfügbar, sofern ihre Aktoren bereit sind.

      - variables:
          hauptventil: "{{ states('input_text.plantinator_bewasserung_hauptventil_entity') | trim }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ hauptventil.startswith('switch.') and not has_value(hauptventil)
                     and is_state('input_boolean.plantinator_bewasserung_hauptventil_aktor_sperre', 'off') }}
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.plantinator_bewasserung_hauptventil_aktor_sperre
              - service: input_text.set_value
                target:
                  entity_id: input_text.plantinator_bewasserung_hauptventil_aktor_fehler
                data:
                  value: hauptventil_nicht_erreichbar
              - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                data:
                  stufe: warnung
                  code: hauptventil_nicht_erreichbar
                  details: Alle neuen Bewässerungsstarts wurden vorübergehend gesperrt.

  - id: plantinator_bewasserung_aktorsperren_selbsttest
    alias: Plantinator Bewässerung - Aktorsperren nach sicherem AUS selbst lösen
    mode: queued
    max: 10
    trigger:
      - platform: time_pattern
        minutes: "/1"
    action:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                p: "{{ repeat.item | int }}"
                ventil: "{{ states('input_text.plantinator_bewasserung_p' ~ repeat.item ~ '_ventil_entity') | trim }}"
                sperre: "input_boolean.plantinator_bewasserung_p{{ repeat.item }}_aktor_sperre"
                fehlertext: "input_text.plantinator_bewasserung_p{{ repeat.item }}_aktor_fehler"
                sperrzeit: >
                  {{ as_timestamp(now()) - as_timestamp(states[sperre].last_changed, as_timestamp(now())) }}
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state(sperre, 'on') and (sperrzeit | float(0)) >= 60
                           and ventil.startswith('switch.') and has_value(ventil)
                           and is_state(ventil, 'off') }}
                  sequence:
                    - service: input_boolean.turn_off
                      target:
                        entity_id: "{{ sperre }}"
                    - service: input_text.set_value
                      target:
                        entity_id: "{{ fehlertext }}"
                      data:
                        value: bereit
                    - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                      data:
                        stufe: info
                        code: "aktor_wieder_bereit_p{{ p }}"
                        details: >
                          Ventil meldet wieder zuverlässig AUS. Die Einzelsperre
                          für Pflanze {{ p }} wurde automatisch aufgehoben.

      - variables:
          hauptventil: "{{ states('input_text.plantinator_bewasserung_hauptventil_entity') | trim }}"
          haupt_sperrzeit: >
            {{ as_timestamp(now()) -
               as_timestamp(states.input_boolean.plantinator_bewasserung_hauptventil_aktor_sperre.last_changed,
                            as_timestamp(now())) }}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state('input_boolean.plantinator_bewasserung_hauptventil_aktor_sperre', 'on')
                     and (haupt_sperrzeit | float(0)) >= 60
                     and hauptventil.startswith('switch.') and has_value(hauptventil)
                     and is_state(hauptventil, 'off') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.plantinator_bewasserung_hauptventil_aktor_sperre
              - service: input_text.set_value
                target:
                  entity_id: input_text.plantinator_bewasserung_hauptventil_aktor_fehler
                data:
                  value: bereit
              - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                data:
                  stufe: info
                  code: hauptventil_wieder_bereit
                  details: Hauptventil meldet wieder sicher AUS; Starts sind wieder freigegeben.

      - variables:
          pumpe: "{{ states('input_text.plantinator_bewasserung_pumpe_entity') | trim }}"
          pumpen_sperrzeit: >
            {{ as_timestamp(now()) -
               as_timestamp(states.input_boolean.plantinator_bewasserung_pumpe_aktor_sperre.last_changed,
                            as_timestamp(now())) }}
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ is_state('input_boolean.plantinator_bewasserung_pumpe_aktor_sperre', 'on')
                     and (pumpen_sperrzeit | float(0)) >= 60
                     and pumpe.startswith('switch.') and has_value(pumpe)
                     and is_state(pumpe, 'off') }}
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: input_boolean.plantinator_bewasserung_pumpe_aktor_sperre
              - service: input_text.set_value
                target:
                  entity_id: input_text.plantinator_bewasserung_pumpe_aktor_fehler
                data:
                  value: bereit
              - service: script.plantinator_bewasserung_sicherheitsereignis_melden
                data:
                  stufe: info
                  code: pumpe_wieder_bereit
                  details: >
                    Pumpe ist wieder erreichbar und meldet sicher AUS;
                    neue Bewässerungsstarts sind wieder freigegeben.

  - id: plantinator_bewasserung_wasserstand_lauf_sofort_verriegeln
    alias: Plantinator Bewasserung - unsicherer Wasserstand im Lauf
    mode: single
    trigger:
      - platform: template
        value_template: >
          {% set ent = states('input_text.plantinator_bewasserung_wasserstand_entity') | trim %}
          {% set sicher = states('input_select.plantinator_bewasserung_wasserstand_sicherer_zustand') %}
          {{ is_state('input_boolean.plantinator_bewasserung_wasserstand_verwenden', 'on')
             and ((not has_value(ent)) or states(ent) != sicher) }}
        for: "00:00:02"
    condition:
      - condition: template
        value_template: >
          {{ is_state('input_boolean.plantinator_bewasserung_exec_laeuft', 'on')
             or is_state('input_boolean.plantinator_bewasserung_mess_drain_laeuft', 'on')
             or is_state('input_boolean.plantinator_bewasserung_shot_exec_laeuft', 'on')
             or is_state('input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft', 'on') }}
      - condition: state
        entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt
        state: "off"
    action:
      - service: script.plantinator_bewasserung_alarm_ausloesen
        data:
          grund: wasserstand_im_lauf_nicht_sicher

  - id: plantinator_bewasserung_aktorfehler_sofort_verriegeln
    alias: Plantinator Bewässerung - Aktorfehler sofort verriegeln
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_aktor_sicherheitsstatus
        for: "00:00:02"
    condition:
      - condition: template
        value_template: >
          {{ states('sensor.plantinator_bewasserung_aktor_sicherheitsstatus')
             not in ['ok', 'unknown', 'unavailable', 'none', ''] }}
      - condition: state
        entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt
        state: "off"
    action:
      - service: script.plantinator_bewasserung_alarm_ausloesen
        data:
          grund: >
            aktor_{{ states('sensor.plantinator_bewasserung_aktor_sicherheitsstatus') }}

  - id: plantinator_bewasserung_alarm_verriegelt_sicher_stop
    alias: Plantinator Bewasserung - Alarmverriegelung sicher Stop
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.plantinator_bewasserung_alarm_verriegelt
        to: "on"
    action:
      - service: script.plantinator_bewasserung_sicher_stop

  - id: plantinator_bewasserung_alarm_quittieren_button
    alias: Plantinator Bewasserung - Alarm quittieren Button
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_alarm_quittieren
    action:
      - service: script.plantinator_bewasserung_alarm_quittieren

  - id: plantinator_bewasserung_nacht_dryback_start_erfassen
    alias: Plantinator Bewasserung - Nacht-Dryback Start erfassen
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_lichtstatus
        to: "nacht"
    action:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                p: "{{ repeat.item | int }}"
                feuchte: "{{ states('sensor.plantinator_bewasserung_p' ~ (repeat.item | int) ~ '_bodenfeuchte_wert') }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_aktiv', 'on')
                           and is_number(feuchte) }}
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: "input_number.plantinator_bewasserung_p{{ p }}_nacht_dryback_start"
                      data:
                        value: "{{ feuchte | float | round(1) }}"

  - id: plantinator_bewasserung_nacht_dryback_abschliessen
    alias: Plantinator Bewasserung - Nacht-Dryback abschließen
    mode: single
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_lichtstatus
        to: "tag"
    action:
      - repeat:
          for_each: [1, 2, 3, 4]
          sequence:
            - variables:
                p: "{{ repeat.item | int }}"
                start: "{{ states('input_number.plantinator_bewasserung_p' ~ (repeat.item | int) ~ '_nacht_dryback_start') | float(0) }}"
                feuchte: "{{ states('sensor.plantinator_bewasserung_p' ~ (repeat.item | int) ~ '_bodenfeuchte_wert') }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_aktiv', 'on')
                           and start > 0 and is_number(feuchte) }}
                  sequence:
                    - service: input_number.set_value
                      target:
                        entity_id: "input_number.plantinator_bewasserung_p{{ p }}_letzter_nacht_dryback"
                      data:
                        value: "{{ [0, start - (feuchte | float)] | max | round(1) }}"
