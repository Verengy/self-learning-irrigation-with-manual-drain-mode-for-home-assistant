############################################################
# PLANTINATOR BEWASSERUNG - MONITORING UND ALARM V1
# Datei: plantinator_bewasserung_monitoring.yaml
#
# Zweck:
# - Quittierbare, persistente Alarmverriegelung
# - Altersprüfung der Pflichtsensoren Bodenfeuchte/Bodentemperatur
# - Protokollierung von Zulauf EC/pH/Temperatur
# - Protokollierung von VPD, PPFD, DLI und Dryback
# - Optionaler, gewichteter Umweltfaktor für Normalguss
#
# Wichtig:
# - Dryback greift noch NICHT in die Steuerung ein.
# - Klima, Licht und Zulauf wirken erst bei Einfluss > 0 %.
# - Fehlende Beobachtungswerte bleiben neutral.
# - Max-Guss und Tageslimit bleiben harte Grenzen.
# - Ein kritischer Fehler verriegelt alle Pumpenabläufe bis
#   die Ursache behoben und der Alarm bewusst quittiert wurde.
############################################################

