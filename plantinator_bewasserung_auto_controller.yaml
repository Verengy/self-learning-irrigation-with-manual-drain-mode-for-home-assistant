############################################################
# PLANTINATOR BEWASSERUNG - AUTO CONTROLLER V3.3
# Datei: plantinator_bewasserung_auto_controller.yaml
#
# Aenderungen gegenueber V2:
# - Alle Aufruf-Skripte auf mode: restart (verhindert Zombie-States)
# - State-Trigger blockiert, wenn EXEC oder Shot EXEC schon laufen
# - Aufrufe an shot_plan_ausfuehren im Hintergrund (fire and forget)
#   damit auto_check nicht 10+ Minuten haengt und Timeouts erzeugt
# - choose:-Reihenfolge in auto_check (spezifisch vor allgemein)
# - Tageszaehler-Regex mit Timestamp-Suffix
#
# Aenderungen V3 -> V3.1:
# - ECHTES Fire-and-Forget: script.turn_on statt direktem
#   service: script.xxx Aufruf. Der alte Weg (auch mit
#   continue_on_error: true) war weiterhin blockierend, dadurch
#   hing auto_check trotzdem waehrend des gesamten Gussvorgangs.
# - Guard-Bedingungen pruefen jetzt zusaetzlich
#   input_boolean.plantinator_bewasserung_shot_exec_reserviert
#   (siehe plantinator_bewasserung_shot_exec.yaml). Das schliesst
#   das Race-Window waehrend der Pre-Guss-Umwaelzung, in dem
#   shot_exec_laeuft noch "off" ist, obwohl ein Guss faktisch
#   schon gestartet wurde.
#
# Aenderungen V3.1 -> V3.2:
# - Wochen-, Monats- und Gesamtverbrauch je Pflanze
# - Erfolgreiche Guesse je Pflanze
# - Gesamte Pumpenlaufzeit aus dem gemappten Pumpenzustand
# - Gesamtzaehler fuer Abbrueche, Hardwarefehler und Mess-Drain-Laeufe
#
# Aenderungen V3.2 -> V3.3:
# - Einheit ml fuer Wochen- und Monatsverbrauch fest gesetzt
############################################################

homeassistant:
