  plantinator_bewasserung_auto_p2_letzter_start:
    name: Plantinator Bewasserung Auto P2 letzter Start
    has_date: true
    has_time: true

  plantinator_bewasserung_auto_p3_letzter_start:
    name: Plantinator Bewasserung Auto P3 letzter Start
    has_date: true
    has_time: true

  plantinator_bewasserung_auto_p4_letzter_start:
    name: Plantinator Bewasserung Auto P4 letzter Start
