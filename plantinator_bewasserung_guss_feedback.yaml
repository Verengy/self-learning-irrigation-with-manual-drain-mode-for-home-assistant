############################################################
# PLANTINATOR BEWASSERUNG - GUSS FEEDBACK / LERNWERT V1
# Datei: plantinator_bewasserung_guss_feedback.yaml
#
# Zweck:
# - Beobachtet normale EXEC-Güsse
# - Speichert Bodenfeuchte vor dem Guss
# - Wartet eine einstellbare Stabilisierungszeit
# - Speichert Bodenfeuchte nach dem Guss
# - Berechnet ml pro 1 % Bodenfeuchteanstieg
# - Aktualisiert pro Pflanze einen geglätteten Lernwert
#
# Wichtig:
# - Diese Datei steuert keine Pumpe und keine Ventile
# - Mess-Drain-Güsse werden NICHT als normaler Lernwert übernommen
# - Der globale Startwert bleibt nur Fallback, bis echte Lernwerte vorhanden sind
############################################################

input_boolean:
  plantinator_bewasserung_p1_lernwert_gueltig:
    name: Plantinator Bewasserung P1 Lernwert gültig
    icon: mdi:brain-check
  plantinator_bewasserung_p2_lernwert_gueltig:
    name: Plantinator Bewasserung P2 Lernwert gültig
    icon: mdi:brain-check
  plantinator_bewasserung_p3_lernwert_gueltig:
    name: Plantinator Bewasserung P3 Lernwert gültig
    icon: mdi:brain-check
  plantinator_bewasserung_p4_lernwert_gueltig:
    name: Plantinator Bewasserung P4 Lernwert gültig
    icon: mdi:brain-check

  plantinator_bewasserung_p1_feedback_ausstehend:
    name: Plantinator Bewasserung P1 Feedback ausstehend
    icon: mdi:timer-sand
  plantinator_bewasserung_p2_feedback_ausstehend:
    name: Plantinator Bewasserung P2 Feedback ausstehend
    icon: mdi:timer-sand
  plantinator_bewasserung_p3_feedback_ausstehend:
    name: Plantinator Bewasserung P3 Feedback ausstehend
    icon: mdi:timer-sand
  plantinator_bewasserung_p4_feedback_ausstehend:
