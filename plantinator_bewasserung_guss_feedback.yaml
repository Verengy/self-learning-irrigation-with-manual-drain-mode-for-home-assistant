                  entity_id: input_text.plantinator_bewasserung_feedback_status
                data:
                  value: >
                    {{ 'feedback_parameter_ungueltig'
                       if min_mlp > max_mlp or lernrate <= 0 or lernrate > 1
                       else 'feedback_transaktion_fehlt_p' ~ p
                       if not is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_feedback_ausstehend', 'on')
                       else 'nach_guss_ungueltig_p' ~ p ~ '_sensor_' ~ feuchte_raw }}
              - stop: "Feedback-Transaktion oder Bodenfeuchte ungültig."

