automation:
  - id: plantinator_bewasserung_feedback_normalguss_fertig_auswerten
    alias: Plantinator Bewasserung Feedback - Normalguss fertig auswerten
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_exec_status
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state is match('^normalguss_fertig_p[1-4]_[0-9]+ml_[0-9]+$') }}"
    action:
      - variables:
          status: "{{ trigger.to_state.state }}"
          p: "{{ status.split('_p')[1].split('_')[0] | int }}"
          warte_min: "{{ states('input_number.plantinator_bewasserung_feedback_wartezeit_minuten') | int(4) }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_feedback_status
        data:
          value: "warte_auf_stabilisierung_p{{ p }}_{{ warte_min }}min"
      - delay:
          minutes: "{{ warte_min }}"
      - service: script.plantinator_bewasserung_feedback_nach_guss_auswerten
        data:
          pflanze: "{{ p }}"
