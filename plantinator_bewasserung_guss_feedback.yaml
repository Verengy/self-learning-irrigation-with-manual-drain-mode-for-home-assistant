                              entity_id: input_text.plantinator_bewasserung_feedback_status
                            data:
                              value: "p3_ausreisser_verworfen_{{ berechnet | float(0) | round(1) }}ml_prozent"
                          - service: input_text.set_value
                            target:
                              entity_id: input_text.plantinator_bewasserung_p3_letztes_lernergebnis
                            data:
                              value: >
                                Ausreißer verworfen: {{ berechnet | float(0) | round(1) }} ml/%
                                (Abweichung {{ abweichung_prozent | float(0) | round(0) }} %)
                          - service: input_text.set_value
                            target:
                              entity_id: input_text.plantinator_bewasserung_p3_lernhistorie
                            data:
                              value: >
                                {% set alt_hist = states('input_text.plantinator_bewasserung_p3_lernhistorie') %}
                                {% set teile = alt_hist.split(' · ') if alt_hist not in ['', 'unknown', 'unavailable', 'keine'] else [] %}
                                {% set eintrag = now().strftime('%d.%m %H:%M') ~ ' ' ~ ((berechnet | float(0) | round(1)) | string) ~ '✕' %}
                                {{ (teile[-3:] + [eintrag]) | join(' · ') }}
                    default:
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_feedback_status
                        data:
                          value: "p3_nicht_gelernt_anstieg_zu_klein_{{ anstieg | float(0) | round(1) }}"
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_p3_letztes_lernergebnis
                        data:
                          value: >
                            Nicht gelernt: Feuchteanstieg {{ anstieg | float(0) | round(1) }} %
                            ist kleiner als {{ min_anstieg | float(0) | round(1) }} %
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.plantinator_bewasserung_p3_letzter_feedback_zeitpunkt
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

          - conditions:
              - condition: template
                value_template: "{{ p == 4 }}"
            sequence:
              - variables:
                  vor: "{{ states('input_number.plantinator_bewasserung_p4_feuchte_vor_guss') | float(0) }}"
                  ml: "{{ states('input_number.plantinator_bewasserung_p4_letzter_normalguss_ml') | float(0) }}"
                  alt: >
                    {{ states('input_number.plantinator_bewasserung_p4_gelernt_ml_pro_prozent') | float(100)
                       if is_state('input_boolean.plantinator_bewasserung_p4_lernwert_gueltig', 'on')
                       else states('input_number.plantinator_bewasserung_startwert_ml_pro_prozent') | float(35) }}
                  anstieg: "{{ feuchte - (states('input_number.plantinator_bewasserung_p4_feuchte_vor_guss') | float(0)) }}"
                  berechnet: >
                    {% set a = feuchte - (states('input_number.plantinator_bewasserung_p4_feuchte_vor_guss') | float(0)) %}
                    {% set ml = states('input_number.plantinator_bewasserung_p4_letzter_normalguss_ml') | float(0) %}
                    {% if a > 0 and ml > 0 %}{{ ml / a }}{% else %}0{% endif %}
                  begrenzt: "{{ [[berechnet | float(0), min_mlp | float(20)] | max, max_mlp | float(250)] | min }}"
                  gueltige_anzahl: "{{ states('counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig') | int(0) }}"
                  abweichung_prozent: >
                    {% if (alt | float(0)) > 0 %}
                      {{ ((((berechnet | float(0)) - (alt | float(0))) | abs) / (alt | float(1))) * 100 }}
                    {% else %}0{% endif %}
                  ausreisser: >
                    {{ (berechnet | float(0)) < (min_mlp | float(20))
                       or (berechnet | float(0)) > (max_mlp | float(250))
                       or (
                         is_state('input_boolean.plantinator_bewasserung_p4_lernwert_gueltig', 'on')
                         and (gueltige_anzahl | int(0)) >= (pruefung_ab | int(3))
                         and (abweichung_prozent | float(0)) > (max_abweichung | float(50))
                       ) }}
                  ziel_geglaettet: "{{ (alt | float(100)) * (1 - (lernrate | float(0.3))) + (begrenzt | float(100)) * (lernrate | float(0.3)) }}"
                  neu: >
                    {% if is_state('input_boolean.plantinator_bewasserung_p4_lernwert_gueltig', 'on') %}
                      {% set untergrenze = (alt | float(100)) * (1 - ((max_aenderung | float(20)) / 100)) %}
                      {% set obergrenze = (alt | float(100)) * (1 + ((max_aenderung | float(20)) / 100)) %}
                      {{ [[ziel_geglaettet | float(100), untergrenze] | max, obergrenze] | min | round(1) }}
                    {% else %}
                      {{ ziel_geglaettet | float(100) | round(1) }}
                    {% endif %}
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p4_feuchte_nach_guss
                data:
                  value: "{{ feuchte }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >
                          {{ anstieg | float(0) >= min_anstieg | float(2)
                             and ml | float(0) > 0
                             and not (ausreisser | bool) }}
                    sequence:
                      - service: input_number.set_value
                        target:
                          entity_id: input_number.plantinator_bewasserung_p4_gelernt_ml_pro_prozent
                        data:
                          value: "{{ neu }}"
                      - service: input_boolean.turn_on
                        target:
                          entity_id: input_boolean.plantinator_bewasserung_p4_lernwert_gueltig
                      - service: counter.increment
                        target:
                          entity_id: counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_feedback_status
                        data:
                          value: "p4_gelernt_{{ neu }}ml_prozent_anstieg{{ anstieg | float(0) | round(1) }}"
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_p4_letztes_lernergebnis
                        data:
                          value: >
                            Akzeptiert: {{ neu }} ml/% (Messwert {{ berechnet | float(0) | round(1) }},
                            Anstieg {{ anstieg | float(0) | round(1) }} %)
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_p4_lernhistorie
                        data:
                          value: >
                            {% set alt_hist = states('input_text.plantinator_bewasserung_p4_lernhistorie') %}
                            {% set teile = alt_hist.split(' · ') if alt_hist not in ['', 'unknown', 'unavailable', 'keine'] else [] %}
                            {% set eintrag = now().strftime('%d.%m %H:%M') ~ ' ' ~ (neu | string) ~ '✓' %}
                            {{ (teile[-3:] + [eintrag]) | join(' · ') }}
                default:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >
                              {{ anstieg | float(0) >= min_anstieg | float(2)
                                 and ml | float(0) > 0
                                 and (ausreisser | bool) }}
                        sequence:
                          - service: counter.increment
                            target:
                              entity_id: counter.plantinator_bewasserung_p4_lernwert_ausreisser
                          - service: input_text.set_value
                            target:
                              entity_id: input_text.plantinator_bewasserung_feedback_status
                            data:
                              value: "p4_ausreisser_verworfen_{{ berechnet | float(0) | round(1) }}ml_prozent"
                          - service: input_text.set_value
                            target:
                              entity_id: input_text.plantinator_bewasserung_p4_letztes_lernergebnis
                            data:
                              value: >
                                Ausreißer verworfen: {{ berechnet | float(0) | round(1) }} ml/%
                                (Abweichung {{ abweichung_prozent | float(0) | round(0) }} %)
                          - service: input_text.set_value
                            target:
                              entity_id: input_text.plantinator_bewasserung_p4_lernhistorie
                            data:
                              value: >
                                {% set alt_hist = states('input_text.plantinator_bewasserung_p4_lernhistorie') %}
                                {% set teile = alt_hist.split(' · ') if alt_hist not in ['', 'unknown', 'unavailable', 'keine'] else [] %}
                                {% set eintrag = now().strftime('%d.%m %H:%M') ~ ' ' ~ ((berechnet | float(0) | round(1)) | string) ~ '✕' %}
                                {{ (teile[-3:] + [eintrag]) | join(' · ') }}
                    default:
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_feedback_status
                        data:
                          value: "p4_nicht_gelernt_anstieg_zu_klein_{{ anstieg | float(0) | round(1) }}"
                      - service: input_text.set_value
                        target:
                          entity_id: input_text.plantinator_bewasserung_p4_letztes_lernergebnis
                        data:
                          value: >
                            Nicht gelernt: Feuchteanstieg {{ anstieg | float(0) | round(1) }} %
                            ist kleiner als {{ min_anstieg | float(0) | round(1) }} %
              - service: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.plantinator_bewasserung_p4_letzter_feedback_zeitpunkt
                data:
                  datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

      - service: input_text.set_value
        target:
          entity_id: "input_text.plantinator_bewasserung_crop_p{{ p }}_letzter_sequenztyp"
        data:
          value: keiner

      - service: input_boolean.turn_off
        target:
          entity_id: "input_boolean.plantinator_bewasserung_p{{ p }}_feedback_ausstehend"

automation:
  - id: plantinator_bewasserung_feedback_peak_nach_guss_verfolgen
    alias: Plantinator Bewasserung Feedback - Peak nach Guss verfolgen
    mode: parallel
    max: 10
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_p1_bodenfeuchte_wert
        id: p1
      - platform: state
        entity_id: sensor.plantinator_bewasserung_p2_bodenfeuchte_wert
        id: p2
      - platform: state
        entity_id: sensor.plantinator_bewasserung_p3_bodenfeuchte_wert
        id: p3
      - platform: state
        entity_id: sensor.plantinator_bewasserung_p4_bodenfeuchte_wert
        id: p4
    variables:
      p: "{{ trigger.id | replace('p', '') | int(0) }}"
      feuchte_raw: "{{ trigger.to_state.state }}"
      feuchte: "{{ trigger.to_state.state | float(0) }}"
      peak: "{{ states('input_number.plantinator_bewasserung_p' ~ p ~ '_feedback_peak_prozent') | float(0) }}"
    condition:
      - condition: template
        value_template: >
          {{ p in [1, 2, 3, 4]
             and is_number(feuchte_raw)
             and is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_feedback_ausstehend', 'on')
             and (feuchte | float(0)) > (peak | float(0)) }}
    action:
      - service: input_number.set_value
        target:
          entity_id: "input_number.plantinator_bewasserung_p{{ p }}_feedback_peak_prozent"
        data:
          value: "{{ feuchte | round(1) }}"

  - id: plantinator_bewasserung_feedback_normalguss_fertig_auswerten
    alias: Plantinator Bewasserung Feedback - Normalguss fertig auswerten
    mode: queued
    trigger:
      - platform: state
        entity_id: sensor.plantinator_bewasserung_exec_status
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state is match('^normalguss_fertig_p[1-4]_[0-9]+ml_[0-9]+$') }}"
    action:
      - variables:
          status: "{{ trigger.to_state.state }}"
          p: "{{ status.split('_p')[1].split('_')[0] | int }}"
          warte_min: "{{ states('input_number.plantinator_bewasserung_feedback_wartezeit_minuten') | int(10) }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_feedback_status
        data:
          value: "warte_auf_stabilisierung_p{{ p }}_{{ warte_min }}min"
      - delay:
          minutes: "{{ warte_min }}"
      - service: script.plantinator_bewasserung_feedback_nach_guss_auswerten
        data:
          pflanze: "{{ p }}"
