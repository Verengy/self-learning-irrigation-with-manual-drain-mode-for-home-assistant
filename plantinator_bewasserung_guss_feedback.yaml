  plantinator_bewasserung_feedback_nach_guss_auswerten:
    alias: Plantinator Bewasserung Feedback nach Guss auswerten
    icon: mdi:brain
    mode: queued
    fields:
      pflanze:
        name: Pflanze
        required: true
        selector:
          number:
            min: 1
            max: 4
            step: 1
    sequence:
      - variables:
          p: "{{ pflanze | int }}"
          feuchte_raw: "{{ states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') }}"
          feuchte: "{{ states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') | float(0) }}"
          feuchte_gueltig: >
            {% set raw = states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') %}
            {{ is_number(raw) and (raw | float(0)) >= 0 and (raw | float(0)) <= 100 }}
          lernrate: "{{ (states('input_number.plantinator_bewasserung_feedback_lernrate_prozent') | float(30)) / 100 }}"
          min_anstieg: "{{ states('input_number.plantinator_bewasserung_feedback_min_anstieg_prozent') | float(2) }}"
          min_mlp: "{{ states('input_number.plantinator_bewasserung_feedback_min_ml_pro_prozent') | float(20) }}"
          max_mlp: "{{ states('input_number.plantinator_bewasserung_feedback_max_ml_pro_prozent') | float(250) }}"
          pruefung_ab: "{{ states('input_number.plantinator_bewasserung_feedback_ausreisser_pruefung_ab_anzahl') | int(3) }}"
          max_abweichung: "{{ states('input_number.plantinator_bewasserung_feedback_ausreisser_max_abweichung_prozent') | float(50) }}"
          max_aenderung: "{{ states('input_number.plantinator_bewasserung_feedback_max_aenderung_pro_lernvorgang_prozent') | float(20) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: >
                  {{ not is_state('input_boolean.plantinator_bewasserung_p' ~ p ~ '_feedback_ausstehend', 'on')
                     or not feuchte_gueltig
                     or min_mlp > max_mlp
                     or lernrate <= 0
                     or lernrate > 1 }}
