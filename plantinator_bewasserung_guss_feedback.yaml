############################################################
# PLANTINATOR BEWASSERUNG - GUSS FEEDBACK / LERNWERT V2
# Datei: plantinator_bewasserung_guss_feedback.yaml
#
# Zweck:
# - Beobachtet normale EXEC-Güsse
# - Speichert Bodenfeuchte vor dem Guss
# - Wartet eine einstellbare Stabilisierungszeit
# - Speichert Bodenfeuchte nach dem Guss
# - Berechnet ml pro 1 % Bodenfeuchteanstieg
# - Aktualisiert pro Pflanze einen geglätteten Lernwert
# - Schützt den Lernwert vor unplausiblen Ausreißern
# - Protokolliert Lernverlauf, Lernvertrauen und Feuchtestabilität
#
# Wichtig:
# - Diese Datei steuert keine Pumpe und keine Ventile
# - Mess-Drain-Güsse werden NICHT als normaler Lernwert übernommen
# - Der globale Startwert bleibt nur Fallback, bis echte Lernwerte vorhanden sind
############################################################

