template:
  - sensor:
      - name: Plantinator Bewasserung P1 Feuchteanstieg letzter Guss
        unique_id: plantinator_bewasserung_p1_feuchteanstieg_letzter_guss
        icon: mdi:chart-line
        unit_of_measurement: "%"
        state: >
          {% set vor = states('input_number.plantinator_bewasserung_p1_feuchte_vor_guss') | float(0) %}
          {% set nach = states('input_number.plantinator_bewasserung_p1_feuchte_nach_guss') | float(0) %}
          {{ (nach - vor) | round(1) }}

      - name: Plantinator Bewasserung P2 Feuchteanstieg letzter Guss
        unique_id: plantinator_bewasserung_p2_feuchteanstieg_letzter_guss
        icon: mdi:chart-line
        unit_of_measurement: "%"
        state: >
          {% set vor = states('input_number.plantinator_bewasserung_p2_feuchte_vor_guss') | float(0) %}
          {% set nach = states('input_number.plantinator_bewasserung_p2_feuchte_nach_guss') | float(0) %}
          {{ (nach - vor) | round(1) }}

      - name: Plantinator Bewasserung P3 Feuchteanstieg letzter Guss
        unique_id: plantinator_bewasserung_p3_feuchteanstieg_letzter_guss
        icon: mdi:chart-line
        unit_of_measurement: "%"
        state: >
          {% set vor = states('input_number.plantinator_bewasserung_p3_feuchte_vor_guss') | float(0) %}
          {% set nach = states('input_number.plantinator_bewasserung_p3_feuchte_nach_guss') | float(0) %}
          {{ (nach - vor) | round(1) }}

      - name: Plantinator Bewasserung P4 Feuchteanstieg letzter Guss
        unique_id: plantinator_bewasserung_p4_feuchteanstieg_letzter_guss
        icon: mdi:chart-line
        unit_of_measurement: "%"
        state: >
          {% set vor = states('input_number.plantinator_bewasserung_p4_feuchte_vor_guss') | float(0) %}
          {% set nach = states('input_number.plantinator_bewasserung_p4_feuchte_nach_guss') | float(0) %}
          {{ (nach - vor) | round(1) }}

      - name: Plantinator Bewasserung P1 berechnet ml pro Prozent letzter Guss
        unique_id: plantinator_bewasserung_p1_berechnet_ml_pro_prozent_letzter_guss
        icon: mdi:calculator-variant
        unit_of_measurement: "ml/%"
        state: >
          {% set ml = states('input_number.plantinator_bewasserung_p1_letzter_normalguss_ml') | float(0) %}
          {% set anstieg = states('sensor.plantinator_bewasserung_p1_feuchteanstieg_letzter_guss') | float(0) %}
          {% if ml > 0 and anstieg > 0 %}
            {{ (ml / anstieg) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: Plantinator Bewasserung P2 berechnet ml pro Prozent letzter Guss
        unique_id: plantinator_bewasserung_p2_berechnet_ml_pro_prozent_letzter_guss
        icon: mdi:calculator-variant
        unit_of_measurement: "ml/%"
        state: >
          {% set ml = states('input_number.plantinator_bewasserung_p2_letzter_normalguss_ml') | float(0) %}
          {% set anstieg = states('sensor.plantinator_bewasserung_p2_feuchteanstieg_letzter_guss') | float(0) %}
          {% if ml > 0 and anstieg > 0 %}
            {{ (ml / anstieg) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: Plantinator Bewasserung P3 berechnet ml pro Prozent letzter Guss
        unique_id: plantinator_bewasserung_p3_berechnet_ml_pro_prozent_letzter_guss
        icon: mdi:calculator-variant
        unit_of_measurement: "ml/%"
        state: >
          {% set ml = states('input_number.plantinator_bewasserung_p3_letzter_normalguss_ml') | float(0) %}
          {% set anstieg = states('sensor.plantinator_bewasserung_p3_feuchteanstieg_letzter_guss') | float(0) %}
          {% if ml > 0 and anstieg > 0 %}
            {{ (ml / anstieg) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: Plantinator Bewasserung P4 berechnet ml pro Prozent letzter Guss
        unique_id: plantinator_bewasserung_p4_berechnet_ml_pro_prozent_letzter_guss
        icon: mdi:calculator-variant
        unit_of_measurement: "ml/%"
        state: >
          {% set ml = states('input_number.plantinator_bewasserung_p4_letzter_normalguss_ml') | float(0) %}
          {% set anstieg = states('sensor.plantinator_bewasserung_p4_feuchteanstieg_letzter_guss') | float(0) %}
          {% if ml > 0 and anstieg > 0 %}
            {{ (ml / anstieg) | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: Plantinator Bewasserung P1 Lernvertrauen
        unique_id: plantinator_bewasserung_p1_lernvertrauen
        icon: mdi:shield-star-outline
        unit_of_measurement: "%"
        state: >
          {% set anzahl = states('counter.plantinator_bewasserung_p1_lernvorgaenge_gueltig') | int(0) %}
          {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
          {{ ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) | round(0) | int }}
        attributes:
          stufe: >
            {% set anzahl = states('counter.plantinator_bewasserung_p1_lernvorgaenge_gueltig') | int(0) %}
            {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
            {% set v = ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) %}
            {{ 'hoch' if v >= 100 else 'mittel' if v >= 50 else 'niedrig' if v > 0 else 'nicht_angelernt' }}
          gueltige_lernvorgaenge: "{{ states('counter.plantinator_bewasserung_p1_lernvorgaenge_gueltig') }}"
          verworfene_ausreisser: "{{ states('counter.plantinator_bewasserung_p1_lernwert_ausreisser') }}"
          letztes_ergebnis: "{{ states('input_text.plantinator_bewasserung_p1_letztes_lernergebnis') }}"
          lernhistorie: "{{ states('input_text.plantinator_bewasserung_p1_lernhistorie') }}"

      - name: Plantinator Bewasserung P2 Lernvertrauen
        unique_id: plantinator_bewasserung_p2_lernvertrauen
        icon: mdi:shield-star-outline
        unit_of_measurement: "%"
        state: >
          {% set anzahl = states('counter.plantinator_bewasserung_p2_lernvorgaenge_gueltig') | int(0) %}
          {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
          {{ ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) | round(0) | int }}
        attributes:
          stufe: >
            {% set anzahl = states('counter.plantinator_bewasserung_p2_lernvorgaenge_gueltig') | int(0) %}
            {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
            {% set v = ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) %}
            {{ 'hoch' if v >= 100 else 'mittel' if v >= 50 else 'niedrig' if v > 0 else 'nicht_angelernt' }}
          gueltige_lernvorgaenge: "{{ states('counter.plantinator_bewasserung_p2_lernvorgaenge_gueltig') }}"
          verworfene_ausreisser: "{{ states('counter.plantinator_bewasserung_p2_lernwert_ausreisser') }}"
          letztes_ergebnis: "{{ states('input_text.plantinator_bewasserung_p2_letztes_lernergebnis') }}"
          lernhistorie: "{{ states('input_text.plantinator_bewasserung_p2_lernhistorie') }}"

      - name: Plantinator Bewasserung P3 Lernvertrauen
        unique_id: plantinator_bewasserung_p3_lernvertrauen
        icon: mdi:shield-star-outline
        unit_of_measurement: "%"
        state: >
          {% set anzahl = states('counter.plantinator_bewasserung_p3_lernvorgaenge_gueltig') | int(0) %}
          {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
          {{ ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) | round(0) | int }}
        attributes:
          stufe: >
            {% set anzahl = states('counter.plantinator_bewasserung_p3_lernvorgaenge_gueltig') | int(0) %}
            {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
            {% set v = ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) %}
            {{ 'hoch' if v >= 100 else 'mittel' if v >= 50 else 'niedrig' if v > 0 else 'nicht_angelernt' }}
          gueltige_lernvorgaenge: "{{ states('counter.plantinator_bewasserung_p3_lernvorgaenge_gueltig') }}"
          verworfene_ausreisser: "{{ states('counter.plantinator_bewasserung_p3_lernwert_ausreisser') }}"
          letztes_ergebnis: "{{ states('input_text.plantinator_bewasserung_p3_letztes_lernergebnis') }}"
          lernhistorie: "{{ states('input_text.plantinator_bewasserung_p3_lernhistorie') }}"

      - name: Plantinator Bewasserung P4 Lernvertrauen
        unique_id: plantinator_bewasserung_p4_lernvertrauen
        icon: mdi:shield-star-outline
        unit_of_measurement: "%"
        state: >
          {% set anzahl = states('counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig') | int(0) %}
          {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
          {{ ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) | round(0) | int }}
        attributes:
          stufe: >
            {% set anzahl = states('counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig') | int(0) %}
            {% set voll = states('input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl') | int(5) %}
            {% set v = ([((anzahl / ([voll, 1] | max)) * 100), 100] | min) %}
            {{ 'hoch' if v >= 100 else 'mittel' if v >= 50 else 'niedrig' if v > 0 else 'nicht_angelernt' }}
          gueltige_lernvorgaenge: "{{ states('counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig') }}"
          verworfene_ausreisser: "{{ states('counter.plantinator_bewasserung_p4_lernwert_ausreisser') }}"
          letztes_ergebnis: "{{ states('input_text.plantinator_bewasserung_p4_letztes_lernergebnis') }}"
          lernhistorie: "{{ states('input_text.plantinator_bewasserung_p4_lernhistorie') }}"

      - name: Plantinator Bewasserung P1 Feuchtestabilitaet
        unique_id: plantinator_bewasserung_p1_feuchtestabilitaet
        icon: mdi:chart-line-variant
        state: >
          {% set abfall = (
            states('input_number.plantinator_bewasserung_p1_feedback_peak_prozent') | float(0)
            - states('input_number.plantinator_bewasserung_p1_feuchte_nach_guss') | float(0)
          ) %}
          {% set peak = states('input_number.plantinator_bewasserung_p1_feedback_peak_prozent') | float(0) %}
          {% set stabil = states('input_number.plantinator_bewasserung_p1_feuchte_nach_guss') | float(0) %}
          {% set warnung = states('input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent') | float(3) %}
          {{ 'wartet' if is_state('input_boolean.plantinator_bewasserung_p1_feedback_ausstehend', 'on')
             else 'keine_daten' if peak <= 0 or stabil <= 0
             else 'auffaellig' if abfall > warnung else 'stabil' }}
        attributes:
          peak_prozent: "{{ states('input_number.plantinator_bewasserung_p1_feedback_peak_prozent') }}"
          stabilisiert_prozent: "{{ states('input_number.plantinator_bewasserung_p1_feuchte_nach_guss') }}"
          peak_abfall_prozent: >
            {{ [(
              states('input_number.plantinator_bewasserung_p1_feedback_peak_prozent') | float(0)
              - states('input_number.plantinator_bewasserung_p1_feuchte_nach_guss') | float(0)
            ), 0] | max | round(1) }}

      - name: Plantinator Bewasserung P2 Feuchtestabilitaet
        unique_id: plantinator_bewasserung_p2_feuchtestabilitaet
        icon: mdi:chart-line-variant
        state: >
          {% set abfall = (
            states('input_number.plantinator_bewasserung_p2_feedback_peak_prozent') | float(0)
            - states('input_number.plantinator_bewasserung_p2_feuchte_nach_guss') | float(0)
          ) %}
          {% set peak = states('input_number.plantinator_bewasserung_p2_feedback_peak_prozent') | float(0) %}
          {% set stabil = states('input_number.plantinator_bewasserung_p2_feuchte_nach_guss') | float(0) %}
          {% set warnung = states('input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent') | float(3) %}
          {{ 'wartet' if is_state('input_boolean.plantinator_bewasserung_p2_feedback_ausstehend', 'on')
             else 'keine_daten' if peak <= 0 or stabil <= 0
             else 'auffaellig' if abfall > warnung else 'stabil' }}
        attributes:
          peak_prozent: "{{ states('input_number.plantinator_bewasserung_p2_feedback_peak_prozent') }}"
          stabilisiert_prozent: "{{ states('input_number.plantinator_bewasserung_p2_feuchte_nach_guss') }}"
          peak_abfall_prozent: >
            {{ [(
              states('input_number.plantinator_bewasserung_p2_feedback_peak_prozent') | float(0)
              - states('input_number.plantinator_bewasserung_p2_feuchte_nach_guss') | float(0)
            ), 0] | max | round(1) }}

      - name: Plantinator Bewasserung P3 Feuchtestabilitaet
        unique_id: plantinator_bewasserung_p3_feuchtestabilitaet
        icon: mdi:chart-line-variant
        state: >
          {% set abfall = (
            states('input_number.plantinator_bewasserung_p3_feedback_peak_prozent') | float(0)
            - states('input_number.plantinator_bewasserung_p3_feuchte_nach_guss') | float(0)
          ) %}
          {% set peak = states('input_number.plantinator_bewasserung_p3_feedback_peak_prozent') | float(0) %}
          {% set stabil = states('input_number.plantinator_bewasserung_p3_feuchte_nach_guss') | float(0) %}
          {% set warnung = states('input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent') | float(3) %}
          {{ 'wartet' if is_state('input_boolean.plantinator_bewasserung_p3_feedback_ausstehend', 'on')
             else 'keine_daten' if peak <= 0 or stabil <= 0
             else 'auffaellig' if abfall > warnung else 'stabil' }}
        attributes:
          peak_prozent: "{{ states('input_number.plantinator_bewasserung_p3_feedback_peak_prozent') }}"
          stabilisiert_prozent: "{{ states('input_number.plantinator_bewasserung_p3_feuchte_nach_guss') }}"
          peak_abfall_prozent: >
            {{ [(
              states('input_number.plantinator_bewasserung_p3_feedback_peak_prozent') | float(0)
              - states('input_number.plantinator_bewasserung_p3_feuchte_nach_guss') | float(0)
            ), 0] | max | round(1) }}

      - name: Plantinator Bewasserung P4 Feuchtestabilitaet
        unique_id: plantinator_bewasserung_p4_feuchtestabilitaet
        icon: mdi:chart-line-variant
        state: >
          {% set abfall = (
            states('input_number.plantinator_bewasserung_p4_feedback_peak_prozent') | float(0)
            - states('input_number.plantinator_bewasserung_p4_feuchte_nach_guss') | float(0)
          ) %}
          {% set peak = states('input_number.plantinator_bewasserung_p4_feedback_peak_prozent') | float(0) %}
          {% set stabil = states('input_number.plantinator_bewasserung_p4_feuchte_nach_guss') | float(0) %}
          {% set warnung = states('input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent') | float(3) %}
          {{ 'wartet' if is_state('input_boolean.plantinator_bewasserung_p4_feedback_ausstehend', 'on')
             else 'keine_daten' if peak <= 0 or stabil <= 0
             else 'auffaellig' if abfall > warnung else 'stabil' }}
        attributes:
          peak_prozent: "{{ states('input_number.plantinator_bewasserung_p4_feedback_peak_prozent') }}"
          stabilisiert_prozent: "{{ states('input_number.plantinator_bewasserung_p4_feuchte_nach_guss') }}"
          peak_abfall_prozent: >
            {{ [(
              states('input_number.plantinator_bewasserung_p4_feedback_peak_prozent') | float(0)
              - states('input_number.plantinator_bewasserung_p4_feuchte_nach_guss') | float(0)
            ), 0] | max | round(1) }}

      - name: Plantinator Bewasserung Feedback Status
        unique_id: plantinator_bewasserung_feedback_status_sensor
        icon: mdi:brain
        state: "{{ states('input_text.plantinator_bewasserung_feedback_status') }}"
        attributes:
          p1_gelernt_ml_pro_prozent: "{{ states('input_number.plantinator_bewasserung_p1_gelernt_ml_pro_prozent') }}"
          p2_gelernt_ml_pro_prozent: "{{ states('input_number.plantinator_bewasserung_p2_gelernt_ml_pro_prozent') }}"
          p3_gelernt_ml_pro_prozent: "{{ states('input_number.plantinator_bewasserung_p3_gelernt_ml_pro_prozent') }}"
          p4_gelernt_ml_pro_prozent: "{{ states('input_number.plantinator_bewasserung_p4_gelernt_ml_pro_prozent') }}"
          p1_lernwert_gueltig: "{{ states('input_boolean.plantinator_bewasserung_p1_lernwert_gueltig') }}"
          p2_lernwert_gueltig: "{{ states('input_boolean.plantinator_bewasserung_p2_lernwert_gueltig') }}"
          p3_lernwert_gueltig: "{{ states('input_boolean.plantinator_bewasserung_p3_lernwert_gueltig') }}"
          p4_lernwert_gueltig: "{{ states('input_boolean.plantinator_bewasserung_p4_lernwert_gueltig') }}"

script:
  plantinator_bewasserung_feedback_standardwerte_setzen:
    alias: Plantinator Bewasserung Neuer Topf oder Substrat
    icon: mdi:flower-pot-outline
    mode: single
    sequence:
      # Neue Topf-/Substratbasis: Lernsensorik wieder mit den sicheren
      # Projekt-Standardwerten beginnen lassen.
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_startwert_ml_pro_prozent
        data:
          value: 35

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_min_empfohlener_guss_ml
        data:
          value: 50

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_notguss_schwelle_prozent
        data:
          value: 5

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_wartezeit_minuten
        data:
          value: 10

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_lernrate_prozent
        data:
          value: 30

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_min_anstieg_prozent
        data:
          value: 2

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_min_ml_pro_prozent
        data:
          value: 20

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_max_ml_pro_prozent
        data:
          value: 250

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_ausreisser_pruefung_ab_anzahl
        data:
          value: 3

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_ausreisser_max_abweichung_prozent
        data:
          value: 50

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_max_aenderung_pro_lernvorgang_prozent
        data:
          value: 20

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl
        data:
          value: 5

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent
        data:
          value: 3

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_wetback_peak_toleranz_prozent
        data:
          value: 0.5

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_wetback_nachguss_max_ml
        data:
          value: 800

      - service: input_number.set_value
        target:
          entity_id:
            - input_number.plantinator_bewasserung_p1_gelernt_ml_pro_prozent
            - input_number.plantinator_bewasserung_p2_gelernt_ml_pro_prozent
            - input_number.plantinator_bewasserung_p3_gelernt_ml_pro_prozent
            - input_number.plantinator_bewasserung_p4_gelernt_ml_pro_prozent
        data:
          value: 35

      # Mess- und Diagnosewerte des alten Topfs vollständig verwerfen.
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.plantinator_bewasserung_p1_letzter_normalguss_ml
            - input_number.plantinator_bewasserung_p2_letzter_normalguss_ml
            - input_number.plantinator_bewasserung_p3_letzter_normalguss_ml
            - input_number.plantinator_bewasserung_p4_letzter_normalguss_ml
            - input_number.plantinator_bewasserung_p1_feuchte_vor_guss
            - input_number.plantinator_bewasserung_p2_feuchte_vor_guss
            - input_number.plantinator_bewasserung_p3_feuchte_vor_guss
            - input_number.plantinator_bewasserung_p4_feuchte_vor_guss
            - input_number.plantinator_bewasserung_p1_feuchte_nach_guss
            - input_number.plantinator_bewasserung_p2_feuchte_nach_guss
            - input_number.plantinator_bewasserung_p3_feuchte_nach_guss
            - input_number.plantinator_bewasserung_p4_feuchte_nach_guss
            - input_number.plantinator_bewasserung_p1_feedback_peak_prozent
            - input_number.plantinator_bewasserung_p2_feedback_peak_prozent
            - input_number.plantinator_bewasserung_p3_feedback_peak_prozent
            - input_number.plantinator_bewasserung_p4_feedback_peak_prozent
        data:
          value: 0

      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.plantinator_bewasserung_p1_lernwert_gueltig
            - input_boolean.plantinator_bewasserung_p2_lernwert_gueltig
            - input_boolean.plantinator_bewasserung_p3_lernwert_gueltig
            - input_boolean.plantinator_bewasserung_p4_lernwert_gueltig
            - input_boolean.plantinator_bewasserung_p1_feedback_ausstehend
            - input_boolean.plantinator_bewasserung_p2_feedback_ausstehend
            - input_boolean.plantinator_bewasserung_p3_feedback_ausstehend
            - input_boolean.plantinator_bewasserung_p4_feedback_ausstehend

      # Ein neuer Topf besitzt noch keinen gemessenen Peak.
      - service: input_number.set_value
        target:
          entity_id:
            - input_number.plantinator_bewasserung_crop_p1_letzter_peak_prozent
            - input_number.plantinator_bewasserung_crop_p2_letzter_peak_prozent
            - input_number.plantinator_bewasserung_crop_p3_letzter_peak_prozent
            - input_number.plantinator_bewasserung_crop_p4_letzter_peak_prozent
        data:
          value: 0

      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.plantinator_bewasserung_crop_p1_ramp_up_abgeschlossen
            - input_boolean.plantinator_bewasserung_crop_p2_ramp_up_abgeschlossen
            - input_boolean.plantinator_bewasserung_crop_p3_ramp_up_abgeschlossen
            - input_boolean.plantinator_bewasserung_crop_p4_ramp_up_abgeschlossen

      - service: input_text.set_value
        target:
          entity_id:
            - input_text.plantinator_bewasserung_crop_p1_letzter_sequenztyp
            - input_text.plantinator_bewasserung_crop_p2_letzter_sequenztyp
            - input_text.plantinator_bewasserung_crop_p3_letzter_sequenztyp
            - input_text.plantinator_bewasserung_crop_p4_letzter_sequenztyp
        data:
          value: keiner

      - service: counter.reset
        target:
          entity_id:
            - counter.plantinator_bewasserung_p1_lernvorgaenge_gueltig
            - counter.plantinator_bewasserung_p2_lernvorgaenge_gueltig
            - counter.plantinator_bewasserung_p3_lernvorgaenge_gueltig
            - counter.plantinator_bewasserung_p4_lernvorgaenge_gueltig
            - counter.plantinator_bewasserung_p1_lernwert_ausreisser
            - counter.plantinator_bewasserung_p2_lernwert_ausreisser
            - counter.plantinator_bewasserung_p3_lernwert_ausreisser
            - counter.plantinator_bewasserung_p4_lernwert_ausreisser

      - service: input_text.set_value
        target:
          entity_id:
            - input_text.plantinator_bewasserung_p1_letztes_lernergebnis
            - input_text.plantinator_bewasserung_p2_letztes_lernergebnis
            - input_text.plantinator_bewasserung_p3_letztes_lernergebnis
            - input_text.plantinator_bewasserung_p4_letztes_lernergebnis
            - input_text.plantinator_bewasserung_p1_lernhistorie
            - input_text.plantinator_bewasserung_p2_lernhistorie
            - input_text.plantinator_bewasserung_p3_lernhistorie
            - input_text.plantinator_bewasserung_p4_lernhistorie
        data:
          value: keine

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_feedback_status
        data:
          value: neuer_topf_substrat_standardwerte_gesetzt

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_wetback_status
        data:
          value: bereit

  plantinator_bewasserung_feedback_schutzwerte_setzen:
    alias: Plantinator Bewasserung Feedback Schutzwerte setzen
    icon: mdi:shield-refresh-outline
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_wartezeit_minuten
        data:
          value: 10

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_ausreisser_pruefung_ab_anzahl
        data:
          value: 3

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_ausreisser_max_abweichung_prozent
        data:
          value: 50

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_max_aenderung_pro_lernvorgang_prozent
        data:
          value: 20

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_vertrauen_voll_ab_anzahl
        data:
          value: 5

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_feedback_peak_abfall_warnung_prozent
        data:
          value: 3

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_wetback_peak_toleranz_prozent
        data:
          value: 0.5

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_wetback_nachguss_max_ml
        data:
          value: 800

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_feedback_status
        data:
          value: schutzwerte_gesetzt_lernwerte_behalten

      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_wetback_status
        data:
          value: bereit

  plantinator_bewasserung_feedback_vor_guss_speichern:
    alias: Plantinator Bewasserung Feedback vor Guss speichern
    icon: mdi:content-save
    mode: queued
    fields:
      pflanze:
        name: Pflanze
        required: true
        selector:
          number:
            min: 1
            max: 4
            step: 1
      menge_ml:
        name: Menge ml
        required: true
        selector:
          number:
            min: 0
            max: 10000
            step: 1
    sequence:
      - variables:
          p: "{{ pflanze | int }}"
          ml: "{{ menge_ml | float(0) }}"
          feuchte_ent: "sensor.plantinator_bewasserung_p{{ pflanze | int }}_bodenfeuchte_wert"
          feuchte_raw: "{{ states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') }}"
          feuchte: "{{ states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') | float(0) }}"
          feuchte_gueltig: >
            {% set raw = states('sensor.plantinator_bewasserung_p' ~ (pflanze | int) ~ '_bodenfeuchte_wert') %}
            {{ is_number(raw) and (raw | float(0)) >= 0 and (raw | float(0)) <= 100 }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ not feuchte_gueltig or ml <= 0 }}"
            sequence:
              - service: input_boolean.turn_off
                target:
                  entity_id: "input_boolean.plantinator_bewasserung_p{{ p }}_feedback_ausstehend"
              - service: input_text.set_value
                target:
                  entity_id: input_text.plantinator_bewasserung_feedback_status
                data:
                  value: "vor_guss_ungueltig_p{{ p }}_sensor_{{ feuchte_raw }}"
              - stop: "Bodenfeuchte oder Gussmenge für Feedback ungültig."

      - service: input_boolean.turn_on
        target:
          entity_id: "input_boolean.plantinator_bewasserung_p{{ p }}_feedback_ausstehend"

      - service: input_number.set_value
        target:
          entity_id: "input_number.plantinator_bewasserung_p{{ p }}_feedback_peak_prozent"
        data:
          value: "{{ feuchte }}"

      - service: input_text.set_value
        target:
          entity_id: "input_text.plantinator_bewasserung_p{{ p }}_letztes_lernergebnis"
        data:
          value: "Messung läuft – Stabilisierung wird abgewartet"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ p == 1 }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p1_feuchte_vor_guss
                data:
                  value: "{{ feuchte }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p1_letzter_normalguss_ml
                data:
                  value: "{{ ml }}"
          - conditions:
              - condition: template
                value_template: "{{ p == 2 }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p2_feuchte_vor_guss
                data:
                  value: "{{ feuchte }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p2_letzter_normalguss_ml
                data:
                  value: "{{ ml }}"
          - conditions:
              - condition: template
                value_template: "{{ p == 3 }}"
            sequence:
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p3_feuchte_vor_guss
                data:
                  value: "{{ feuchte }}"
              - service: input_number.set_value
                target:
                  entity_id: input_number.plantinator_bewasserung_p3_letzter_normalguss_ml
                data:
                  value: "{{ ml }}"
          - conditions:
              - condition: template
                value_template: "{{ p == 4 }}"
