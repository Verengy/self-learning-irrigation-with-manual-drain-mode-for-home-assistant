template:
  - sensor:
      - name: Plantinator Bewasserung Mapping Status
        unique_id: plantinator_bewasserung_mapping_status
        icon: mdi:map-check
        state: >
          {% set ns = namespace(fehler=0) %}
          {% set pumpe = states('input_text.plantinator_bewasserung_pumpe_entity') | trim %}
          {% if not pumpe.startswith('switch.') or not has_value(pumpe) %}
            {% set ns.fehler = ns.fehler + 1 %}
          {% endif %}
          {% set hauptventil = states('input_text.plantinator_bewasserung_hauptventil_entity') | trim %}
          {% set hauptventil_nicht_verwendet = hauptventil in ['', 'unknown', 'unavailable', 'none'] %}
          {% if not hauptventil_nicht_verwendet and (not hauptventil.startswith('switch.') or not has_value(hauptventil)) %}
            {% set ns.fehler = ns.fehler + 1 %}
          {% endif %}
          {% set anzahl = states('input_number.plantinator_bewasserung_anzahl_pflanzen') | int(4) %}
          {% for i in range(1, anzahl + 1) %}
            {% if is_state('input_boolean.plantinator_bewasserung_p' ~ i ~ '_aktiv', 'on') %}
              {% set ventil = states('input_text.plantinator_bewasserung_p' ~ i ~ '_ventil_entity') | trim %}
              {% set feuchte = states('input_text.plantinator_bewasserung_p' ~ i ~ '_bodenfeuchte_entity') | trim %}
              {% set bodentemp = states('input_text.plantinator_bewasserung_p' ~ i ~ '_bodentemperatur_entity') | trim %}
              {% if not ventil.startswith('switch.') or not has_value(ventil) %}
                {% set ns.fehler = ns.fehler + 1 %}
              {% endif %}
              {% if not feuchte.startswith('sensor.') or not has_value(feuchte) or not is_number(states(feuchte)) %}
                {% set ns.fehler = ns.fehler + 1 %}
              {% endif %}
              {% if not bodentemp.startswith('sensor.') or not has_value(bodentemp) or not is_number(states(bodentemp)) %}
                {% set ns.fehler = ns.fehler + 1 %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% if is_state('input_boolean.plantinator_bewasserung_wasserstand_verwenden', 'on') %}
            {% set wasserstand = states('input_text.plantinator_bewasserung_wasserstand_entity') | trim %}
            {% if not (wasserstand.startswith('binary_sensor.') or wasserstand.startswith('input_boolean.'))
                  or not has_value(wasserstand) %}
              {% set ns.fehler = ns.fehler + 1 %}
            {% endif %}
          {% endif %}
          {% if is_state('input_boolean.plantinator_bewasserung_tank_umwalzung_verwenden', 'on') %}
            {% set umwalzung = states('input_text.plantinator_bewasserung_tank_umwalzung_entity') | trim %}
            {% if not umwalzung.startswith('switch.') or not has_value(umwalzung) %}
              {% set ns.fehler = ns.fehler + 1 %}
            {% endif %}
          {% endif %}
          {{ 'ok' if ns.fehler == 0 else 'fehler' }}
        attributes:
          pumpe_entity: "{{ states('input_text.plantinator_bewasserung_pumpe_entity') }}"
          hauptventil_entity: "{{ states('input_text.plantinator_bewasserung_hauptventil_entity') }}"
          wasserstand_entity: "{{ states('input_text.plantinator_bewasserung_wasserstand_entity') }}"
          wasserstand_sicherer_zustand: "{{ states('input_select.plantinator_bewasserung_wasserstand_sicherer_zustand') }}"
          pflanzen_anzahl: "{{ states('input_number.plantinator_bewasserung_anzahl_pflanzen') }}"

      - name: Plantinator Bewasserung Pumpe Status Gemappt
        unique_id: plantinator_bewasserung_pumpe_status_gemappt
        icon: mdi:pump
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_pumpe_entity') | trim %}
          {% if ent in ['', 'unknown', 'unavailable', 'none'] %}
            unknown
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_pumpe_entity') | trim }}"

      - name: Plantinator Bewasserung Hauptventil Status Gemappt
        unique_id: plantinator_bewasserung_hauptventil_status_gemappt
        icon: mdi:valve
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_hauptventil_entity') | trim %}
          {% if ent in ['', 'unknown', 'unavailable', 'none'] %}
            nicht_verwendet
          {% elif not ent.startswith('switch.') or not has_value(ent) %}
            unknown
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_hauptventil_entity') | trim }}"

      - name: Plantinator Bewasserung Wasserstand Status Gemappt
        unique_id: plantinator_bewasserung_wasserstand_status_gemappt
        icon: mdi:waves-arrow-up
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_wasserstand_entity') | trim %}
          {% if ent in ['', 'unknown', 'unavailable', 'none'] %}
            unknown
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_wasserstand_entity') | trim }}"

      - name: Plantinator Bewasserung Tank Umwalzung Status Gemappt
        unique_id: plantinator_bewasserung_tank_umwalzung_status_gemappt
        icon: mdi:autorenew
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_tank_umwalzung_entity') | trim %}
          {% if ent in ['', 'unknown', 'unavailable', 'none'] %}
            unknown
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_tank_umwalzung_entity') | trim }}"

      - name: Plantinator Bewasserung Beobachtung Mapping Status
        unique_id: plantinator_bewasserung_beobachtung_mapping_status
        icon: mdi:chart-box-outline
        state: >
          {% set ns = namespace(fehler=[]) %}
          {% set felder = [
            'zulauf_ec',
            'zulauf_ph',
            'zulauf_temperatur',
            'lufttemperatur',
            'luftfeuchtigkeit',
            'ppfd'
          ] %}
          {% for feld in felder %}
            {% set ent = states('input_text.plantinator_bewasserung_' ~ feld ~ '_entity') | trim %}
            {% if ent != '' and (not ent.startswith('sensor.') or not has_value(ent) or not is_number(states(ent))) %}
              {% set ns.fehler = ns.fehler + [feld] %}
            {% endif %}
          {% endfor %}
          {{ 'ok' if ns.fehler | count == 0 else 'fehler_' ~ (ns.fehler | join('_')) }}
        attributes:
          hinweis: >
            Diese optionalen Sensoren werden protokolliert. Klima, Licht
            und Zulauf wirken erst bei einem Einflusswert über 0 Prozent;
            fehlende Werte bleiben neutral.
          zulauf_ec_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ec_entity') | trim }}"
          zulauf_ph_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ph_entity') | trim }}"
          zulauf_temperatur_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_temperatur_entity') | trim }}"
          lufttemperatur_entity: "{{ states('input_text.plantinator_bewasserung_lufttemperatur_entity') | trim }}"
          luftfeuchtigkeit_entity: "{{ states('input_text.plantinator_bewasserung_luftfeuchtigkeit_entity') | trim }}"
          ppfd_entity: "{{ states('input_text.plantinator_bewasserung_ppfd_entity') | trim }}"

      - name: Plantinator Bewasserung Zulauf EC
        unique_id: plantinator_bewasserung_zulauf_ec
        icon: mdi:flash
        unit_of_measurement: "mS/cm"
        state_class: measurement
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_zulauf_ec_entity') | trim %}
          {% set val = states(ent) if ent.startswith('sensor.') and has_value(ent) else 'unknown' %}
          {{ (val | float | round(2)) if is_number(val) else 'unknown' }}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ec_entity') | trim }}"
          verwendung: protokollierung_und_optional_umweltfaktor

      - name: Plantinator Bewasserung Zulauf pH
        unique_id: plantinator_bewasserung_zulauf_ph
        icon: mdi:ph
        state_class: measurement
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_zulauf_ph_entity') | trim %}
          {% set val = states(ent) if ent.startswith('sensor.') and has_value(ent) else 'unknown' %}
          {{ (val | float | round(2)) if is_number(val) else 'unknown' }}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_zulauf_ph_entity') | trim }}"
          verwendung: protokollierung_und_optional_umweltfaktor

      - name: Plantinator Bewasserung Zulauf Temperatur
        unique_id: plantinator_bewasserung_zulauf_temperatur
        icon: mdi:thermometer-water
        device_class: temperature
        unit_of_measurement: "°C"
        state_class: measurement
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_zulauf_temperatur_entity') | trim %}
