script:
  plantinator_bewasserung_mapping_standardwerte_setzen:
    alias: Plantinator Bewässerung sichere Mapping-Grundwerte setzen
    icon: mdi:database-import
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_anzahl_pflanzen
        data:
          value: 4
      - service: input_boolean.turn_on
        target:
          entity_id:
            - input_boolean.plantinator_bewasserung_p1_aktiv
            - input_boolean.plantinator_bewasserung_p2_aktiv
            - input_boolean.plantinator_bewasserung_p3_aktiv
            - input_boolean.plantinator_bewasserung_p4_aktiv
      # Optionale Hardware bleibt aus, bis der Benutzer gültige Entity-IDs
      # manuell eingetragen und getestet hat.
      - service: input_boolean.turn_off
        target:
          entity_id:
            - input_boolean.plantinator_bewasserung_wasserstand_verwenden
            - input_boolean.plantinator_bewasserung_tank_umwalzung_verwenden
      - service: input_select.select_option
        target:
          entity_id: input_select.plantinator_bewasserung_wasserstand_sicherer_zustand
        data:
          option: "off"
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_p1_name
        data:
          value: Pflanze 1
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_p2_name
        data:
          value: Pflanze 2
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_p3_name
        data:
          value: Pflanze 3
      - service: input_text.set_value
        target:
          entity_id: input_text.plantinator_bewasserung_p4_name
        data:
          value: Pflanze 4
