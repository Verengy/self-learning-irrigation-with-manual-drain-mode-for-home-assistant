############################################################
# PLANTINATOR BEWASSERUNG - SHOT PLAN V3
# Datei: plantinator_shot_plan.yaml
#
# Zweck:
# - Zerlegt die empfohlene Normalguss-Menge in sichere Shots
# - Verteilt kleine Restmengen gleichmäßig, ohne das Shot-Maximum zu überschreiten
# - zeigt ml-Sequenz und Sekunden-Sequenz getrennt an
# - Reine Berechnung / Planung
# - Keine Pumpen-/Ventilsteuerung
# - Keine Automatik-Ausführung
#
# Benötigt:
# - plantinator_bewasserung_mapping.yaml
# - plantinator_bewasserung_profil.yaml
# - plantinator_bewasserung_crop_steering.yaml
# - plantinator_bewasserung_lernsensorik.yaml
############################################################

input_number:
  plantinator_bewasserung_shot_min_ml:
    name: Plantinator Bewasserung Shot Minimum ml
    icon: mdi:cup-water
    min: 25
    max: 2000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_max_ml:
    name: Plantinator Bewasserung Shot Maximum ml
    icon: mdi:cup-water
    min: 25
    max: 10000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_min_rest_ml:
    name: Plantinator Bewasserung Shot Minimum Rest ml
    icon: mdi:water-plus
    min: 0
    max: 2000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_pause_normal_sekunden:
    name: Plantinator Bewasserung Shot Pause Normal Sekunden
    icon: mdi:timer-sand
    min: 30
    max: 600
    step: 30
    mode: box
    unit_of_measurement: "s"

  plantinator_bewasserung_shot_pause_notguss_sekunden:
    name: Plantinator Bewasserung Shot Pause Notguss Sekunden
    icon: mdi:timer-alert
    min: 30
    max: 600
    step: 30
    mode: box
    unit_of_measurement: "s"

  plantinator_bewasserung_shot_max_anzahl:
    name: Plantinator Bewasserung Shot Max Anzahl
    icon: mdi:counter
    min: 1
    max: 20
    step: 1
    mode: box

template:
  - sensor:
      - name: Plantinator Bewasserung P1 Shot Plan
        unique_id: plantinator_bewasserung_p1_shot_plan
        icon: mdi:format-list-numbered
        state: >
          {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
          {% set bedarf = states('sensor.plantinator_bewasserung_p1_gussbedarf') %}
          {% if ml <= 0 or bedarf not in ['ja', 'notguss'] %}
            kein_guss
          {% elif bedarf == 'notguss' %}
            notguss_geplant
          {% else %}
            normalguss_geplant
          {% endif %}
        attributes:
          pflanze: "Pflanze 1"
          gussbedarf: "{{ states('sensor.plantinator_bewasserung_p1_gussbedarf') }}"
          empfehlung_ml: "{{ states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') }}"
          shot_max_anzahl: "{{ states('input_number.plantinator_bewasserung_shot_max_anzahl') }}"
          crop_shot_ml_effektiv: "{{ states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') }}"
          shot_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              0
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 or (full > 0 and rest >= minrest) %}
                {{ maxshot }}
              {% elif full == 0 %}
                {{ rest }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {{ base + (1 if (total - base * count) > 0 else 0) }}
              {% endif %}
            {% endif %}
          shot_anzahl: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              0
            {% else %}
              {{ ((total + maxshot - 1) // maxshot) | int }}
            {% endif %}
          sekunden_pro_shot: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(0) %}
            {% if total <= 0 or maxshot <= 0 or rate <= 0 %}
              0
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 or (full > 0 and rest >= minrest) %}
                {{ (maxshot / rate) | round(2) }}
              {% elif full == 0 %}
                {{ (rest / rate) | round(2) }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set first = base + (1 if (total - base * count) > 0 else 0) %}
                {{ (first / rate) | round(2) }}
              {% endif %}
            {% endif %}
          shot_sequence_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              []
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 %}
                {{ [maxshot] * full }}
              {% elif full == 0 %}
                {{ [rest] }}
              {% elif rest >= minrest %}
                {{ [maxshot] * full + [rest] }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set extra = (total - (base * count)) | int %}
                {% set ns = namespace(seq=[]) %}
                {% for n in range(count) %}
                  {% set ns.seq = ns.seq + [base + (1 if n < extra else 0)] %}
                {% endfor %}
                {{ ns.seq }}
              {% endif %}
            {% endif %}
          shot_sequence_seconds: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(0) %}
            {% if total <= 0 or maxshot <= 0 or rate <= 0 %}
              []
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 %}
                {% set amounts = [maxshot] * full %}
              {% elif full == 0 %}
                {% set amounts = [rest] %}
              {% elif rest >= minrest %}
                {% set amounts = [maxshot] * full + [rest] %}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set extra = (total - (base * count)) | int %}
                {% set ns = namespace(amounts=[]) %}
                {% for n in range(count) %}
                  {% set ns.amounts = ns.amounts + [base + (1 if n < extra else 0)] %}
                {% endfor %}
                {% set amounts = ns.amounts %}
              {% endif %}
              {% set ns = namespace(seq=[]) %}
              {% for amount in amounts %}
                {% set ns.seq = ns.seq + [(amount / rate) | round(2)] %}
              {% endfor %}
              {{ ns.seq }}
            {% endif %}
          geplante_gesamtmenge_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {{ total if total > 0 and maxshot > 0 else 0 }}
          pause_sekunden: >
            {% if states('sensor.plantinator_bewasserung_p1_gussbedarf') == 'notguss' %}
              {{ states('input_number.plantinator_bewasserung_shot_pause_notguss_sekunden') }}
            {% else %}
              {{ states('input_number.plantinator_bewasserung_shot_pause_normal_sekunden') }}
            {% endif %}
          gesamt_pumpenlaufzeit_sekunden: "{{ states('sensor.plantinator_bewasserung_p1_empfehlung_pumpenlaufzeit_sekunden') }}"
          hinweis: "Planung, keine Ausführung. Kleine Restmengen werden gleichmäßig verteilt; das Shot-Maximum bleibt hart."

