          {% set ml = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) %}
          {% set bedarf = states('sensor.plantinator_bewasserung_p4_gussbedarf') %}
          {% if ml <= 0 or bedarf not in ['ja', 'notguss'] %}
            kein_guss
          {% elif bedarf == 'notguss' %}
            notguss_geplant
          {% else %}
            normalguss_geplant
          {% endif %}
        attributes:
          pflanze: "Pflanze 4"
          gussbedarf: "{{ states('sensor.plantinator_bewasserung_p4_gussbedarf') }}"
          empfehlung_ml: "{{ states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') }}"
          shot_max_anzahl: "{{ states('input_number.plantinator_bewasserung_shot_max_anzahl') }}"
          crop_shot_ml_effektiv: "{{ states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') }}"
          shot_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              0
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 or (full > 0 and rest >= minrest) %}
                {{ maxshot }}
              {% elif full == 0 %}
                {{ rest }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {{ base + (1 if (total - base * count) > 0 else 0) }}
              {% endif %}
            {% endif %}
          shot_anzahl: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              0
            {% else %}
              {{ ((total + maxshot - 1) // maxshot) | int }}
            {% endif %}
          sekunden_pro_shot: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(0) %}
            {% if total <= 0 or maxshot <= 0 or rate <= 0 %}
              0
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 or (full > 0 and rest >= minrest) %}
                {{ (maxshot / rate) | round(2) }}
              {% elif full == 0 %}
                {{ (rest / rate) | round(2) }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set first = base + (1 if (total - base * count) > 0 else 0) %}
                {{ (first / rate) | round(2) }}
              {% endif %}
            {% endif %}
          shot_sequence_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% if total <= 0 or maxshot <= 0 %}
              []
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 %}
                {{ [maxshot] * full }}
              {% elif full == 0 %}
                {{ [rest] }}
              {% elif rest >= minrest %}
                {{ [maxshot] * full + [rest] }}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set extra = (total - (base * count)) | int %}
                {% set ns = namespace(seq=[]) %}
                {% for n in range(count) %}
                  {% set ns.seq = ns.seq + [base + (1 if n < extra else 0)] %}
                {% endfor %}
                {{ ns.seq }}
              {% endif %}
            {% endif %}
          shot_sequence_seconds: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(0) | round(0) | int %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(0) %}
            {% if total <= 0 or maxshot <= 0 or rate <= 0 %}
              []
            {% else %}
              {% set full = (total // maxshot) | int %}
              {% set rest = (total % maxshot) | int %}
              {% if rest == 0 %}
                {% set amounts = [maxshot] * full %}
              {% elif full == 0 %}
                {% set amounts = [rest] %}
              {% elif rest >= minrest %}
                {% set amounts = [maxshot] * full + [rest] %}
              {% else %}
                {% set count = full + 1 %}
                {% set base = (total // count) | int %}
                {% set extra = (total - (base * count)) | int %}
                {% set ns = namespace(amounts=[]) %}
                {% for n in range(count) %}
                  {% set ns.amounts = ns.amounts + [base + (1 if n < extra else 0)] %}
                {% endfor %}
                {% set amounts = ns.amounts %}
              {% endif %}
              {% set ns = namespace(seq=[]) %}
              {% for amount in amounts %}
                {% set ns.seq = ns.seq + [(amount / rate) | round(2)] %}
              {% endfor %}
              {{ ns.seq }}
            {% endif %}
          geplante_gesamtmenge_ml: >
            {% set total = states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(0) | round(0) | int %}
            {{ total if total > 0 and maxshot > 0 else 0 }}
          pause_sekunden: >
            {% if states('sensor.plantinator_bewasserung_p4_gussbedarf') == 'notguss' %}
              {{ states('input_number.plantinator_bewasserung_shot_pause_notguss_sekunden') }}
            {% else %}
              {{ states('input_number.plantinator_bewasserung_shot_pause_normal_sekunden') }}
            {% endif %}
          gesamt_pumpenlaufzeit_sekunden: "{{ states('sensor.plantinator_bewasserung_p4_empfehlung_pumpenlaufzeit_sekunden') }}"
          hinweis: "Planung, keine Ausführung. Kleine Restmengen werden gleichmäßig verteilt; das Shot-Maximum bleibt hart."

      - name: Plantinator Bewasserung Shot Plan Gesamtstatus
        unique_id: plantinator_bewasserung_shot_plan_gesamtstatus
        icon: mdi:format-list-checks
        state: >
          {% set maxa = states('input_number.plantinator_bewasserung_shot_max_anzahl') | int(10) %}
          {% set minshot = states('input_number.plantinator_bewasserung_shot_min_ml') | int(0) %}
          {% set maxshot = states('input_number.plantinator_bewasserung_shot_max_ml') | int(0) %}
          {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | int(0) %}
          {% set counts = [
            state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'shot_anzahl') | int(0),
            state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'shot_anzahl') | int(0),
            state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'shot_anzahl') | int(0),
            state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'shot_anzahl') | int(0)
          ] %}
          {% set sequences = [
            state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'shot_sequence_ml'),
            state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'shot_sequence_ml'),
            state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'shot_sequence_ml'),
            state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'shot_sequence_ml')
          ] %}
          {% set ns = namespace(unter_exec_minimum=false) %}
          {% for seq in sequences %}
            {% if seq is iterable and seq is not string %}
              {% for amount in seq %}
                {% if not is_number(amount) or (amount | float(0)) < 25 %}
                  {% set ns.unter_exec_minimum = true %}
                {% endif %}
              {% endfor %}
            {% endif %}
          {% endfor %}
          {% if minshot <= 0 or maxshot <= 0 or minshot > maxshot %}
            parameterfehler_shot_min_max
          {% elif minrest < 0 or minrest > maxshot %}
            parameterfehler_min_rest
          {% elif maxa <= 0 %}
            parameterfehler_max_anzahl
          {% elif ns.unter_exec_minimum %}
            planfehler_shot_unter_25ml
          {% elif counts | max > maxa %}
            zu_viele_shots
          {% elif counts | max > 0 %}
            ok
          {% else %}
            kein_guss
          {% endif %}
        attributes:
          max_anzahl: "{{ states('input_number.plantinator_bewasserung_shot_max_anzahl') }}"
          p1_shot_anzahl: "{{ state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'shot_anzahl') }}"
          p2_shot_anzahl: "{{ state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'shot_anzahl') }}"
          p3_shot_anzahl: "{{ state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'shot_anzahl') }}"
          p4_shot_anzahl: "{{ state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'shot_anzahl') }}"
          shot_min_ml: "{{ states('input_number.plantinator_bewasserung_shot_min_ml') }}"
          shot_max_ml: "{{ states('input_number.plantinator_bewasserung_shot_max_ml') }}"
          shot_min_rest_ml: "{{ states('input_number.plantinator_bewasserung_shot_min_rest_ml') }}"
          hinweis: >
            Statussensor, reine Planung. Kleine Restmengen werden auf alle Shots
            verteilt. Dadurch bleibt Shot-Maximum eine harte Obergrenze.

script:
  plantinator_bewasserung_shot_plan_standardwerte_setzen:
    alias: Plantinator Bewasserung Shot Plan Standardwerte setzen
    icon: mdi:database-import
    mode: single
    sequence:
      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_min_ml
        data:
          value: 50

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_max_ml
        data:
          value: 200

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_min_rest_ml
        data:
          value: 100

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_pause_normal_sekunden
        data:
          value: 180

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_pause_notguss_sekunden
        data:
          value: 90

      - service: input_number.set_value
        target:
          entity_id: input_number.plantinator_bewasserung_shot_max_anzahl
        data:
          value: 10
