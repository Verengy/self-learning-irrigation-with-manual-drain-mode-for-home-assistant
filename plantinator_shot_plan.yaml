              {{ states('input_number.plantinator_bewasserung_shot_pause_normal_sekunden') }}
            {% endif %}
          gesamt_pumpenlaufzeit_sekunden: "{{ states('sensor.plantinator_bewasserung_p1_empfehlung_pumpenlaufzeit_sekunden') }}"
          hinweis: "Planung, keine Ausführung."

