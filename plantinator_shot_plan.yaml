                  {% set ns.seq = ns.seq + [(maxshot / rate) | round(2)] %}
                {% endfor %}
                {% set ns.seq = ns.seq + [(rest / rate) | round(2)] %}
              {% endif %}
              {{ ns.seq }}
            {% endif %}
          geplante_gesamtmenge_ml: >
            {% set ml = states('sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml') | float(0) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 %}
              0
            {% elif ml <= maxshot %}
              {{ ml | round(0) }}
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% if rest == 0 %}
                {{ (full * maxshot) | round(0) }}
              {% elif rest < minrest and full > 0 %}
                {{ ((full - 1) * maxshot + maxshot + rest) | round(0) }}
              {% else %}
                {{ (full * maxshot + rest) | round(0) }}
