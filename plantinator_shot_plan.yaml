############################################################
# PLANTINATOR BEWASSERUNG - SHOT PLAN V3
# Datei: plantinator_bewasserung_shot_plan_v3.yaml
#
# Zweck:
# - Zerlegt die empfohlene Normalguss-Menge in sichere Shots
# - Restshot unter Mindest-Rest wird auf den vorherigen Shot addiert
# - zeigt ml-Sequenz und Sekunden-Sequenz getrennt an
# - Reine Berechnung / Planung
# - Keine Pumpen-/Ventilsteuerung
# - Keine Automatik-Ausführung
#
# Benötigt:
# - plantinator_bewasserung_mapping_v4.yaml
# - plantinator_bewasserung_profil_v3.yaml
# - plantinator_bewasserung_crop_steering.yaml
# - plantinator_bewasserung_lernsensorik_v2.yaml
############################################################

input_number:
  plantinator_bewasserung_shot_min_ml:
    name: Plantinator Bewasserung Shot Minimum ml
    icon: mdi:cup-water
    min: 25
    max: 2000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_max_ml:
    name: Plantinator Bewasserung Shot Maximum ml
    icon: mdi:cup-water
    min: 25
    max: 10000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_min_rest_ml:
    name: Plantinator Bewasserung Shot Minimum Rest ml
    icon: mdi:water-plus
    min: 0
    max: 2000
    step: 25
    mode: box
    unit_of_measurement: "ml"

  plantinator_bewasserung_shot_pause_normal_sekunden:
    name: Plantinator Bewasserung Shot Pause Normal Sekunden
    icon: mdi:timer-sand
    min: 30
    max: 600
    step: 30
    mode: box
    unit_of_measurement: "s"

  plantinator_bewasserung_shot_pause_notguss_sekunden:
    name: Plantinator Bewasserung Shot Pause Notguss Sekunden
    icon: mdi:timer-alert
    min: 30
    max: 600
    step: 30
    mode: box
    unit_of_measurement: "s"

  plantinator_bewasserung_shot_max_anzahl:
    name: Plantinator Bewasserung Shot Max Anzahl
    icon: mdi:counter
    min: 1
    max: 20
    step: 1
    mode: box

template:
  - sensor:
      - name: Plantinator Bewasserung P1 Shot Plan
        unique_id: plantinator_bewasserung_p1_shot_plan
        icon: mdi:format-list-numbered
        state: >
          {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
          {% set bedarf = states('sensor.plantinator_bewasserung_p1_gussbedarf') %}
          {% if ml <= 0 or bedarf not in ['ja', 'notguss'] %}
            kein_guss
          {% elif bedarf == 'notguss' %}
            notguss_geplant
          {% else %}
            normalguss_geplant
          {% endif %}
        attributes:
          pflanze: "Pflanze 1"
          gussbedarf: "{{ states('sensor.plantinator_bewasserung_p1_gussbedarf') }}"
          empfehlung_ml: "{{ states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') }}"
          shot_max_anzahl: "{{ states('input_number.plantinator_bewasserung_shot_max_anzahl') }}"
          crop_shot_ml_effektiv: "{{ states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') }}"
          shot_ml: >
            {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 %}
              0
            {% elif ml <= maxshot %}
              {{ ml | round(0) }}
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% if rest == 0 %}
                {{ maxshot | round(0) }}
              {% elif rest < minrest and full > 0 %}
                {{ (maxshot + rest) | round(0) }}
              {% else %}
                {{ rest | round(0) }}
              {% endif %}
            {% endif %}
          shot_anzahl: >
            {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 %}
              0
            {% elif ml <= maxshot %}
              1
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% if rest == 0 %}
                {{ full }}
              {% elif rest < minrest %}
                {{ full }}
              {% else %}
                {{ full + 1 }}
              {% endif %}
            {% endif %}
          sekunden_pro_shot: >
            {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(50) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 or rate <= 0 %}
              0
            {% elif ml <= maxshot %}
              {{ (ml / rate) | round(2) }}
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% if rest == 0 %}
                {{ (maxshot / rate) | round(2) }}
              {% elif rest < minrest and full > 0 %}
                {{ ((maxshot + rest) / rate) | round(2) }}
              {% else %}
                {{ (rest / rate) | round(2) }}
              {% endif %}
            {% endif %}
          shot_sequence_ml: >
            {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 %}
              []
            {% elif ml <= maxshot %}
              [{{ ml | round(0) }}]
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% set ns = namespace(seq=[]) %}
              {% if rest == 0 %}
                {% for n in range(full) %}
                  {% set ns.seq = ns.seq + [maxshot | round(0) | int] %}
                {% endfor %}
              {% elif rest < minrest and full > 0 %}
                {% for n in range(full - 1) %}
                  {% set ns.seq = ns.seq + [maxshot | round(0) | int] %}
                {% endfor %}
                {% set ns.seq = ns.seq + [(maxshot + rest) | round(0) | int] %}
              {% else %}
                {% for n in range(full) %}
                  {% set ns.seq = ns.seq + [maxshot | round(0) | int] %}
                {% endfor %}
                {% set ns.seq = ns.seq + [rest | round(0) | int] %}
              {% endif %}
              {{ ns.seq }}
            {% endif %}
          shot_sequence_seconds: >
            {% set ml = states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) %}
            {% set rate = states('input_number.plantinator_bewasserung_pumpe_ml_pro_sekunde') | float(50) %}
            {% set maxshot = states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') | float(200) %}
            {% set minrest = states('input_number.plantinator_bewasserung_shot_min_rest_ml') | float(100) %}
            {% if ml <= 0 or maxshot <= 0 or rate <= 0 %}
              []
            {% elif ml <= maxshot %}
              [{{ (ml / rate) | round(2) }}]
            {% else %}
              {% set full = (ml // maxshot) | int %}
              {% set rest = ml - (full * maxshot) %}
              {% set ns = namespace(seq=[]) %}
              {% if rest == 0 %}
                {% for n in range(full) %}
                  {% set ns.seq = ns.seq + [(maxshot / rate) | round(2)] %}
                {% endfor %}
              {% elif rest < minrest and full > 0 %}
                {% for n in range(full - 1) %}
                  {% set ns.seq = ns.seq + [(maxshot / rate) | round(2)] %}
