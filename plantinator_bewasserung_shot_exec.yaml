automation:
  - id: plantinator_bewasserung_shot_exec_p1_button
    alias: Plantinator Bewasserung Shot EXEC - P1 Button
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_p1_shot_plan_start
    action:
      - service: script.plantinator_bewasserung_p1_shot_plan_ausfuehren

  - id: plantinator_bewasserung_shot_exec_p2_button
    alias: Plantinator Bewasserung Shot EXEC - P2 Button
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_p2_shot_plan_start
    action:
      - service: script.plantinator_bewasserung_p2_shot_plan_ausfuehren

  - id: plantinator_bewasserung_shot_exec_p3_button
    alias: Plantinator Bewasserung Shot EXEC - P3 Button
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_p3_shot_plan_start
    action:
      - service: script.plantinator_bewasserung_p3_shot_plan_ausfuehren

  - id: plantinator_bewasserung_shot_exec_p4_button
    alias: Plantinator Bewasserung Shot EXEC - P4 Button
    mode: single
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_p4_shot_plan_start
    action:
      - service: script.plantinator_bewasserung_p4_shot_plan_ausfuehren

  - id: plantinator_bewasserung_shot_exec_stop_button
    alias: Plantinator Bewasserung Shot EXEC - Stop Button
    mode: restart
    trigger:
      - platform: state
        entity_id: input_button.plantinator_bewasserung_shot_plan_stop
    action:
      - service: script.plantinator_bewasserung_shot_exec_sicher_stop

  - id: plantinator_bewasserung_shot_exec_hauptschalter_aus_stop
    alias: Plantinator Bewasserung Shot EXEC - Hauptschalter aus Stop
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.plantinator_bewasserung_aktiv
        to: "off"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.plantinator_bewasserung_shot_exec_stop_anforderung

      - service: script.plantinator_bewasserung_shot_exec_sicher_stop

  - id: plantinator_bewasserung_shot_exec_sperre_an_stop
    alias: Plantinator Bewasserung Shot EXEC - Sperre an Stop
    mode: restart
    trigger:
      - platform: state
        entity_id: input_boolean.plantinator_bewasserung_sperre
        to: "on"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.plantinator_bewasserung_shot_exec_stop_anforderung

      - service: script.plantinator_bewasserung_shot_exec_sicher_stop
