template:
  - sensor:
      - name: Plantinator Bewasserung Plant Stage Roh
        unique_id: plantinator_bewasserung_plant_stage_roh
        icon: mdi:sprout-outline
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_crop_stage_entity') | trim %}
          {% set attr = states('input_text.plantinator_bewasserung_crop_stage_attribut') | trim %}
          {% set leer = ['', 'unknown', 'unavailable', 'none'] %}
          {% if ent in leer %}
            {{ states('input_select.plantinator_bewasserung_crop_stage_manuell') }}
          {% elif not has_value(ent) %}
            unknown
          {% elif attr not in leer %}
            {% set wert = state_attr(ent, attr) %}
            {{ wert if wert is not none else 'unknown' }}
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_crop_stage_entity') | trim }}"
          source_attribute: "{{ states('input_text.plantinator_bewasserung_crop_stage_attribut') | trim }}"
          fallback_entity: input_select.plantinator_bewasserung_crop_stage_manuell

      - name: Plantinator Bewasserung Licht an Roh
        unique_id: plantinator_bewasserung_licht_an_roh
        icon: mdi:weather-sunset-up
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_licht_an_entity') | trim %}
          {% set attr = states('input_text.plantinator_bewasserung_licht_an_attribut') | trim %}
          {% set leer = ['', 'unknown', 'unavailable', 'none'] %}
          {% if ent in leer %}
            {{ states('input_datetime.plantinator_bewasserung_licht_an_manuell') }}
          {% elif not has_value(ent) %}
            unknown
          {% elif attr not in leer %}
            {% set wert = state_attr(ent, attr) %}
            {{ wert if wert is not none else 'unknown' }}
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_licht_an_entity') | trim }}"
          source_attribute: "{{ states('input_text.plantinator_bewasserung_licht_an_attribut') | trim }}"
          fallback_entity: input_datetime.plantinator_bewasserung_licht_an_manuell

      - name: Plantinator Bewasserung Licht aus Roh
        unique_id: plantinator_bewasserung_licht_aus_roh
        icon: mdi:weather-sunset-down
        state: >
          {% set ent = states('input_text.plantinator_bewasserung_licht_aus_entity') | trim %}
          {% set attr = states('input_text.plantinator_bewasserung_licht_aus_attribut') | trim %}
          {% set leer = ['', 'unknown', 'unavailable', 'none'] %}
          {% if ent in leer %}
            {{ states('input_datetime.plantinator_bewasserung_licht_aus_manuell') }}
          {% elif not has_value(ent) %}
            unknown
          {% elif attr not in leer %}
            {% set wert = state_attr(ent, attr) %}
            {{ wert if wert is not none else 'unknown' }}
          {% else %}
            {{ states(ent) }}
          {% endif %}
        attributes:
          source_entity: "{{ states('input_text.plantinator_bewasserung_licht_aus_entity') | trim }}"
          source_attribute: "{{ states('input_text.plantinator_bewasserung_licht_aus_attribut') | trim }}"
          fallback_entity: input_datetime.plantinator_bewasserung_licht_aus_manuell

      - name: Plantinator Bewasserung Crop Stage
        unique_id: plantinator_bewasserung_crop_stage
        icon: mdi:sprout
        state: >
          {% set raw = states('sensor.plantinator_bewasserung_plant_stage_roh') %}
          {% set norm = raw | lower | trim | replace(' ', '_') | replace('-', '_') | replace('/', '_') %}
          {% set intern = [
            'keimung', 'steckling', 'early_veg', 'mid_veg',
            'late_veg', 'early_flower', 'mid_flower', 'late_flower'
          ] %}
          {% set mappings = [
            ['input_text.plantinator_bewasserung_crop_alias_keimung', 'keimung'],
            ['input_text.plantinator_bewasserung_crop_alias_steckling', 'steckling'],
            ['input_text.plantinator_bewasserung_crop_alias_early_veg', 'early_veg'],
            ['input_text.plantinator_bewasserung_crop_alias_mid_veg', 'mid_veg'],
            ['input_text.plantinator_bewasserung_crop_alias_late_veg', 'late_veg'],
            ['input_text.plantinator_bewasserung_crop_alias_early_flower', 'early_flower'],
            ['input_text.plantinator_bewasserung_crop_alias_mid_flower', 'mid_flower'],
            ['input_text.plantinator_bewasserung_crop_alias_late_flower', 'late_flower']
          ] %}
          {% if norm in intern %}
            {{ norm }}
          {% elif raw in ['unknown', 'unavailable', 'none', ''] %}
            unbekannt
          {% else %}
            {% set ns = namespace(treffer=[]) %}
            {% for mapping in mappings %}
              {% for alias in states(mapping[0]).split(',') %}
                {% set alias_norm = alias | lower | trim | replace(' ', '_') | replace('-', '_') | replace('/', '_') %}
                {% if alias_norm != '' and alias_norm == norm and mapping[1] not in ns.treffer %}
                  {% set ns.treffer = ns.treffer + [mapping[1]] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
            {{ ns.treffer[0] if ns.treffer | count == 1 else 'unbekannt' }}
          {% endif %}
        attributes:
          source_raw: "{{ states('sensor.plantinator_bewasserung_plant_stage_roh') }}"
          normalisierung: Kleinschreibung; Leerzeichen, Bindestrich und Schrägstrich werden zu Unterstrichen
          interne_stufen: >
            keimung, steckling, early_veg, mid_veg, late_veg,
            early_flower, mid_flower, late_flower

      - name: Plantinator Bewasserung Crop Quellen Status
        unique_id: plantinator_bewasserung_crop_quellen_status
        icon: mdi:connection
        state: >
          {% set leer = ['', 'unknown', 'unavailable', 'none'] %}
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set on_raw = states('sensor.plantinator_bewasserung_licht_an_roh') %}
          {% set off_raw = states('sensor.plantinator_bewasserung_licht_aus_roh') %}
          {% set on_p = on_raw.split(':') %}
          {% set off_p = off_raw.split(':') %}
          {% set on_ok = on_raw not in leer and on_p | count >= 2
                and is_number(on_p[0]) and is_number(on_p[1])
                and 0 <= (on_p[0] | int(-1)) <= 23
                and 0 <= (on_p[1] | int(-1)) <= 59 %}
          {% set off_ok = off_raw not in leer and off_p | count >= 2
                and is_number(off_p[0]) and is_number(off_p[1])
                and 0 <= (off_p[0] | int(-1)) <= 23
                and 0 <= (off_p[1] | int(-1)) <= 59 %}
          {% set stage_ent = states('input_text.plantinator_bewasserung_crop_stage_entity') | trim %}
          {% set on_ent = states('input_text.plantinator_bewasserung_licht_an_entity') | trim %}
          {% set off_ent = states('input_text.plantinator_bewasserung_licht_aus_entity') | trim %}
          {% if stage == 'unbekannt' %}
            fehler_stage_unbekannt_oder_mehrdeutig
          {% elif not on_ok or not off_ok %}
            fehler_lichtzeit
          {% elif stage_ent in leer and on_ent in leer and off_ent in leer %}
            manuell
          {% else %}
            ok
          {% endif %}
        attributes:
          stage_source: "{{ states('input_text.plantinator_bewasserung_crop_stage_entity') | trim }}"
          stage_raw: "{{ states('sensor.plantinator_bewasserung_plant_stage_roh') }}"
          stage_intern: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          licht_an_source: "{{ states('input_text.plantinator_bewasserung_licht_an_entity') | trim }}"
          licht_an_raw: "{{ states('sensor.plantinator_bewasserung_licht_an_roh') }}"
          licht_aus_source: "{{ states('input_text.plantinator_bewasserung_licht_aus_entity') | trim }}"
          licht_aus_raw: "{{ states('sensor.plantinator_bewasserung_licht_aus_roh') }}"
          hinweis: >
            Bei unbekannter Stage den externen Rohwert genau einer Aliasliste zuordnen.
            Ein Alias darf nicht gleichzeitig in mehreren Listen vorkommen.

      - name: Plantinator Bewasserung Crop Einstellungen Status
        unique_id: plantinator_bewasserung_crop_einstellungen_status
        icon: mdi:tune-check
        state: >
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on') %}
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set start_helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_keimung_minuten',
            'steckling': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_steckling_minuten',
            'early_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_early_veg_minuten',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_mid_veg_minuten',
            'late_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_late_veg_minuten',
            'early_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_early_flower_minuten',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_mid_flower_minuten',
            'late_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_late_flower_minuten'
          } %}
          {% set stop_helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_keimung_minuten',
            'steckling': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_steckling_minuten',
            'early_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_early_veg_minuten',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_mid_veg_minuten',
            'late_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_late_veg_minuten',
            'early_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_early_flower_minuten',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_mid_flower_minuten',
            'late_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_late_flower_minuten'
          } %}
          {% set dryback_helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_dryback_ziel_keimung_prozent',
            'steckling': 'input_number.plantinator_bewasserung_crop_dryback_ziel_steckling_prozent',
            'early_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_early_veg_prozent',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_mid_veg_prozent',
            'late_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_late_veg_prozent',
            'early_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_early_flower_prozent',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_mid_flower_prozent',
            'late_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_late_flower_prozent'
          } %}
          {% set shot_helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_shot_keimung_prozent',
            'steckling': 'input_number.plantinator_bewasserung_crop_shot_steckling_prozent',
            'early_veg': 'input_number.plantinator_bewasserung_crop_shot_early_veg_prozent',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_shot_mid_veg_prozent',
            'late_veg': 'input_number.plantinator_bewasserung_crop_shot_late_veg_prozent',
            'early_flower': 'input_number.plantinator_bewasserung_crop_shot_early_flower_prozent',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_shot_mid_flower_prozent',
            'late_flower': 'input_number.plantinator_bewasserung_crop_shot_late_flower_prozent'
          } %}
          {% if stage in start_helpers %}
            {% set start = states(start_helpers[stage]) | int(-1) %}
            {% set stop = states(stop_helpers[stage]) | int(-1) %}
            {% set dryback = states(dryback_helpers[stage]) | float(-1) %}
            {% set shot = states(shot_helpers[stage]) | float(-1) %}
          {% else %}
            {% set start = -1 %}
            {% set stop = -1 %}
            {% set dryback = -1 %}
            {% set shot = -1 %}
          {% endif %}
          {% set volumen = states('input_number.plantinator_bewasserung_crop_substratvolumen_liter') | float(-1) %}
          {% set ramp = states('input_number.plantinator_bewasserung_crop_ramp_up_dauer_minuten') | int(-1) %}
          {% set ramp_faktor = states('input_number.plantinator_bewasserung_crop_ramp_up_shot_faktor_prozent') | float(-1) %}
          {% set on_raw = states('sensor.plantinator_bewasserung_licht_an_roh') %}
          {% set off_raw = states('sensor.plantinator_bewasserung_licht_aus_roh') %}
          {% set on_p = on_raw.split(':') %}
          {% set off_p = off_raw.split(':') %}
          {% set zeiten_ok = on_p | count >= 2 and off_p | count >= 2
                and is_number(on_p[0]) and is_number(on_p[1])
                and is_number(off_p[0]) and is_number(off_p[1]) %}
          {% if zeiten_ok %}
            {% set on_m = (on_p[0] | int(0)) * 60 + (on_p[1] | int(0)) %}
            {% set off_m = (off_p[0] | int(0)) * 60 + (off_p[1] | int(0)) %}
            {% set lichtdauer = off_m - on_m if off_m > on_m else off_m + 1440 - on_m %}
          {% else %}
            {% set lichtdauer = 0 %}
          {% endif %}
          {% if not individuell %}
            standard
          {% elif stage not in start_helpers %}
            fehler_stage_unbekannt
          {% elif start < 0 or stop < 0 or dryback < 0 or shot <= 0 or volumen <= 0
                or ramp < 0 or ramp_faktor < 25 or ramp_faktor > 100 %}
            fehler_ungueltiger_wert
          {% elif lichtdauer > 0 and (start + stop) >= lichtdauer %}
            fehler_keine_bewaesserungszeit
          {% else %}
            ok
          {% endif %}
        attributes:
          individuelle_parameter: "{{ states('input_boolean.plantinator_bewasserung_crop_individuelle_parameter') }}"
          crop_stage: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          substratprofil: "{{ states('input_select.plantinator_bewasserung_crop_substratprofil') }}"
          hinweis: >
            Bei einem Fehler werden die konservativen Standardwerte verwendet.
            Start plus Stop muss kleiner als die Lichtdauer sein.

      - name: Plantinator Bewasserung Crop Start nach Licht an effektiv
        unique_id: plantinator_bewasserung_crop_start_nach_licht_an_effektiv
        icon: mdi:weather-sunset-up
        unit_of_measurement: "min"
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set defaults = {
            'keimung': 0, 'steckling': 0, 'early_veg': 30, 'mid_veg': 45,
            'late_veg': 90, 'early_flower': 150, 'mid_flower': 90, 'late_flower': 120
          } %}
          {% set helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_keimung_minuten',
            'steckling': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_steckling_minuten',
            'early_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_early_veg_minuten',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_mid_veg_minuten',
            'late_veg': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_late_veg_minuten',
            'early_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_early_flower_minuten',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_mid_flower_minuten',
            'late_flower': 'input_number.plantinator_bewasserung_crop_start_nach_licht_an_late_flower_minuten'
          } %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {{ states(helpers[stage]) | int(defaults.get(stage, 120))
             if individuell and stage in helpers else defaults.get(stage, 120) }}

      - name: Plantinator Bewasserung Crop Stop vor Licht aus effektiv
        unique_id: plantinator_bewasserung_crop_stop_vor_licht_aus_effektiv
        icon: mdi:weather-night
        unit_of_measurement: "min"
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set defaults = {
            'keimung': 120, 'steckling': 120, 'early_veg': 60, 'mid_veg': 90,
            'late_veg': 150, 'early_flower': 210, 'mid_flower': 150, 'late_flower': 180
          } %}
          {% set helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_keimung_minuten',
            'steckling': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_steckling_minuten',
            'early_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_early_veg_minuten',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_mid_veg_minuten',
            'late_veg': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_late_veg_minuten',
            'early_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_early_flower_minuten',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_mid_flower_minuten',
            'late_flower': 'input_number.plantinator_bewasserung_crop_stop_vor_licht_aus_late_flower_minuten'
          } %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {{ states(helpers[stage]) | int(defaults.get(stage, 180))
             if individuell and stage in helpers else defaults.get(stage, 180) }}

      - name: Plantinator Bewasserung Crop Dryback Ziel effektiv
        unique_id: plantinator_bewasserung_crop_dryback_ziel_effektiv
        icon: mdi:water-percent-alert
        unit_of_measurement: "%"
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set defaults = {
            'keimung': 5.0, 'steckling': 5.0, 'early_veg': 8.0, 'mid_veg': 8.0,
            'late_veg': 12.0, 'early_flower': 18.0, 'mid_flower': 12.0, 'late_flower': 18.0
          } %}
          {% set helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_dryback_ziel_keimung_prozent',
            'steckling': 'input_number.plantinator_bewasserung_crop_dryback_ziel_steckling_prozent',
            'early_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_early_veg_prozent',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_mid_veg_prozent',
            'late_veg': 'input_number.plantinator_bewasserung_crop_dryback_ziel_late_veg_prozent',
            'early_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_early_flower_prozent',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_mid_flower_prozent',
            'late_flower': 'input_number.plantinator_bewasserung_crop_dryback_ziel_late_flower_prozent'
          } %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {{ (states(helpers[stage]) | float(defaults.get(stage, 10.0))
             if individuell and stage in helpers else defaults.get(stage, 10.0)) | round(1) }}

      - name: Plantinator Bewasserung Crop Shot Prozent effektiv
        unique_id: plantinator_bewasserung_crop_shot_prozent_effektiv
        icon: mdi:cup-water
        unit_of_measurement: "%"
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set defaults = {
            'keimung': 1.0, 'steckling': 1.5, 'early_veg': 2.0, 'mid_veg': 3.0,
            'late_veg': 3.5, 'early_flower': 5.0, 'mid_flower': 3.5, 'late_flower': 4.0
          } %}
          {% set helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_shot_keimung_prozent',
            'steckling': 'input_number.plantinator_bewasserung_crop_shot_steckling_prozent',
            'early_veg': 'input_number.plantinator_bewasserung_crop_shot_early_veg_prozent',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_shot_mid_veg_prozent',
            'late_veg': 'input_number.plantinator_bewasserung_crop_shot_late_veg_prozent',
