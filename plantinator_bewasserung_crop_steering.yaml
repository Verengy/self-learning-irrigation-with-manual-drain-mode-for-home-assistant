############################################################
# PLANTINATOR BEWASSERUNG - UNIVERSAL CROP STEERING
# Datei: plantinator_bewasserung_crop_steering.yaml
#
# Zweck:
# - Beliebige externe Software über Home-Assistant-Entitäten anbinden
# - Externe Stage-Namen über frei editierbare Aliase normieren
# - Manueller Fallback ohne externe Software
# - Einstellbare Stage-Faktoren, Dryback-Ziele, Zeitfenster und Shot-Größen
# - Reduzierte Shot-Größe während der einstellbaren Ramp-up-Phase
# - Keine Pumpen-/Ventilsteuerung
############################################################

