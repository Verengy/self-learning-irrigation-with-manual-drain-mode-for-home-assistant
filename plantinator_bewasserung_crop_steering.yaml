          } %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {{ (states(helpers[stage]) | float(defaults.get(stage, 3.0))
             if individuell and stage in helpers else defaults.get(stage, 3.0)) | round(1) }}

      - name: Plantinator Bewasserung Crop Ramp Up Shot Faktor effektiv
        unique_id: plantinator_bewasserung_crop_ramp_up_shot_faktor_effektiv
        icon: mdi:water-percent
        unit_of_measurement: "%"
        state: >
          {% set tagesphase = states('sensor.plantinator_bewasserung_crop_tagesphase') %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {% set konfiguriert =
                states('input_number.plantinator_bewasserung_crop_ramp_up_shot_faktor_prozent') | float(60)
                if individuell else 60 %}
          {{ (konfiguriert if tagesphase == 'ramp_up' else 100) | round(0) }}
        attributes:
          tagesphase: "{{ states('sensor.plantinator_bewasserung_crop_tagesphase') }}"
          konfigurierter_ramp_up_faktor_prozent: >
            {{ states('input_number.plantinator_bewasserung_crop_ramp_up_shot_faktor_prozent') }}
          hinweis: >
            Der konfigurierte Faktor wird nur während ramp_up angewendet.
            In allen anderen Tagesphasen beträgt der effektive Faktor 100 Prozent.

      - name: Plantinator Bewasserung Crop Shot ml effektiv
        unique_id: plantinator_bewasserung_crop_shot_ml_effektiv
        icon: mdi:cup-water
        unit_of_measurement: "ml"
        state: >
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {% set volumen = states('input_number.plantinator_bewasserung_crop_substratvolumen_liter') | float(10)
                if individuell else 10 %}
          {% set prozent = states('sensor.plantinator_bewasserung_crop_shot_prozent_effektiv') | float(3) %}
          {% set roh = volumen * 1000 * prozent / 100 %}
          {% set minimum = states('input_number.plantinator_bewasserung_shot_min_ml') | float(25) %}
          {% set maximum = states('input_number.plantinator_bewasserung_shot_max_ml') | float(500) %}
          {% set basis = [[roh, minimum] | max, maximum] | min %}
          {% set ramp_faktor =
                states('sensor.plantinator_bewasserung_crop_ramp_up_shot_faktor_effektiv') | float(100) %}
          {% set nach_ramp = basis * ramp_faktor / 100 %}
          {{ [[nach_ramp, minimum] | max, maximum] | min | round(0) }}
        attributes:
          berechnung: >
            Stage-Shot aus Substratvolumen und Shot-Prozent, begrenzt durch
            Shot-Min/Max und während ramp_up anschließend mit dem Ramp-up-Faktor reduziert
          tagesphase: "{{ states('sensor.plantinator_bewasserung_crop_tagesphase') }}"
          stage_shot_prozent: "{{ states('sensor.plantinator_bewasserung_crop_shot_prozent_effektiv') }}"
          ramp_up_faktor_effektiv_prozent: >
            {{ states('sensor.plantinator_bewasserung_crop_ramp_up_shot_faktor_effektiv') }}
          shot_vor_ramp_up_ml: >
            {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                  and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
            {% set volumen = states('input_number.plantinator_bewasserung_crop_substratvolumen_liter') | float(10)
                  if individuell else 10 %}
            {% set prozent = states('sensor.plantinator_bewasserung_crop_shot_prozent_effektiv') | float(3) %}
            {% set roh = volumen * 1000 * prozent / 100 %}
            {% set minimum = states('input_number.plantinator_bewasserung_shot_min_ml') | float(25) %}
            {% set maximum = states('input_number.plantinator_bewasserung_shot_max_ml') | float(500) %}
            {{ [[roh, minimum] | max, maximum] | min | round(0) }}
          begrenzung_min_ml: "{{ states('input_number.plantinator_bewasserung_shot_min_ml') }}"
          begrenzung_max_ml: "{{ states('input_number.plantinator_bewasserung_shot_max_ml') }}"

      - name: Plantinator Bewasserung Crop Giessschwelle effektiv
        unique_id: plantinator_bewasserung_crop_giessschwelle_effektiv
        icon: mdi:water-percent
        unit_of_measurement: "%"
        state: >
          {% set sicherheitsminimum = states('input_number.plantinator_bewasserung_bodenfeuchte_minimum') | float(32) %}
          {% set ziel = states('input_number.plantinator_bewasserung_bodenfeuchte_ziel') | float(42) %}
          {% set dryback = states('sensor.plantinator_bewasserung_crop_dryback_ziel_effektiv') | float(10) %}
          {{ [sicherheitsminimum, ziel - dryback] | max | round(1) }}
        attributes:
          sicherheitsminimum: "{{ states('input_number.plantinator_bewasserung_bodenfeuchte_minimum') }}"
          feuchte_ziel: "{{ states('input_number.plantinator_bewasserung_bodenfeuchte_ziel') }}"
          dryback_ziel: "{{ states('sensor.plantinator_bewasserung_crop_dryback_ziel_effektiv') }}"
          berechnung: max(Sicherheitsminimum, Feuchteziel minus Dryback-Ziel)

      - name: Plantinator Bewasserung Crop Aktive Rezeptur
        unique_id: plantinator_bewasserung_crop_aktive_rezeptur
        icon: mdi:book-open-variant
        state: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
        attributes:
          substratprofil: "{{ states('input_select.plantinator_bewasserung_crop_substratprofil') }}"
          substratvolumen_liter: >
            {{ states('input_number.plantinator_bewasserung_crop_substratvolumen_liter')
               if is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
               and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok')
               else 10 }}
          parameterquelle: >
            {{ 'individuell'
               if is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
               and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok')
               else 'standard' }}
          crop_faktor: "{{ states('sensor.plantinator_bewasserung_crop_steering_faktor') }}"
          start_nach_licht_an_minuten: "{{ states('sensor.plantinator_bewasserung_crop_start_nach_licht_an_effektiv') }}"
          stop_vor_licht_aus_minuten: "{{ states('sensor.plantinator_bewasserung_crop_stop_vor_licht_aus_effektiv') }}"
          dryback_ziel_prozentpunkte: "{{ states('sensor.plantinator_bewasserung_crop_dryback_ziel_effektiv') }}"
          shot_prozent_substratvolumen: "{{ states('sensor.plantinator_bewasserung_crop_shot_prozent_effektiv') }}"
          ramp_up_dauer_minuten: >
            {{ states('input_number.plantinator_bewasserung_crop_ramp_up_dauer_minuten') }}
          ramp_up_shot_faktor_effektiv_prozent: >
            {{ states('sensor.plantinator_bewasserung_crop_ramp_up_shot_faktor_effektiv') }}
          shot_ml: "{{ states('sensor.plantinator_bewasserung_crop_shot_ml_effektiv') }}"
          giessschwelle_prozent: "{{ states('sensor.plantinator_bewasserung_crop_giessschwelle_effektiv') }}"

      - name: Plantinator Bewasserung Crop Stage Gruppe
        unique_id: plantinator_bewasserung_crop_stage_gruppe
        icon: mdi:leaf-circle
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% if stage in ['keimung', 'steckling'] %}
            propagation
          {% elif stage in ['early_veg', 'mid_veg', 'late_veg'] %}
            vegetativ
          {% elif stage in ['early_flower', 'mid_flower', 'late_flower'] %}
            generativ
          {% else %}
            unbekannt
          {% endif %}
        attributes:
          crop_stage: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          source_raw: "{{ states('sensor.plantinator_bewasserung_plant_stage_roh') }}"

      - name: Plantinator Bewasserung Crop Steering Modus
        unique_id: plantinator_bewasserung_crop_steering_modus
        icon: mdi:leaf
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set modi = {
            'keimung': 'keimung_schonend',
            'steckling': 'steckling_schonend',
            'early_veg': 'vegetativ_schonend',
            'mid_veg': 'vegetativ_aktiv',
            'late_veg': 'vegetativ_spaet',
            'early_flower': 'generativ_mild',
            'mid_flower': 'generativ',
            'late_flower': 'generativ_spaet'
          } %}
          {{ modi.get(stage, 'neutral_sicher') }}
        attributes:
          crop_stage: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          crop_stage_gruppe: "{{ states('sensor.plantinator_bewasserung_crop_stage_gruppe') }}"
          source_raw: "{{ states('sensor.plantinator_bewasserung_plant_stage_roh') }}"
          bedeutung: >
            keimung_schonend = nur sehr kleine Wassergaben, keine Drain-Automatik.
            steckling_schonend = kleine Wassergaben, keine starken Drybacks.
            vegetativ_schonend = langsam aktiver werden, Zielbereich vorsichtig anfahren.
            vegetativ_aktiv = Zielbereich aktiver halten.
            vegetativ_spaet = Zielbereich halten, aber etwas mehr Dryback zulassen.
            generativ_mild = mehr Dryback zulassen, keine Zieljagd.
            generativ = deutlicher Dryback, abends vorsichtig.
            generativ_spaet = Overnight-Dryback streng, normale Güsse kleiner.
            neutral_sicher = Fallback bei unbekannter Stage.

      - name: Plantinator Bewasserung Crop Steering Faktor
        unique_id: plantinator_bewasserung_crop_steering_faktor
        icon: mdi:tune-variant
        unit_of_measurement: "x"
        state: >
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set defaults = {
            'keimung': 0.45,
            'steckling': 0.70,
            'early_veg': 0.90,
            'mid_veg': 1.00,
            'late_veg': 1.00,
            'early_flower': 1.00,
            'mid_flower': 1.00,
            'late_flower': 0.90
          } %}
          {% set helpers = {
            'keimung': 'input_number.plantinator_bewasserung_crop_faktor_keimung',
            'steckling': 'input_number.plantinator_bewasserung_crop_faktor_steckling',
            'early_veg': 'input_number.plantinator_bewasserung_crop_faktor_early_veg',
            'mid_veg': 'input_number.plantinator_bewasserung_crop_faktor_mid_veg',
            'late_veg': 'input_number.plantinator_bewasserung_crop_faktor_late_veg',
            'early_flower': 'input_number.plantinator_bewasserung_crop_faktor_early_flower',
            'mid_flower': 'input_number.plantinator_bewasserung_crop_faktor_mid_flower',
            'late_flower': 'input_number.plantinator_bewasserung_crop_faktor_late_flower'
          } %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {% if individuell and stage in helpers %}
            {{ states(helpers[stage]) | float(defaults.get(stage, 1.00)) | round(2) }}
          {% else %}
            {{ defaults.get(stage, 1.00) | round(2) }}
          {% endif %}
        attributes:
          modus: "{{ states('sensor.plantinator_bewasserung_crop_steering_modus') }}"
          crop_stage: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          parameterquelle: >
            {{ 'individuell'
               if is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
               and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok')
               else 'standard' }}
          hinweis: >
            Der Faktor darf Max-Feuchte, Max-Gussmenge, Max-Tagesmenge,
            Wasserstand, Sensorfehler und Sicherheitslogik niemals überschreiben.

      - name: Plantinator Bewasserung Crop Steering Strategie
        unique_id: plantinator_bewasserung_crop_steering_strategie
        icon: mdi:strategy
        state: >
          {% set modus = states('sensor.plantinator_bewasserung_crop_steering_modus') %}
          {% set strategien = {
            'keimung_schonend': 'minimal_wasser',
            'steckling_schonend': 'sehr_vorsichtig',
            'vegetativ_schonend': 'vorsichtig_aufbauen',
            'vegetativ_aktiv': 'zielbereich_halten',
            'vegetativ_spaet': 'zielbereich_mit_dryback',
            'generativ_mild': 'dryback_mild',
            'generativ': 'dryback_deutlich',
            'generativ_spaet': 'dryback_streng'
          } %}
          {{ strategien.get(modus, 'sicherheitsmodus') }}
        attributes:
          empfehlung: >
            {% set modus = states('sensor.plantinator_bewasserung_crop_steering_modus') %}
            {% if modus == 'keimung_schonend' %}
              Nur minimal feucht halten. Keine aggressiven Shots, keine Mess-Drain-Automatik.
            {% elif modus == 'steckling_schonend' %}
              Kleine Einzelshots, keine großen Wassermengen, keine starken Drybacks.
            {% elif modus == 'vegetativ_schonend' %}
              Substrat langsam in den Arbeitsbereich bringen. Vorsichtige Ramp-Up-Shots.
            {% elif modus == 'vegetativ_aktiv' %}
              Bodenfeuchte eher Richtung Zielwert halten. Dryback kleiner halten.
            {% elif modus == 'vegetativ_spaet' %}
              Zielbereich halten, aber bereits etwas mehr Dryback zulassen.
            {% elif modus == 'generativ_mild' %}
              Zielwert nicht erzwingen. Leichten Dryback fördern.
            {% elif modus == 'generativ' %}
              Deutlicheren Dryback zulassen. Späte Bewässerung reduzieren.
            {% elif modus == 'generativ_spaet' %}
              Overnight-Dryback streng beachten. Normale Güsse kleiner und später vorsichtiger.
            {% else %}
              Fallback: konservativ gießen und keine aggressiven Crop-Steering-Eingriffe.
            {% endif %}
          crop_stage: "{{ states('sensor.plantinator_bewasserung_crop_stage') }}"
          crop_stage_gruppe: "{{ states('sensor.plantinator_bewasserung_crop_stage_gruppe') }}"
          faktor: "{{ states('sensor.plantinator_bewasserung_crop_steering_faktor') }}"

      - name: Plantinator Bewasserung Lichtstatus
        unique_id: plantinator_bewasserung_lichtstatus
        icon: mdi:white-balance-sunny
        state: >
          {% set on_raw = states('sensor.plantinator_bewasserung_licht_an_roh') %}
          {% set off_raw = states('sensor.plantinator_bewasserung_licht_aus_roh') %}
          {% set leer = ['unknown', 'unavailable', 'none', ''] %}
          {% set on_p = on_raw.split(':') %}
          {% set off_p = off_raw.split(':') %}
          {% set gueltig = on_raw not in leer and off_raw not in leer
                and on_p | count >= 2 and off_p | count >= 2
                and is_number(on_p[0]) and is_number(on_p[1])
                and is_number(off_p[0]) and is_number(off_p[1]) %}
          {% if not gueltig %}
            unbekannt
          {% else %}
            {% set on_m = (on_p[0] | int(0)) * 60 + (on_p[1] | int(0)) %}
            {% set off_m = (off_p[0] | int(0)) * 60 + (off_p[1] | int(0)) %}
            {% set now_m = now().hour * 60 + now().minute %}
            {% if on_m < off_m %}
              {{ 'tag' if now_m >= on_m and now_m < off_m else 'nacht' }}
            {% elif on_m > off_m %}
              {{ 'tag' if now_m >= on_m or now_m < off_m else 'nacht' }}
            {% else %}
              unbekannt
            {% endif %}
          {% endif %}
        attributes:
          light_on: "{{ states('sensor.plantinator_bewasserung_licht_an_roh') }}"
          light_off: "{{ states('sensor.plantinator_bewasserung_licht_aus_roh') }}"

      - name: Plantinator Bewasserung Minuten seit Licht an
        unique_id: plantinator_bewasserung_minuten_seit_licht_an
        icon: mdi:timer-play-outline
        unit_of_measurement: "min"
        state: >
          {% set licht = states('sensor.plantinator_bewasserung_lichtstatus') %}
          {% set on_raw = states('sensor.plantinator_bewasserung_licht_an_roh') %}
          {% if licht != 'tag' or on_raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set on_p = on_raw.split(':') %}
            {% set on_m = (on_p[0] | int(0)) * 60 + (on_p[1] | int(0)) %}
            {% set now_m = now().hour * 60 + now().minute %}
            {{ now_m - on_m if now_m >= on_m else now_m + 1440 - on_m }}
          {% endif %}

      - name: Plantinator Bewasserung Minuten bis Licht aus
        unique_id: plantinator_bewasserung_minuten_bis_licht_aus
        icon: mdi:timer-stop-outline
        unit_of_measurement: "min"
        state: >
          {% set licht = states('sensor.plantinator_bewasserung_lichtstatus') %}
          {% set off_raw = states('sensor.plantinator_bewasserung_licht_aus_roh') %}
          {% if licht != 'tag' or off_raw in ['unknown', 'unavailable', 'none', ''] %}
            unknown
          {% else %}
            {% set off_p = off_raw.split(':') %}
            {% set off_m = (off_p[0] | int(0)) * 60 + (off_p[1] | int(0)) %}
            {% set now_m = now().hour * 60 + now().minute %}
            {{ off_m - now_m if off_m > now_m else off_m + 1440 - now_m }}
          {% endif %}

      - name: Plantinator Bewasserung Crop Tagesphase
        unique_id: plantinator_bewasserung_crop_tagesphase
        icon: mdi:sun-clock
        state: >
          {% set licht = states('sensor.plantinator_bewasserung_lichtstatus') %}
          {% set seit = states('sensor.plantinator_bewasserung_minuten_seit_licht_an') | int(-1) %}
          {% set bis = states('sensor.plantinator_bewasserung_minuten_bis_licht_aus') | int(-1) %}
          {% set start = states('sensor.plantinator_bewasserung_crop_start_nach_licht_an_effektiv') | int(120) %}
          {% set stop = states('sensor.plantinator_bewasserung_crop_stop_vor_licht_aus_effektiv') | int(180) %}
          {% set individuell = is_state('input_boolean.plantinator_bewasserung_crop_individuelle_parameter', 'on')
                and is_state('sensor.plantinator_bewasserung_crop_einstellungen_status', 'ok') %}
          {% set ramp_dauer = states('input_number.plantinator_bewasserung_crop_ramp_up_dauer_minuten') | int(120)
                if individuell else 120 %}
          {% set ramp_ende = start + ramp_dauer %}
          {% if licht == 'nacht' %}
            nacht
          {% elif licht != 'tag' or seit < 0 or bis < 0 %}
            unbekannt
          {% elif seit < start %}
            morgen_dryback
          {% elif bis <= stop %}
            overnight_dryback
          {% elif seit < ramp_ende %}
            ramp_up
          {% else %}
            maintenance
          {% endif %}
        attributes:
          lichtstatus: "{{ states('sensor.plantinator_bewasserung_lichtstatus') }}"
          minuten_seit_licht_an: "{{ states('sensor.plantinator_bewasserung_minuten_seit_licht_an') }}"
          minuten_bis_licht_aus: "{{ states('sensor.plantinator_bewasserung_minuten_bis_licht_aus') }}"
          start_nach_licht_an_minuten: "{{ states('sensor.plantinator_bewasserung_crop_start_nach_licht_an_effektiv') }}"
          stop_vor_licht_aus_minuten: "{{ states('sensor.plantinator_bewasserung_crop_stop_vor_licht_aus_effektiv') }}"
          steuerung: >
            morgen_dryback = nur Notguss.
            ramp_up = kleine adaptive Shots Richtung Zielbereich.
            maintenance = Bedarfskorrektur.
            overnight_dryback = normal nicht mehr gießen.
            nacht = nur Notguss.

      - name: Plantinator Bewasserung Crop Normalguss Erlaubnis
        unique_id: plantinator_bewasserung_crop_normalguss_erlaubnis
        icon: mdi:water-sync
        state: >
          {% set modus = states('sensor.plantinator_bewasserung_crop_steering_modus') %}
          {% set tagesphase = states('sensor.plantinator_bewasserung_crop_tagesphase') %}
          {% set stage = states('sensor.plantinator_bewasserung_crop_stage') %}
          {% set quellen = states('sensor.plantinator_bewasserung_crop_quellen_status') %}
          {% set einstellungen = states('sensor.plantinator_bewasserung_crop_einstellungen_status') %}
          {% if quellen.startswith('fehler_') or einstellungen.startswith('fehler_') %}
            nur_manuell
          {% elif stage == 'unbekannt' or modus == 'neutral_sicher' %}
            nur_manuell
          {% elif modus == 'keimung_schonend' %}
            nur_manuell
          {% elif tagesphase == 'nacht' %}
            nur_notguss
          {% elif tagesphase == 'overnight_dryback' %}
            stark_begrenzt
          {% elif tagesphase == 'morgen_dryback' %}
            notguss_oder_stark_trocken
          {% elif tagesphase in ['ramp_up', 'maintenance'] %}
            erlaubt
          {% else %}
            sicherheitsmodus
          {% endif %}
        attributes:
          crop_quellen_status: "{{ states('sensor.plantinator_bewasserung_crop_quellen_status') }}"
          crop_einstellungen_status: "{{ states('sensor.plantinator_bewasserung_crop_einstellungen_status') }}"
          crop_steering_modus: "{{ states('sensor.plantinator_bewasserung_crop_steering_modus') }}"
          crop_tagesphase: "{{ states('sensor.plantinator_bewasserung_crop_tagesphase') }}"
          hinweis: >
            Diese Erlaubnis ist nur ein Strategie-Signal.
            EXEC und Controller prüfen zusätzlich Wasserstand, Sensorwerte,
            Tageslimit, Max-Gussmenge und Hauptschalter.

script:
