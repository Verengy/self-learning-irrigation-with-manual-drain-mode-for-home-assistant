              is applied after the learned value and crop factor. Maximum
              environmental correction, maximum irrigation, and the daily
              limit remain hard constraints.
          - type: entities
            title: Factor / Influence
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_umwelt_faktor_status
                name: Status
