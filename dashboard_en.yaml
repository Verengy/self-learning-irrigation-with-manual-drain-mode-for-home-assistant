              - entity: sensor.plantinator_bewasserung_zulauf_sensorstatus
                name: Input-Water Sensor Status
              - entity: sensor.plantinator_bewasserung_klima_faktor_roh
                name: Raw Climate Factor
              - entity: input_number.plantinator_bewasserung_klima_einfluss_prozent
