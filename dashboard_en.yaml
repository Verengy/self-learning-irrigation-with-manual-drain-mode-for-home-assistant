title: Universal Self-Learning Irrigation for Home Assistant
views:
  - title: Overview
    path: plantinator-bewasserung
    icon: mdi:water-pump
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: System Permissions
            heading_style: title
            icon: mdi:shield-check
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Main Switch
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automation
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: System Lock
            color: red
          - type: tile
            entity: input_boolean.plantinator_bewasserung_exec_laeuft
            name: EXEC Running
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_laeuft
            name: Shot EXEC Running
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_reserviert
            name: Shot EXEC Reserved
            color: yellow
          - type: tile
            entity: input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft
            name: Circulation Running
            color: blue
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Acknowledge Alarm
            color: green
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state: bereit
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Acknowledge Alarm
            color: red
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state:
                  - verriegelt
                  - fehler_nicht_quittierbar
          - type: tile
            entity: script.plantinator_bewasserung_sicher_stop
            name: EMERGENCY STOP
            color: red
            tap_action:
              action: call-service
              service: script.plantinator_bewasserung_sicher_stop
          - type: entities
            title: Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_mapping_status
                name: Mapping Status
              - entity: sensor.plantinator_bewasserung_aktor_sicherheitsstatus
                name: Actuator Safety Status
              - entity: sensor.plantinator_bewasserung_profil_status
                name: Profile Status
              - entity: sensor.plantinator_bewasserung_exec_freigabe
                name: EXEC Permission
              - entity: sensor.plantinator_bewasserung_shot_exec_freigabe
                name: Shot EXEC Permission
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Automatic Basic Permission
              - entity: sensor.plantinator_bewasserung_tank_umwalzung_freigabe
                name: Circulation Permission
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Total Irrigation Demand
              - entity: sensor.plantinator_bewasserung_mess_drain_status
                name: Measuring-Drain Status
              - entity: sensor.plantinator_bewasserung_alarm_status
                name: Alarm Status
              - entity: sensor.plantinator_bewasserung_kritischer_systemstatus
                name: Critical System Status
              - entity: sensor.plantinator_bewasserung_sensoralter_status
                name: Sensor-Age Status
      - type: grid
        cards:
          - type: heading
            heading: Automatic Short Status
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: timer.plantinator_bewasserung_shot_exec_wartezeit
            name: Shot-EXEC Wait Time
            color: orange
          - type: markdown
            title: System Status in Plain English
            content: |
              {% set auto = states('sensor.plantinator_bewasserung_auto_status') %}
              {% set grund = states('sensor.plantinator_bewasserung_auto_grundfreigabe') %}
              {% set crop = states('sensor.plantinator_bewasserung_auto_crop_freigabe') %}
              {% set nextp = states('sensor.plantinator_bewasserung_auto_naechste_pflanze') %}
              {% set exec = states('sensor.plantinator_bewasserung_exec_status') %}
              {% set shot = states('sensor.plantinator_bewasserung_shot_exec_status') %}
              {% set circulation = states('input_text.plantinator_bewasserung_tank_umwalzung_status') %}
              {% set last = states('input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status') %}
              {% set auto_map = {
                'bereit': 'Ready',
                'kein_guss_faellig': 'No irrigation required',
                'warte_shot_exec_laeuft': 'Waiting for the active shot sequence',
                'sicher_stop': 'Safely stopped',
                'sicher_stop_durch_freigabe': 'Safely stopped because permission is missing'
              } %}
              {% set permission_map = {
                'frei': 'Permitted',
                'auto_controller_aus': 'Automatic controller is switched off',
                'hauptschalter_aus': 'Main switch is switched off',
                'automatik_aus': 'Automation is switched off',
                'sperre_aktiv': 'System is locked',
                'shot_exec_nicht_frei': 'Shot sequence is still busy',
                'alarm_verriegelt': 'Alarm is latched'
              } %}
              {% set crop_map = {
                'normal_erlaubt': 'Normal irrigation permitted',
                'nur_notguss': 'Emergency irrigation only',
                'nur_notguss_erlaubt': 'Emergency irrigation only',
                'sicherheitsmodus': 'Safety mode – normal irrigation disabled',
                'crop_blockiert': 'Blocked by crop steering'
              } %}
              {% set auto_text = ('Starting irrigation for plant ' ~ auto.split('_p')[1].split('_')[0])
                if auto.startswith('starte_p') else
                ('Blocked: ' ~ auto.replace('blockiert_', '').replace('_', ' '))
                if auto.startswith('blockiert_') else
                auto_map.get(auto, auto.replace('_', ' ') | capitalize) %}
              {% set exec_text = 'Ready' if exec == 'bereit' else
                ('Irrigation for plant ' ~ exec.split('_p')[1].split('_')[0] ~ ' completed')
                if exec.startswith('normalguss_fertig_p') else
                ('Shot for plant ' ~ exec.split('_p')[1].split('_')[0] ~ ' completed')
                if exec.startswith('shot_plan_fertig_p') else
                ('Preparing irrigation for plant ' ~ exec.split('_p')[1].split('_')[0])
                if exec.startswith('normalguss_angefordert_p') else
                ('Preparing shot for plant ' ~ exec.split('_p')[1].split('_')[0])
                if exec.startswith('shot_plan_angefordert_p') else
                'Safely stopped' if exec in ['sicher_stop', 'startup_sicher_stop'] else
                ('Hardware fault: ' ~ exec.replace('hardwarefehler_', '').replace('_', ' '))
                if exec.startswith('hardwarefehler_') else
                ('Operation blocked: ' ~ exec.replace('blockiert_', '').replace('_', ' '))
                if exec.startswith('blockiert_') else exec.replace('_', ' ') | capitalize %}
              {% set shot_text = 'Ready' if shot == 'bereit' else
                'Shot sequence completed' if shot.startswith('fertig_p') else
                'Waiting for moisture evaluation' if 'warte_feedback' in shot else
                'Shot sequence running' if shot.startswith('p') else
                shot.replace('_', ' ') | capitalize %}
              {% set circulation_text = 'Ready' if circulation == 'bereit' else
                'Not required before irrigation' if circulation == 'pre_guss_nicht_noetig' else
                'Cyclic circulation completed' if circulation.startswith('zyklisch_fertig') else
                circulation.replace('_', ' ') | capitalize %}

              | Area | Meaning |
              |---|---|
              | Automation | **{{ auto_text }}**<br><small>`{{ auto }}`</small> |
              | Basic permission | **{{ permission_map.get(grund, grund.replace('_', ' ') | capitalize) }}**<br><small>`{{ grund }}`</small> |
              | Crop steering | **{{ crop_map.get(crop, crop.replace('_', ' ') | capitalize) }}**<br><small>`{{ crop }}`</small> |
              | Next plant | **{{ 'None' if nextp == 'keine' else 'Plant ' ~ nextp }}** |
              | Irrigation | **{{ exec_text }}**<br><small>`{{ exec }}`</small> |
              | Shot sequence | **{{ shot_text }}**<br><small>`{{ shot }}`</small> |
              | Reservoir circulation | **{{ circulation_text }}**<br><small>`{{ circulation }}`</small> |
              | Daily counter | **{{ 'No irrigation recorded yet' if last in ['keiner', 'unknown', 'unavailable'] else 'Last irrigation was recorded' }}**<br><small>`{{ last }}`</small> |
          - type: grid
            title: Plant Overview
            columns: 2
            square: false
            cards:
              - type: markdown
                content: |
                  {% set name = states('input_text.plantinator_bewasserung_p1_name') %}
                  {% set moisture = states('sensor.plantinator_bewasserung_p1_bodenfeuchte_wert') %}
                  {% set state = states('sensor.plantinator_bewasserung_p1_feuchtezustand') %}
                  {% set demand = states('sensor.plantinator_bewasserung_p1_gussbedarf') %}
                  {% set automatic = states('sensor.plantinator_bewasserung_auto_p1_freigabe') %}
                  {% set state_map = {'trocken': 'Dry', 'unter_ziel': 'Below target', 'zielbereich': 'Within target', 'zu_feucht': 'Too wet', 'sensorfehler': 'Sensor fault'} %}
                  {% set automatic_map = {'frei': 'Permitted', 'kein_bedarf': 'No demand', 'pause': 'Minimum pause', 'feedback_ausstehend': 'Waiting for evaluation', 'crop_blockiert': 'Crop steering blocked', 'nur_notguss_erlaubt': 'Emergency only', 'tageslimit': 'Daily limit reached', 'inaktiv': 'Inactive', 'sensor_nicht_aktuell': 'Sensor value too old'} %}
                  {% set symbol = '🔴' if state in ['trocken', 'sensorfehler'] else '🟠' if state == 'unter_ziel' else '🟢' if state == 'zielbereich' else '🔵' if state == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set total = state_attr('sensor.plantinator_bewasserung_p1_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P1 · {{ 'Plant 1' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (moisture | float(0) | round(1)) if is_number(moisture) else '–' }} %** · {{ state_map.get(state, state.replace('_', ' ') | capitalize) }}

                  💧 **Demand:** {{ 'Yes' if demand == 'ja' else 'No' if demand == 'nein' else demand }}<br>
                  🤖 **Automatic:** {{ automatic_map.get(automatic, automatic.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Recommended:** {{ states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Today:** {{ states('input_number.plantinator_bewasserung_p1_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ total }} ml
              - type: markdown
                content: |
                  {% set name = states('input_text.plantinator_bewasserung_p2_name') %}
                  {% set moisture = states('sensor.plantinator_bewasserung_p2_bodenfeuchte_wert') %}
                  {% set state = states('sensor.plantinator_bewasserung_p2_feuchtezustand') %}
                  {% set demand = states('sensor.plantinator_bewasserung_p2_gussbedarf') %}
                  {% set automatic = states('sensor.plantinator_bewasserung_auto_p2_freigabe') %}
                  {% set state_map = {'trocken': 'Dry', 'unter_ziel': 'Below target', 'zielbereich': 'Within target', 'zu_feucht': 'Too wet', 'sensorfehler': 'Sensor fault'} %}
                  {% set automatic_map = {'frei': 'Permitted', 'kein_bedarf': 'No demand', 'pause': 'Minimum pause', 'feedback_ausstehend': 'Waiting for evaluation', 'crop_blockiert': 'Crop steering blocked', 'nur_notguss_erlaubt': 'Emergency only', 'tageslimit': 'Daily limit reached', 'inaktiv': 'Inactive', 'sensor_nicht_aktuell': 'Sensor value too old'} %}
                  {% set symbol = '🔴' if state in ['trocken', 'sensorfehler'] else '🟠' if state == 'unter_ziel' else '🟢' if state == 'zielbereich' else '🔵' if state == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set total = state_attr('sensor.plantinator_bewasserung_p2_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P2 · {{ 'Plant 2' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (moisture | float(0) | round(1)) if is_number(moisture) else '–' }} %** · {{ state_map.get(state, state.replace('_', ' ') | capitalize) }}

                  💧 **Demand:** {{ 'Yes' if demand == 'ja' else 'No' if demand == 'nein' else demand }}<br>
                  🤖 **Automatic:** {{ automatic_map.get(automatic, automatic.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Recommended:** {{ states('sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Today:** {{ states('input_number.plantinator_bewasserung_p2_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ total }} ml
              - type: markdown
                content: |
                  {% set name = states('input_text.plantinator_bewasserung_p3_name') %}
                  {% set moisture = states('sensor.plantinator_bewasserung_p3_bodenfeuchte_wert') %}
                  {% set state = states('sensor.plantinator_bewasserung_p3_feuchtezustand') %}
                  {% set demand = states('sensor.plantinator_bewasserung_p3_gussbedarf') %}
                  {% set automatic = states('sensor.plantinator_bewasserung_auto_p3_freigabe') %}
                  {% set state_map = {'trocken': 'Dry', 'unter_ziel': 'Below target', 'zielbereich': 'Within target', 'zu_feucht': 'Too wet', 'sensorfehler': 'Sensor fault'} %}
                  {% set automatic_map = {'frei': 'Permitted', 'kein_bedarf': 'No demand', 'pause': 'Minimum pause', 'feedback_ausstehend': 'Waiting for evaluation', 'crop_blockiert': 'Crop steering blocked', 'nur_notguss_erlaubt': 'Emergency only', 'tageslimit': 'Daily limit reached', 'inaktiv': 'Inactive', 'sensor_nicht_aktuell': 'Sensor value too old'} %}
                  {% set symbol = '🔴' if state in ['trocken', 'sensorfehler'] else '🟠' if state == 'unter_ziel' else '🟢' if state == 'zielbereich' else '🔵' if state == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set total = state_attr('sensor.plantinator_bewasserung_p3_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P3 · {{ 'Plant 3' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (moisture | float(0) | round(1)) if is_number(moisture) else '–' }} %** · {{ state_map.get(state, state.replace('_', ' ') | capitalize) }}

                  💧 **Demand:** {{ 'Yes' if demand == 'ja' else 'No' if demand == 'nein' else demand }}<br>
                  🤖 **Automatic:** {{ automatic_map.get(automatic, automatic.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Recommended:** {{ states('sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Today:** {{ states('input_number.plantinator_bewasserung_p3_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ total }} ml
              - type: markdown
                content: |
                  {% set name = states('input_text.plantinator_bewasserung_p4_name') %}
                  {% set moisture = states('sensor.plantinator_bewasserung_p4_bodenfeuchte_wert') %}
                  {% set state = states('sensor.plantinator_bewasserung_p4_feuchtezustand') %}
                  {% set demand = states('sensor.plantinator_bewasserung_p4_gussbedarf') %}
                  {% set automatic = states('sensor.plantinator_bewasserung_auto_p4_freigabe') %}
                  {% set state_map = {'trocken': 'Dry', 'unter_ziel': 'Below target', 'zielbereich': 'Within target', 'zu_feucht': 'Too wet', 'sensorfehler': 'Sensor fault'} %}
                  {% set automatic_map = {'frei': 'Permitted', 'kein_bedarf': 'No demand', 'pause': 'Minimum pause', 'feedback_ausstehend': 'Waiting for evaluation', 'crop_blockiert': 'Crop steering blocked', 'nur_notguss_erlaubt': 'Emergency only', 'tageslimit': 'Daily limit reached', 'inaktiv': 'Inactive', 'sensor_nicht_aktuell': 'Sensor value too old'} %}
                  {% set symbol = '🔴' if state in ['trocken', 'sensorfehler'] else '🟠' if state == 'unter_ziel' else '🟢' if state == 'zielbereich' else '🔵' if state == 'zu_feucht' else '⚪' %}
                  {% set shots = state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'shot_anzahl') | int(0) %}
                  {% set total = state_attr('sensor.plantinator_bewasserung_p4_shot_plan', 'geplante_gesamtmenge_ml') | float(0) | round(0) | int %}
                  ### {{ symbol }} P4 · {{ 'Plant 4' if name in ['unknown', 'unavailable', ''] else name }}

                  **{{ (moisture | float(0) | round(1)) if is_number(moisture) else '–' }} %** · {{ state_map.get(state, state.replace('_', ' ') | capitalize) }}

                  💧 **Demand:** {{ 'Yes' if demand == 'ja' else 'No' if demand == 'nein' else demand }}<br>
                  🤖 **Automatic:** {{ automatic_map.get(automatic, automatic.replace('_', ' ') | capitalize) }}<br>
                  🎯 **Recommended:** {{ states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml') | float(0) | round(0) | int }} ml<br>
                  📅 **Today:** {{ states('input_number.plantinator_bewasserung_p4_heute_ml') | float(0) | round(0) | int }} ml · **Shots:** {{ shots }} / {{ total }} ml
      - type: grid
        cards:
          - type: heading
            heading: Histories
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Substrate-Moisture History
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_p1_bodenfeuchte_wert
                name: P1
              - entity: sensor.plantinator_bewasserung_p2_bodenfeuchte_wert
                name: P2
              - entity: sensor.plantinator_bewasserung_p3_bodenfeuchte_wert
                name: P3
              - entity: sensor.plantinator_bewasserung_p4_bodenfeuchte_wert
                name: P4
          - type: history-graph
            title: Irrigation Demand / Automatic
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Total Demand
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Next Plant
              - entity: sensor.plantinator_bewasserung_shot_exec_status
                name: Shot EXEC
  - title: Automation
    path: plantinator-bewasserung-automatik
    icon: mdi:robot
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Automation Permissions
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automation
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Main Switch
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: System Lock
            color: red
          - type: entities
            title: Automatic Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_status
                name: Automatic Status
              - entity: input_text.plantinator_bewasserung_auto_status
                name: Auto Status Input
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Basic Permission
              - entity: sensor.plantinator_bewasserung_auto_crop_freigabe
                name: Crop Permission
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Next Plant
              - entity: input_text.plantinator_bewasserung_auto_letzte_pflanze
                name: Last Plant
              - entity: >-
                  input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status
                name: Last Counted Status
              - entity: input_datetime.plantinator_bewasserung_auto_letzter_check
                name: Last Auto Check
              - entity: script.plantinator_bewasserung_auto_check
                name: Run Auto Check Now
              - entity: script.plantinator_bewasserung_auto_standardwerte_setzen
                name: Set Automation Defaults
      - type: grid
        cards:
          - type: heading
            heading: Plant Permissions
            heading_style: title
            icon: mdi:sprout
          - type: entities
            title: P1 / P2
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p1_freigabe
                name: P1 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p1_gussbedarf
                name: P1 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml
                name: P1 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p1_letzter_start
                name: P1 Last Automatic Start
              - entity: sensor.plantinator_bewasserung_auto_p2_freigabe
                name: P2 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p2_gussbedarf
                name: P2 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml
                name: P2 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p2_letzter_start
                name: P2 Last Automatic Start
          - type: entities
            title: P3 / P4
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p3_freigabe
                name: P3 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p3_gussbedarf
                name: P3 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml
                name: P3 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p3_letzter_start
                name: P3 Last Automatic Start
              - entity: sensor.plantinator_bewasserung_auto_p4_freigabe
                name: P4 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p4_gussbedarf
                name: P4 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml
                name: P4 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p4_letzter_start
                name: P4 Last Automatic Start
      - type: grid
        cards:
          - type: heading
            heading: Daily Status
            heading_style: title
            icon: mdi:calendar-today
          - type: entities
            title: Daily Counters
            show_header_toggle: false
            entities:
              - entity: input_number.plantinator_bewasserung_p1_heute_ml
                name: P1 Today ml
              - entity: input_number.plantinator_bewasserung_p2_heute_ml
                name: P2 Today ml
              - entity: input_number.plantinator_bewasserung_p3_heute_ml
                name: P3 Today ml
              - entity: input_number.plantinator_bewasserung_p4_heute_ml
                name: P4 Today ml
              - entity: >-
                  input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status
                name: Last Counted Status
              - entity: input_text.plantinator_bewasserung_auto_tageszaehler_datum
                name: Counter Date
              - entity: script.plantinator_bewasserung_auto_tageszaehler_reset
                name: Reset Daily Counters
      - type: grid
        cards:
          - type: heading
            heading: Long-Term and Operating Counters
            heading_style: title
            icon: mdi:counter
          - type: entities
            title: Weekly Consumption
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_p1_woche
                name: P1 This Week
              - entity: sensor.plantinator_bewasserung_p2_woche
                name: P2 This Week
              - entity: sensor.plantinator_bewasserung_p3_woche
                name: P3 This Week
              - entity: sensor.plantinator_bewasserung_p4_woche
                name: P4 This Week
          - type: entities
            title: Monthly Consumption
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_p1_monat
                name: P1 This Month
              - entity: sensor.plantinator_bewasserung_p2_monat
