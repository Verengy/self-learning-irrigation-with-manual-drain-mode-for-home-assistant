                name: Ramp-Up Shot Factor
              - entity: input_number.plantinator_bewasserung_wetback_peak_toleranz_prozent
                name: Peak OK Window (±)
              - entity: input_number.plantinator_bewasserung_wetback_nachguss_max_ml
                name: Maximum Top-Up
              - entity: script.plantinator_bewasserung_crop_maintenance_startwerte_setzen
                name: Set Maintenance Starting Values Only
              - entity: script.plantinator_bewasserung_crop_steering_standardwerte_setzen
                name: Set Crop Defaults
          - type: markdown
            title: How the Values Work
            content: >
              **Start** and **Stop** limit the irrigation window relative to
              the light period. After start, every plant waits for
              `peak − dryback`. During **ramp-up**, the complete water loss is
              restored with smaller shots in one complete sequence. The main
              sequence, feedback and one optional top-up are one ramp-up
              transaction. The measured peak must be inside the configurable
              `reference ± peak tolerance` window. Below it, one bounded top-up
              is attempted. If the calculated amount exceeds the remaining
              allowance, only the allowed amount is delivered. A final low peak
              creates a warning without locking the system. A high peak safely
              stops irrigation and alarm-locks the system. After successful
              feedback, **maintenance** uses normal shots and the maintenance
              dryback of the active recipe. Both drybacks are
              absolute differences in the moisture sensor's percentage
              values. Shot min/max, maximum shot count, the
              safety minimum, daily limit and every EXEC interlock remain
              hard limits.
