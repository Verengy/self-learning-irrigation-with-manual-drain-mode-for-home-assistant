  - title: Crop Steering
    path: plantinator-bewasserung-crop-steering
    icon: mdi:leaf
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Universal Crop Sources
            heading_style: title
            icon: mdi:connection
          - type: entities
            title: Source Mapping
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_crop_quellen_status
                name: Source Status
              - entity: input_text.plantinator_bewasserung_crop_stage_entity
                name: Stage Entity
              - entity: input_text.plantinator_bewasserung_crop_stage_attribut
                name: Optional Stage Attribute
              - entity: sensor.plantinator_bewasserung_plant_stage_roh
                name: Raw Stage Value
              - entity: input_text.plantinator_bewasserung_licht_an_entity
                name: Lights-On Entity
              - entity: input_text.plantinator_bewasserung_licht_an_attribut
                name: Optional Lights-On Attribute
              - entity: sensor.plantinator_bewasserung_licht_an_roh
                name: Raw Lights-On Value
              - entity: input_text.plantinator_bewasserung_licht_aus_entity
                name: Lights-Off Entity
              - entity: input_text.plantinator_bewasserung_licht_aus_attribut
                name: Optional Lights-Off Attribute
              - entity: sensor.plantinator_bewasserung_licht_aus_roh
                name: Raw Lights-Off Value
          - type: markdown
            title: Mapping Principle
            content: >
              Enter the entity that provides the external software value in
              Home Assistant. If the value is stored in an attribute instead
              of the entity state, also enter the attribute name. Empty
              sources automatically use the manual values.
          - type: entities
            title: Manual Fallback
            show_header_toggle: false
            entities:
              - entity: input_select.plantinator_bewasserung_crop_stage_manuell
                name: Internal Stage
              - entity: input_datetime.plantinator_bewasserung_licht_an_manuell
                name: Lights On
              - entity: input_datetime.plantinator_bewasserung_licht_aus_manuell
                name: Lights Off
      - type: grid
        cards:
          - type: heading
            heading: Stage Aliases
            heading_style: title
            icon: mdi:format-list-bulleted
          - type: markdown
            title: Translate External Names
            content: >
              Separate multiple names with commas. Matching is
              case-insensitive. Spaces, hyphens, and slashes are treated like
              underscores. Each external name may occur in exactly one list.
          - type: entities
            title: Alias Mapping
            show_header_toggle: false
            entities:
              - entity: input_text.plantinator_bewasserung_crop_alias_keimung
                name: Germination
              - entity: input_text.plantinator_bewasserung_crop_alias_steckling
                name: Clone
              - entity: input_text.plantinator_bewasserung_crop_alias_early_veg
                name: Early Veg
              - entity: input_text.plantinator_bewasserung_crop_alias_mid_veg
                name: Mid Veg
              - entity: input_text.plantinator_bewasserung_crop_alias_late_veg
                name: Late Veg
              - entity: input_text.plantinator_bewasserung_crop_alias_early_flower
                name: Early Flower
              - entity: input_text.plantinator_bewasserung_crop_alias_mid_flower
                name: Mid Flower
              - entity: input_text.plantinator_bewasserung_crop_alias_late_flower
                name: Late Flower
      - type: grid
        cards:
          - type: heading
            heading: Crop-Steering Settings
            heading_style: title
            icon: mdi:tune-variant
          - type: tile
            entity: input_boolean.plantinator_bewasserung_crop_individuelle_parameter
            name: Custom Parameters
            color: blue
          - type: entities
            title: Status / Actions
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_crop_einstellungen_status
                name: Settings Status
              - entity: input_select.plantinator_bewasserung_crop_substratprofil
                name: Substrate Profile
              - entity: input_number.plantinator_bewasserung_crop_substratvolumen_liter
                name: Substrate Volume
              - entity: input_number.plantinator_bewasserung_crop_ramp_up_dauer_minuten
                name: Ramp-Up Duration
              - entity: input_number.plantinator_bewasserung_crop_ramp_up_shot_faktor_prozent
                name: Ramp-Up Shot Factor
              - entity: script.plantinator_bewasserung_crop_steering_standardwerte_setzen
                name: Set Crop Defaults
          - type: markdown
            title: How the Values Work
            content: >
              **Start** and **Stop** limit the irrigation window relative to
              the light period. **Dryback** determines the normal irrigation
              threshold. **Shot %** refers to substrate volume; the global
              shot minimum and maximum remain additional limits. During
              **Ramp-up**, the shot factor reduces this already limited shot
              size. Example: 300 ml at 60% becomes 180 ml. The global moisture
              minimum always remains the emergency boundary.
