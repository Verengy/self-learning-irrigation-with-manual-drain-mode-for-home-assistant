title: Universal Self-Learning Irrigation
views:
  - title: Overview
    path: plantinator-bewasserung
    icon: mdi:water-pump
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: System Permissions
            heading_style: title
            icon: mdi:shield-check
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Main Switch
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automation
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: System Lock
            color: red
          - type: tile
            entity: input_boolean.plantinator_bewasserung_exec_laeuft
            name: EXEC Running
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_laeuft
            name: Shot EXEC Running
            color: orange
          - type: tile
            entity: input_boolean.plantinator_bewasserung_shot_exec_reserviert
            name: Shot EXEC Reserved
            color: yellow
          - type: tile
            entity: input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft
            name: Circulation Running
            color: blue
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Acknowledge Alarm
            color: green
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state: bereit
          - type: tile
            entity: input_button.plantinator_bewasserung_alarm_quittieren
            name: Acknowledge Alarm
            color: red
            visibility:
              - condition: state
                entity: sensor.plantinator_bewasserung_alarm_status
                state:
                  - verriegelt
                  - fehler_nicht_quittierbar
          - type: tile
            entity: script.plantinator_bewasserung_sicher_stop
            name: EMERGENCY STOP
            color: red
            tap_action:
              action: call-service
              service: script.plantinator_bewasserung_sicher_stop
          - type: entities
            title: Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_mapping_status
                name: Mapping Status
              - entity: sensor.plantinator_bewasserung_profil_status
                name: Profile Status
              - entity: sensor.plantinator_bewasserung_exec_freigabe
                name: EXEC Permission
              - entity: sensor.plantinator_bewasserung_shot_exec_freigabe
                name: Shot EXEC Permission
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Automatic Basic Permission
              - entity: sensor.plantinator_bewasserung_tank_umwalzung_freigabe
                name: Circulation Permission
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Total Irrigation Demand
              - entity: sensor.plantinator_bewasserung_mess_drain_status
                name: Measuring-Drain Status
              - entity: sensor.plantinator_bewasserung_alarm_status
                name: Alarm Status
              - entity: sensor.plantinator_bewasserung_kritischer_systemstatus
                name: Critical System Status
              - entity: sensor.plantinator_bewasserung_sensoralter_status
                name: Sensor-Age Status
      - type: grid
        cards:
          - type: heading
            heading: Automatic Short Status
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: timer.plantinator_bewasserung_shot_exec_wartezeit
            name: Shot-EXEC Wait Time
            color: orange
          - type: markdown
            title: Automatic / Plants
            content: >
              | Value | Status |

              |---|---|

              | Automatic Status | `{{
              states('sensor.plantinator_bewasserung_auto_status') }}` |

              | Basic Permission | `{{
              states('sensor.plantinator_bewasserung_auto_grundfreigabe') }}` |

              | Crop Permission | `{{
              states('sensor.plantinator_bewasserung_auto_crop_freigabe') }}` |

              | Next Plant | `{{
              states('sensor.plantinator_bewasserung_auto_naechste_pflanze') }}`
              |

              | EXEC | `{% set s =
              states('sensor.plantinator_bewasserung_exec_status') %}{{
              s.rsplit('_', 1)[0] if s and s.split('_')[-1].isdigit() else s }}`
              |

              | Shot EXEC | `{% set s =
              states('sensor.plantinator_bewasserung_shot_exec_status') %}{{
              s.rsplit('_', 1)[0] if s and s.split('_')[-1].isdigit() else s }}`
              |

              | Circulation | `{{
              states('input_text.plantinator_bewasserung_tank_umwalzung_status')
              }}` |

              | Last Counted | `{{
              states('input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status')
              }}` |
          - type: markdown
            title: Plant Overview
            content: >
              | Plant | Moisture | State | Demand | Automatic | Recommendation | Today
              | Shot |

              |---|---:|---|---|---|---:|---:|---|

              | P1 | {{
              states('sensor.plantinator_bewasserung_p1_bodenfeuchte_wert') }} %
              | {{ states('sensor.plantinator_bewasserung_p1_feuchtezustand') }}
              | {{ states('sensor.plantinator_bewasserung_p1_gussbedarf') }} |
              {{ states('sensor.plantinator_bewasserung_auto_p1_freigabe') }} |
              {{
              states('sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml')
              }} ml | {{
              states('input_number.plantinator_bewasserung_p1_heute_ml') }} ml |
              {{ state_attr('sensor.plantinator_bewasserung_p1_shot_plan',
              'shot_sequence_ml') }} |

              | P2 | {{
              states('sensor.plantinator_bewasserung_p2_bodenfeuchte_wert') }} %
              | {{ states('sensor.plantinator_bewasserung_p2_feuchtezustand') }}
              | {{ states('sensor.plantinator_bewasserung_p2_gussbedarf') }} |
              {{ states('sensor.plantinator_bewasserung_auto_p2_freigabe') }} |
              {{
              states('sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml')
              }} ml | {{
              states('input_number.plantinator_bewasserung_p2_heute_ml') }} ml |
              {{ state_attr('sensor.plantinator_bewasserung_p2_shot_plan',
              'shot_sequence_ml') }} |

              | P3 | {{
              states('sensor.plantinator_bewasserung_p3_bodenfeuchte_wert') }} %
              | {{ states('sensor.plantinator_bewasserung_p3_feuchtezustand') }}
              | {{ states('sensor.plantinator_bewasserung_p3_gussbedarf') }} |
              {{ states('sensor.plantinator_bewasserung_auto_p3_freigabe') }} |
              {{
              states('sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml')
              }} ml | {{
              states('input_number.plantinator_bewasserung_p3_heute_ml') }} ml |
              {{ state_attr('sensor.plantinator_bewasserung_p3_shot_plan',
              'shot_sequence_ml') }} |

              | P4 | {{
              states('sensor.plantinator_bewasserung_p4_bodenfeuchte_wert') }} %
              | {{ states('sensor.plantinator_bewasserung_p4_feuchtezustand') }}
              | {{ states('sensor.plantinator_bewasserung_p4_gussbedarf') }} |
              {{ states('sensor.plantinator_bewasserung_auto_p4_freigabe') }} |
              {{
              states('sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml')
              }} ml | {{
              states('input_number.plantinator_bewasserung_p4_heute_ml') }} ml |
              {{ state_attr('sensor.plantinator_bewasserung_p4_shot_plan',
              'shot_sequence_ml') }} |
      - type: grid
        cards:
          - type: heading
            heading: Histories
            heading_style: title
            icon: mdi:chart-line
          - type: history-graph
            title: Substrate-Moisture History
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_p1_bodenfeuchte_wert
                name: P1
              - entity: sensor.plantinator_bewasserung_p2_bodenfeuchte_wert
                name: P2
              - entity: sensor.plantinator_bewasserung_p3_bodenfeuchte_wert
                name: P3
              - entity: sensor.plantinator_bewasserung_p4_bodenfeuchte_wert
                name: P4
          - type: history-graph
            title: Irrigation Demand / Automatic
            hours_to_show: 12
            entities:
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Total Demand
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Next Plant
              - entity: sensor.plantinator_bewasserung_shot_exec_status
                name: Shot EXEC
  - title: Automation
    path: plantinator-bewasserung-automatik
    icon: mdi:robot
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Automation Permissions
            heading_style: title
            icon: mdi:robot
          - type: tile
            entity: input_boolean.plantinator_bewasserung_auto_controller_aktiv
            name: Auto Controller
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_automatik
            name: Automation
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_aktiv
            name: Main Switch
            color: green
          - type: tile
            entity: input_boolean.plantinator_bewasserung_sperre
            name: System Lock
            color: red
          - type: entities
            title: Automatic Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_status
                name: Automatic Status
              - entity: input_text.plantinator_bewasserung_auto_status
                name: Auto Status Input
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Basic Permission
              - entity: sensor.plantinator_bewasserung_auto_crop_freigabe
                name: Crop Permission
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Next Plant
              - entity: input_text.plantinator_bewasserung_auto_letzte_pflanze
                name: Last Plant
              - entity: >-
                  input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status
                name: Last Counted Status
              - entity: input_datetime.plantinator_bewasserung_auto_letzter_check
                name: Last Auto Check
              - entity: script.plantinator_bewasserung_auto_check
                name: Run Auto Check Now
              - entity: script.plantinator_bewasserung_auto_standardwerte_setzen
                name: Set Automation Defaults
      - type: grid
        cards:
          - type: heading
            heading: Automation Parameters
            heading_style: title
            icon: mdi:tune
          - type: entities
            title: Parameters
            show_header_toggle: false
            entities:
              - entity: >-
                  input_number.plantinator_bewasserung_auto_check_intervall_minuten
                name: Check Interval Minutes
              - entity: >-
                  input_number.plantinator_bewasserung_auto_mindestpause_pflanze_minuten
                name: Minimum Pause per Plant
              - entity: input_number.plantinator_bewasserung_max_ml_pro_tag
                name: Maximum ml per Day / Plant
              - entity: sensor.plantinator_bewasserung_crop_normalguss_erlaubnis
                name: Crop Normal-Irrigation Permission
              - entity: sensor.plantinator_bewasserung_gesamt_gussbedarf
                name: Total Irrigation Demand
          - type: entities
            title: Daily Counters
            show_header_toggle: false
            entities:
              - entity: input_number.plantinator_bewasserung_p1_heute_ml
                name: P1 Today ml
              - entity: input_number.plantinator_bewasserung_p2_heute_ml
                name: P2 Today ml
              - entity: input_number.plantinator_bewasserung_p3_heute_ml
                name: P3 Today ml
              - entity: input_number.plantinator_bewasserung_p4_heute_ml
                name: P4 Today ml
              - entity: >-
                  input_text.plantinator_bewasserung_auto_letzter_gezaehlter_status
                name: Last Counted Status
              - entity: input_text.plantinator_bewasserung_auto_tageszaehler_datum
                name: Counter Date
              - entity: script.plantinator_bewasserung_auto_tageszaehler_reset
                name: Reset Daily Counters
      - type: grid
        cards:
          - type: heading
            heading: Long-Term and Operating Counters
            heading_style: title
            icon: mdi:counter
          - type: entities
            title: Weekly Consumption
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_p1_woche
                name: P1 This Week
              - entity: sensor.plantinator_bewasserung_p2_woche
                name: P2 This Week
              - entity: sensor.plantinator_bewasserung_p3_woche
                name: P3 This Week
              - entity: sensor.plantinator_bewasserung_p4_woche
                name: P4 This Week
          - type: entities
            title: Monthly Consumption
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_p1_monat
                name: P1 This Month
              - entity: sensor.plantinator_bewasserung_p2_monat
                name: P2 This Month
              - entity: sensor.plantinator_bewasserung_p3_monat
                name: P3 This Month
              - entity: sensor.plantinator_bewasserung_p4_monat
                name: P4 This Month
          - type: entities
            title: Total Consumption
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_p1_gesamt_ml
                name: P1 Total
              - entity: sensor.plantinator_bewasserung_p2_gesamt_ml
                name: P2 Total
              - entity: sensor.plantinator_bewasserung_p3_gesamt_ml
                name: P3 Total
              - entity: sensor.plantinator_bewasserung_p4_gesamt_ml
                name: P4 Total
          - type: entities
            title: Operating Counters
            show_header_toggle: false
            entities:
              - entity: counter.plantinator_bewasserung_p1_erfolgreiche_guesse
                name: P1 Successful Irrigations
              - entity: counter.plantinator_bewasserung_p2_erfolgreiche_guesse
                name: P2 Successful Irrigations
              - entity: counter.plantinator_bewasserung_p3_erfolgreiche_guesse
                name: P3 Successful Irrigations
              - entity: counter.plantinator_bewasserung_p4_erfolgreiche_guesse
                name: P4 Successful Irrigations
              - entity: sensor.plantinator_bewasserung_pumpenlaufzeit_gesamt
                name: Total Pump Runtime
              - entity: counter.plantinator_bewasserung_abbrueche_gesamt
                name: Total Aborts
              - entity: counter.plantinator_bewasserung_hardwarefehler_gesamt
                name: Total Hardware Faults
              - entity: counter.plantinator_bewasserung_mess_drain_laeufe_gesamt
                name: Total Measuring-Drain Runs
      - type: grid
        cards:
          - type: heading
            heading: Plant Permissions
            heading_style: title
            icon: mdi:sprout
          - type: entities
            title: P1 / P2
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p1_freigabe
                name: P1 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p1_gussbedarf
                name: P1 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p1_empfehlung_normalguss_ml
                name: P1 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p1_letzter_start
                name: P1 Last Automatic Start
              - entity: sensor.plantinator_bewasserung_auto_p2_freigabe
                name: P2 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p2_gussbedarf
                name: P2 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p2_empfehlung_normalguss_ml
                name: P2 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p2_letzter_start
                name: P2 Last Automatic Start
          - type: entities
            title: P3 / P4
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_auto_p3_freigabe
                name: P3 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p3_gussbedarf
                name: P3 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p3_empfehlung_normalguss_ml
                name: P3 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p3_letzter_start
                name: P3 Last Automatic Start
              - entity: sensor.plantinator_bewasserung_auto_p4_freigabe
                name: P4 Automatic Permission
              - entity: sensor.plantinator_bewasserung_p4_gussbedarf
                name: P4 Irrigation Demand
              - entity: sensor.plantinator_bewasserung_p4_empfehlung_normalguss_ml
                name: P4 Recommendation ml
              - entity: input_datetime.plantinator_bewasserung_auto_p4_letzter_start
                name: P4 Last Automatic Start
  - title: EXEC
    path: plantinator-bewasserung-exec
    icon: mdi:water-pump
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: EXEC Status
            heading_style: title
            icon: mdi:shield-check
          - type: entities
            title: Permission / Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_exec_freigabe
                name: EXEC Permission
              - entity: sensor.plantinator_bewasserung_exec_status
                name: EXEC Status
              - entity: input_text.plantinator_bewasserung_exec_status
                name: EXEC Status Input
              - entity: input_boolean.plantinator_bewasserung_exec_laeuft
                name: EXEC Running
              - entity: input_boolean.plantinator_bewasserung_exec_abort
                name: EXEC Abort Flag
              - entity: counter.plantinator_bewasserung_stop_generation
                name: Stop Generation
              - entity: input_text.plantinator_bewasserung_exec_letzter_vorgang
                name: Last Operation
              - entity: input_text.plantinator_bewasserung_exec_letzte_pflanze
                name: Last Plant
              - entity: input_datetime.plantinator_bewasserung_exec_letzter_start
                name: Last Start
              - entity: input_datetime.plantinator_bewasserung_exec_letztes_ende
                name: Last End
          - type: entities
            title: Safety Actions
            show_header_toggle: false
            entities:
              - entity: script.plantinator_bewasserung_shot_exec_sicher_stop
                name: Shot EXEC Safe Stop
              - entity: script.plantinator_bewasserung_sicher_stop
                name: Safe Stop
              - entity: script.plantinator_bewasserung_pumpe_aus
                name: Pump Off
              - entity: script.plantinator_bewasserung_alle_ventile_zu
                name: Close All Valves
              - entity: script.plantinator_bewasserung_exec_standardwerte_setzen
                name: Set EXEC Defaults
      - type: grid
        cards:
          - type: heading
            heading: Shot EXEC
            heading_style: title
            icon: mdi:format-list-checks
          - type: entities
            title: Shot EXEC Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_shot_exec_freigabe
                name: Shot EXEC Permission
              - entity: sensor.plantinator_bewasserung_shot_exec_status
                name: Shot EXEC Status
              - entity: input_text.plantinator_bewasserung_shot_exec_status
                name: Shot EXEC Status Input
              - entity: input_boolean.plantinator_bewasserung_shot_exec_laeuft
                name: Shot EXEC Running
              - entity: timer.plantinator_bewasserung_shot_exec_wartezeit
                name: Shot-EXEC Wait Time
              - entity: >-
                  input_boolean.plantinator_bewasserung_shot_exec_stop_anforderung
                name: Stop Request
              - entity: input_boolean.plantinator_bewasserung_exec_abort
                name: EXEC Abort Flag
              - entity: >-
                  input_boolean.plantinator_bewasserung_mess_drain_stop_anforderung
                name: Measuring-Drain Stop Request
              - entity: >-
                  input_boolean.plantinator_bewasserung_tank_umwalzung_stop_anforderung
                name: Circulation Stop Request
              - entity: input_text.plantinator_bewasserung_shot_exec_letzte_pflanze
                name: Last Plant
              - entity: input_datetime.plantinator_bewasserung_shot_exec_letzter_start
                name: Last Start
              - entity: input_datetime.plantinator_bewasserung_shot_exec_letztes_ende
                name: Last End
              - entity: input_button.plantinator_bewasserung_shot_plan_stop
                name: Stop Shot Plan
          - type: entities
            title: Shot-Plan Start Buttons
            show_header_toggle: false
            entities:
              - entity: input_button.plantinator_bewasserung_p1_shot_plan_start
                name: P1 Shot-Plan Start
              - entity: input_button.plantinator_bewasserung_p2_shot_plan_start
                name: P2 Shot-Plan Start
              - entity: input_button.plantinator_bewasserung_p3_shot_plan_start
                name: P3 Shot-Plan Start
              - entity: input_button.plantinator_bewasserung_p4_shot_plan_start
                name: P4 Shot-Plan Start
      - type: grid
        cards:
          - type: heading
            heading: Manual Normal Irrigation
            heading_style: title
            icon: mdi:water-plus
          - type: entities
            title: Normal-Irrigation Settings
            show_header_toggle: false
            entities:
              - entity: input_number.plantinator_bewasserung_manueller_testguss_ml
                name: Manual Test Irrigation ml
              - entity: sensor.plantinator_bewasserung_manueller_testguss_sekunden
                name: Manual Test Irrigation Seconds
              - entity: input_number.plantinator_bewasserung_ventil_vorlauf_sekunden
                name: Valve Pre-Run
              - entity: input_number.plantinator_bewasserung_ventil_nachlauf_sekunden
                name: Valve Post-Run
          - type: entities
            title: Normal-Irrigation Buttons
            show_header_toggle: false
            entities:
              - entity: input_button.plantinator_bewasserung_p1_normalguss_start
                name: P1 Normal-Irrigation Start
              - entity: input_button.plantinator_bewasserung_p2_normalguss_start
                name: P2 Normal-Irrigation Start
              - entity: input_button.plantinator_bewasserung_p3_normalguss_start
                name: P3 Normal-Irrigation Start
              - entity: input_button.plantinator_bewasserung_p4_normalguss_start
                name: P4 Normal-Irrigation Start
      - type: grid
        cards:
          - type: heading
            heading: Actuators (via Mapping)
            heading_style: title
            icon: mdi:valve
          - type: entities
            title: Mapped Hardware Status
            show_header_toggle: false
            entities:
              - entity: sensor.plantinator_bewasserung_pumpe_status_gemappt
                name: Pump
              - entity: sensor.plantinator_bewasserung_p1_ventil_status_gemappt
                name: Valve P1
              - entity: sensor.plantinator_bewasserung_p2_ventil_status_gemappt
                name: Valve P2
              - entity: sensor.plantinator_bewasserung_p3_ventil_status_gemappt
                name: Valve P3
              - entity: sensor.plantinator_bewasserung_p4_ventil_status_gemappt
                name: Valve P4
              - entity: sensor.plantinator_bewasserung_tank_umwalzung_status_gemappt
                name: Reservoir Circulation
              - entity: sensor.plantinator_bewasserung_wasserstand_status_gemappt
                name: Water Level
  - title: Circulation
    path: plantinator-bewasserung-umwaelzung
    icon: mdi:autorenew
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Circulation Control
            heading_style: title
            icon: mdi:autorenew
          - type: tile
            entity: input_boolean.plantinator_bewasserung_tank_umwalzung_verwenden
            name: Use Circulation
            color: green
          - type: tile
            entity: >-
              input_boolean.plantinator_bewasserung_tank_umwalzung_zyklisch_aktiv
            name: Cyclic Mode Enabled
            color: blue
          - type: tile
            entity: >-
              input_boolean.plantinator_bewasserung_tank_umwalzung_pre_guss_aktiv
            name: Pre-Irrigation Enabled
            color: blue
          - type: tile
            entity: input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft
            name: Currently Running
            color: orange
          - type: entities
            title: Manual Actions
            show_header_toggle: false
            entities:
              - entity: >-
                  input_button.plantinator_bewasserung_tank_umwalzung_manuell_start
                name: Start Manually
              - entity: >-
                  input_button.plantinator_bewasserung_tank_umwalzung_manuell_stop
                name: Stop Manually
              - entity: script.plantinator_bewasserung_tank_umwalzung_zyklisch_lauf
