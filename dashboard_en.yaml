  - title: Debug
    path: plantinator-bewasserung-debug
    icon: mdi:bug
    type: sections
    max_columns: 4
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Last 20 Errors
            heading_style: title
            icon: mdi:alert-circle-outline
          - type: markdown
            title: Warnings and Critical Errors
            content: |
              {% set ns = namespace(count=0) %}
              {% for i in range(1, 21) %}
                {% set nr = '%02d' | format(i) %}
                {% set entry = states('input_text.plantinator_bewasserung_fehlerhistorie_' ~ nr) %}
                {% if entry not in ['', 'leer', 'unknown', 'unavailable', 'none'] %}
                  {% set ns.count = ns.count + 1 %}
              **{{ ns.count }}.** {{ '🔴' if 'KRITISCH' in entry else '🟠' }} `{{ entry }}`<br>
                {% endif %}
              {% endfor %}
              {% if ns.count == 0 %}
              ✅ No warnings or critical errors have been stored since the history was installed or cleared.
              {% endif %}
          - type: entities
            title: Manage Error History
            show_header_toggle: false
            entities:
              - entity: script.plantinator_bewasserung_fehlerhistorie_leeren
                name: Delete All 20 Entries
      - type: grid
        cards:
          - type: heading
            heading: Live Diagnostics
            heading_style: title
            icon: mdi:clipboard-pulse
          - type: markdown
            title: Current Diagnostics
            content: >
              | Area | Value |

              |---|---|

              | Debug Core Status | {{
              states('sensor.plantinator_bewasserung_debug_kernstatus') }} |

              | Automatic Status | {{
              states('sensor.plantinator_bewasserung_auto_status') }} |

              | Basic Permission | {{
              states('sensor.plantinator_bewasserung_auto_grundfreigabe') }} |

              | EXEC Permission | {{
              states('sensor.plantinator_bewasserung_exec_freigabe') }} |

              | Shot EXEC Permission | {{
              states('sensor.plantinator_bewasserung_shot_exec_freigabe') }} |

              | Shot EXEC Status | {{
              states('sensor.plantinator_bewasserung_shot_exec_status') }} |

              | Shot EXEC Running | {{
              states('input_boolean.plantinator_bewasserung_shot_exec_laeuft')
              }} |

              | Shot EXEC Reserved | {{
              states('input_boolean.plantinator_bewasserung_shot_exec_reserviert')
              }} |

              | EXEC Running | {{
              states('input_boolean.plantinator_bewasserung_exec_laeuft') }} |

              | EXEC Abort | {{
              states('input_boolean.plantinator_bewasserung_exec_abort') }} |

              | Circulation Permission | {{
              states('sensor.plantinator_bewasserung_tank_umwalzung_freigabe')
              }} |

              | Circulation Running | {{
              states('input_boolean.plantinator_bewasserung_tank_umwalzung_laeuft')
              }} |

              | Pump | {{
              states('sensor.plantinator_bewasserung_pumpe_status_gemappt') }} |

              | Valve P1 | {{
              states('sensor.plantinator_bewasserung_p1_ventil_status_gemappt')
              }} |

              | Valve P2 | {{
              states('sensor.plantinator_bewasserung_p2_ventil_status_gemappt')
              }} |

              | Valve P3 | {{
              states('sensor.plantinator_bewasserung_p3_ventil_status_gemappt')
              }} |

              | Valve P4 | {{
              states('sensor.plantinator_bewasserung_p4_ventil_status_gemappt')
              }} |
          - type: entities
            title: Scripts / Buttons
            show_header_toggle: false
            entities:
              - entity: script.plantinator_bewasserung_p1_shot_plan_ausfuehren
                name: P1 Execute Shot
              - entity: script.plantinator_bewasserung_p2_shot_plan_ausfuehren
                name: P2 Execute Shot
              - entity: script.plantinator_bewasserung_p3_shot_plan_ausfuehren
                name: P3 Execute Shot
              - entity: script.plantinator_bewasserung_p4_shot_plan_ausfuehren
                name: P4 Execute Shot
              - entity: script.plantinator_bewasserung_shot_exec_sicher_stop
                name: Shot EXEC Safe Stop
              - entity: script.plantinator_bewasserung_sicher_stop
                name: EXEC Safe Stop
      - type: grid
        cards:
          - type: heading
            heading: Auto-Check Debug
            heading_style: title
            icon: mdi:bug
          - type: markdown
            title: Auto-Check Core Logic
            content: >
              ## Auto-Check


              **Automatic Status:** `{{
              states('sensor.plantinator_bewasserung_auto_status') }}`  

              **Auto Status Input:** `{{
              states('input_text.plantinator_bewasserung_auto_status') }}`  

              **Basic Permission:** `{{
              states('sensor.plantinator_bewasserung_auto_grundfreigabe') }}`  

              **Next Plant raw:** `{{
              states('sensor.plantinator_bewasserung_auto_naechste_pflanze')
              }}`  

              **Next Plant integer:** `{{
              states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0) }}`  


              **nextp == 1:** `{{
              (states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0)) == 1 }}`  

              **nextp == 2:** `{{
              (states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0)) == 2 }}`  

              **nextp == 3:** `{{
              (states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0)) == 3 }}`  

              **nextp == 4:** `{{
              (states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0)) == 4 }}`  


              {% set grund =
              states('sensor.plantinator_bewasserung_auto_grundfreigabe') | trim
              %}

              {% set nextp =
              states('sensor.plantinator_bewasserung_auto_naechste_pflanze') |
              int(0) %}

              {% if grund == 'shot_exec_nicht_frei' %}

              **EXPECTED:** warte_shot_exec_laeuft

              {% elif grund != 'frei' %}

              **EXPECTED:** blockiert_{{ grund }}

              {% elif nextp in [1,2,3,4] %}

              **EXPECTED:** START P{{ nextp }}

              {% else %}

              **EXPECTED:** kein_guss_faellig

              {% endif %}
          - type: entities
            title: Auto-Trace Relevant Entities
            show_header_toggle: false
            entities:
              - entity: script.plantinator_bewasserung_auto_check
                name: Auto-Check Script
              - entity: script.plantinator_bewasserung_auto_pflanze_starten
                name: Start Automatic Plant
              - entity: sensor.plantinator_bewasserung_auto_status
                name: Automatic Status
              - entity: input_text.plantinator_bewasserung_auto_status
                name: Auto Status Input
              - entity: sensor.plantinator_bewasserung_auto_naechste_pflanze
                name: Next Plant
              - entity: sensor.plantinator_bewasserung_auto_grundfreigabe
                name: Basic Permission
              - entity: sensor.plantinator_bewasserung_exec_freigabe
                name: EXEC Permission
              - entity: sensor.plantinator_bewasserung_shot_exec_freigabe
                name: Shot EXEC Permission
              - entity: input_boolean.plantinator_bewasserung_shot_exec_reserviert
                name: Shot EXEC Reserved
              - entity: sensor.plantinator_bewasserung_tank_umwalzung_freigabe
                name: Circulation Permission
      - type: grid
        cards:
          - type: heading
            heading: Debug Logger
            heading_style: title
            icon: mdi:file-document-edit-outline
          - type: entities
            title: Logger
            show_header_toggle: false
            entities:
              - entity: input_boolean.plantinator_bewasserung_debug_logger_aktiv
                name: Debug Logger Enabled
              - entity: sensor.plantinator_bewasserung_debug_logger_status
                name: Debug Logger Status
              - entity: input_text.plantinator_bewasserung_debug_logger_status
                name: Debug Logger Status Input
              - entity: input_text.plantinator_bewasserung_debug_logger_letzte_meldung
                name: Last Message
              - entity: >-
                  input_number.plantinator_bewasserung_debug_logger_intervall_sekunden
                name: Interval Seconds
              - entity: sensor.plantinator_bewasserung_debug_kernstatus
                name: Debug Core Status
              - entity: input_button.plantinator_bewasserung_debug_log_test
                name: Write Test
              - entity: input_button.plantinator_bewasserung_debug_log_einmal
                name: Write Snapshot
              - entity: input_button.plantinator_bewasserung_debug_logdatei_leeren
                name: Clear Log File
              - entity: script.plantinator_bewasserung_debug_logger_standardwerte_setzen
                name: Set Debug Defaults
